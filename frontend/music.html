<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苦海音乐</title>
<link rel="stylesheet" href="music.css?v=20261112">
</head>
<body>
<div class="container">
  <a href="/game.html" class="back-link">← 返回游戏站</a>

  <header class="mz-hero">
    <div class="mz-kicker">KŪHǍI · SOUND</div>
    <h1>苦海音乐</h1>
    <p>网易云曲库点播 · Spotify 内嵌 · 自己的歌单</p>
    <div class="mz-hero-line"><span id="mzNowHint">还没开始听</span></div>
  </header>

  <div class="mz-layout">
  <main class="mz-main">

  <!-- 大尺寸播放器 -->
  <div class="player" id="player">
    <div class="player-cover" id="cover">🎵</div>
    <div class="player-title" id="nowTitle">♫ 未播放</div>
    <div class="player-artist" id="nowArtist">搜索歌曲开始播放</div>
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="time-row">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>
    <div class="controls">
      <button onclick="prevSong()" title="上一首">⏮</button>
      <button class="play-btn" onclick="togglePlay()" id="playBtn" title="播放/暂停">▶</button>
      <button onclick="nextSong()" title="下一首">⏭</button>
    </div>
  </div>

  <!-- 热门试听：点封面直接播放（放最上面，先能听懂再搜索） -->
  <div id="hotRecommend">
    <div class="section-title">🔥 热门试听 <span style="font-size:12px;color:#64748b;font-weight:400">点封面直接播放</span></div>
    <div class="hot-grid" id="hotGrid"><div class="empty">加载中...</div></div>
  </div>

  <!-- 搜索框 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="输入歌曲名搜索网易云..." />
    <button onclick="searchMusic()">搜索</button>
  </div>


  <!-- 搜索结果 -->
  <div id="searchResult" style="display:none">
    <div class="section-title">🔍 搜索结果</div>
    <ul class="song-list" id="searchList"></ul>
  </div>

  <!-- Spotify：与上面的网易云播放器并存，互不影响（关掉这张卡片不影响原有播放） -->
  <div class="spotify-card" id="spotifyCard">
    <div class="sp-head">
      <span class="sp-dot"></span>
      <div>
        <div class="sp-title">Spotify</div>
        <div class="sp-sub">粘贴歌单 / 单曲 / 专辑 / 艺人链接，直接内嵌播放</div>
      </div>
    </div>
    <div class="sp-input-row">
      <input id="spInput" type="text" spellcheck="false" autocomplete="off"
             placeholder="https://open.spotify.com/playlist/…（或 spotify:track:…）" />
      <button id="spLoad">载入</button>
    </div>
    <div class="sp-msg" id="spMsg">载入过的会记住（最多 8 个），点标签可切换。</div>
    <div class="sp-chips" id="spChips"></div>
    <div class="sp-frame" id="spFrame"></div>
    <div class="sp-foot">
      公开歌单/单曲链接即可播放；要听会员曲库或个人收藏，先在浏览器里登录 Spotify。
    </div>
  </div>
  </main>

  <aside class="mz-side">
    <div class="pl-panel" id="playlistPanel"></div>
    <div class="mz-tip">
      歌单存在这台浏览器里，清缓存会丢；换设备不会同步。
    </div>
  </aside>
  </div>
</div>

<audio id="audio"></audio>

<script type="module">
// 导入工具函数
import { escapeHtml, writeMusicNow, readMusicNow, onMusicNow } from '/common.js?v=20261027';
import { mountSpotify } from '/spotify.js?v=20261109';
import { Playlists, mountPlaylistPanel } from '/music-playlists.js?v=20261112';

// Spotify 面板：与网易云播放器完全独立的一套状态，互不干扰
mountSpotify(document.getElementById('spotifyCard'));

// 网易云解析接口（国内直连可用，支持 CORS；dataiqs.com 在国内被劫持，已弃用）
const GD_API = 'https://music-api.gdstudio.xyz/api.php';

// 获取 DOM 元素
const audio = document.getElementById('audio');
const player = document.getElementById('player');
const playBtn = document.getElementById('playBtn');

// 歌单数据由 music-playlists.js 管理；这里的 playlist 只是"当前歌单"的镜像，
// 用来支持上一首/下一首和"正在播放"高亮，不直接写 localStorage。
let playlist = [];
let currentIndex = -1; // 当前播放的歌在歌单中的索引，-1 表示没在播放
let nowSong = null;    // 当前曲目（与右下角小播放器共用 music_now）

// 只保存联调需要的字段
function snapMusic(song) {
  return {
    id: song.id || song.name,
    name: song.name || '',
    artist: song.artist || '',
    artwork: song.artwork || '',
    preview: song.preview || '',
    urlId: song.urlId || '',
    source: song.source || '',
  };
}

console.log('[音乐模块] 初始化完成，歌单长度:', playlist.length);

// 初始化：渲染歌单 + 热门试听
playlist = Playlists.songs();
renderPlaylist();

// 侧栏歌单面板：点哪首歌就播哪首（索引对应当前歌单）
mountPlaylistPanel(document.getElementById('playlistPanel'), {
  onPlay(i) {
    const s = playlist[i];
    if (!s) return;
    currentIndex = i;
    playSong(s);
  },
});

// 换歌单 / 加歌 / 删歌 都会回调，页面只同步镜像与前高亮
Playlists.onChange((songs) => {
  playlist = songs;
  if (currentIndex >= songs.length) currentIndex = -1;
  Playlists.setNowPlaying(currentIndex, !audio.paused);
});

// ===== 热门试听 =====
// 只放几首，点封面就播（不用先搜索），结果缓存 6 小时
const HOT_QUERIES = ['晴天', '七里香', '稻香', '起风了', '海阔天空', '光年之外'];
const HOT_CACHE_KEY = 'music_hot_v3';
const HOT_CACHE_TTL = 6 * 3600 * 1000;

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// 解析接口并发多了会限流（返回非数组），这里逐首请求并在失败时重试一次
async function searchOne(kw) {
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const r = await fetch(`${GD_API}?types=search&source=netease&name=${encodeURIComponent(kw)}&count=5&pages=1`);
      const rows = await r.json();
      const x = Array.isArray(rows) ? rows[0] : null;
      if (!x || !x.id) { await sleep(350); continue; }

      // 封面：pic 接口返回的是 JSON（{url}），不能直接当图片地址用
      let artwork = '';
      if (x.pic_id) {
        try {
          const pr = await fetch(`${GD_API}?types=pic&source=netease&id=${encodeURIComponent(x.pic_id)}&size=300`);
          const pd = await pr.json();
          artwork = pd?.url || '';
        } catch { /* 没封面就用 emoji 兜底 */ }
      }

      return {
        id: x.id,
        name: x.name || kw,
        artist: Array.isArray(x.artist) ? x.artist.join('/') : (x.artist || ''),
        album: x.album || '',
        artwork,
        preview: '',
        urlId: x.url_id || x.id,
        source: x.source || 'netease',
        duration: 0,
      };
    } catch { await sleep(350); }
  }
  return null;
}

function renderHot(songs) {
  window._hotTracks = songs;
  document.getElementById('hotGrid').innerHTML = songs.map((s, i) => `
    <div class="hot-card" onclick="playHotTrack(${i})">
      <div class="hot-cover">${s.artwork ? `<img src="${s.artwork}" alt="${escapeHtml(s.name)}" loading="lazy" referrerpolicy="no-referrer">` : '🎵'}</div>
      <div class="hot-name">${escapeHtml(s.name)}</div>
      <div class="hot-artist">${escapeHtml(s.artist)}</div>
      <button class="hot-add" title="加入当前歌单" onclick="event.stopPropagation(); addHotToPlaylist(${i})">＋</button>
    </div>
  `).join('');
}

async function loadHotTracks() {
  try {
    const c = JSON.parse(localStorage.getItem(HOT_CACHE_KEY) || 'null');
    if (c && Date.now() - c.t < HOT_CACHE_TTL && Array.isArray(c.songs) && c.songs.length) {
      renderHot(c.songs);
      return;
    }
  } catch { /* 缓存坏了就重新拉 */ }

  // 逐首加载（并发会被接口限流，导致只剩三四首）
  const songs = [];
  for (const k of HOT_QUERIES) {
    const s = await searchOne(k);
    if (s) songs.push(s);
    await sleep(150);
  }
  if (!songs.length) {
    document.getElementById('hotGrid').innerHTML = '<div class="empty">热门加载失败，可直接搜索</div>';
    return;
  }
  try { localStorage.setItem(HOT_CACHE_KEY, JSON.stringify({ t: Date.now(), songs })); } catch { /* 忽略 */ }
  renderHot(songs);
}

window.playHotTrack = function(i) {
  const s = (window._hotTracks || [])[i];
  if (!s) return;
  playSong(s);
};

loadHotTracks();

/**
 * 搜索歌曲
 * @param {string} keyword - 搜索关键词（可选，不传则从输入框读取）
 */
window.searchMusic = async function(keyword) {
  const kw = keyword || document.getElementById('searchInput').value.trim();
  console.log('[音乐模块] 搜索歌曲，关键词:', kw);
  
  if (!kw) {
    console.log('[音乐模块] 关键词为空，退出搜索');
    return;
  }
  
  document.getElementById('searchInput').value = kw;
  const list = document.getElementById('searchList');
  list.innerHTML = '<div class="empty">搜索中...</div>';
  document.getElementById('searchResult').style.display = 'block';

  try {
    // 网易云搜索（国内直连，返回多首；播放地址在点击播放时再解析）
    console.log('[音乐模块] 搜索歌曲，关键词:', kw);
    const resp = await fetch(
      `${GD_API}?types=search&source=netease&name=${encodeURIComponent(kw)}&count=20&pages=1`
    );
    const rows = await resp.json();
    console.log('[音乐模块] 搜索返回:', rows);

    const songs = (Array.isArray(rows) ? rows : []).map((r) => ({
      id: r.id,
      name: r.name || '未知歌曲',
      artist: Array.isArray(r.artist) ? r.artist.join('/') : (r.artist || '未知歌手'),
      album: r.album || '',
      artwork: '', // pic 接口返回 JSON，搜索结果不取封面（播放时用 emoji 兜底）
      preview: '',
      urlId: r.url_id || r.id,
      source: r.source || 'netease',
      duration: 0,
    }));

    if (!songs.length) {
      list.innerHTML = '<div class="empty">没找到相关歌曲</div>';
      return;
    }

    list.innerHTML = songs.map((s, i) => `
      <li class="song-item" onclick="playFromSearch(${i})">
        <span class="song-num">${i+1}</span>
        <div class="song-info">
          <div class="song-name">${escapeHtml(s.name)}</div>
          <div class="song-artist">${escapeHtml(s.artist)}</div>
        </div>
        <button class="song-add" title="加入当前歌单" onclick="event.stopPropagation(); addToPlaylist(${i})">＋</button>
      </li>
    `).join('');
    window._searchResults = songs;
  } catch (e) {
    console.error('[音乐模块] 搜索失败:', e);
    list.innerHTML = `<div class="empty">搜索失败：${e.message}</div>`;
  }
};

/**
 * 搜索结果播放
 * @param {number} i - 歌曲索引
 */
window.playFromSearch = function(i) {
  console.log('[音乐模块] 点击搜索结果播放，索引:', i);
  try {
    const s = window._searchResults[i];
    if (!s) throw new Error('没找到搜索结果歌曲数据');
    console.log('[音乐模块] 准备播放:', s.name, '-', s.artist);
    
    // 搜索结果里已经有播放地址了，直接播放
    playSong(s);
  } catch (e) {
    console.error('[音乐模块] 搜索结果播放失败:', e);
    alert('播放失败：' + e.message);
  }
};

/**
 * 添加到歌单（默认加到当前歌单）
 * @param {number} i - 搜索结果里的索引
 */
window.addToPlaylist = function(i) {
  const s = (window._searchResults || [])[i];
  if (!s) return;
  const r = Playlists.addSong(s);
  if (r === 'duplicate') return toastMsg('这首歌已经在「' + Playlists.active().name + '」里了', true);
  if (r === 'added') toastMsg('已加入「' + Playlists.active().name + '」：' + s.name);
};

/** 热门试听卡片也能一键收藏 */
window.addHotToPlaylist = function(i) {
  const s = (window._hotTracks || [])[i];
  if (!s) return;
  const r = Playlists.addSong(s);
  if (r === 'duplicate') return toastMsg('已经在「' + Playlists.active().name + '」里了', true);
  if (r === 'added') toastMsg('已加入「' + Playlists.active().name + '」：' + s.name);
};

// 轻提示：原来用 alert，弹一次要点一次，改成右上角亮点，2 秒后自己消失
function toastMsg(msg, isErr = false) {
  let el = document.getElementById('mzToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'mzToast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ''; }, 2200);
}
window.toastMsg = toastMsg;

/**
 * 从歌单播放
 * @param {number} i - 歌曲索引
 */
window.playFromPlaylist = function(i) {
  console.log('[音乐模块] 点击歌单播放，索引:', i);
  try {
    const s = playlist[i];
    if (!s) throw new Error('没找到歌单歌曲数据');
    currentIndex = i;
    playSong(s);
  } catch (e) {
    console.error('[音乐模块] 歌单播放失败:', e);
    alert('播放失败：' + e.message);
  }
};

/**
 * 删除歌单歌曲
 * @param {number} i - 歌曲索引
 */
window.removeFromPlaylist = function(i) {
  if (Playlists.removeSong(Number(i))) toastMsg('已从歌单移除');
};

/**
 * 播放歌曲
 * @param {object} song - 歌曲对象
 */
async function playSong(song) {
  console.log('[音乐模块] 执行播放函数，歌曲:', song);

  try {
  // 播放地址按需解析：搜索结果不带直链，点击播放时才向解析接口换取并缓存
  let url = song.preview || '';
  if (!url && song.urlId) {
    const r = await fetch(
      `${GD_API}?types=url&source=${encodeURIComponent(song.source || 'netease')}&id=${encodeURIComponent(song.urlId)}&br=320`
    );
    const d = await r.json();
    url = d?.url || '';
    song.preview = url; // 缓存到歌单数据，避免重复解析
  }
  console.log('[音乐模块] 播放地址:', url);

  if (!url) {
    alert('这首歌没有可用的播放地址');
    return;
  }

  audio.src = url;
  // 同步给右下角小播放器（其他页面也能续播同一首）
  nowSong = song;
  writeMusicNow({ src: 'big', song: snapMusic(song), url, playing: true, position: 0 });
  document.getElementById('nowTitle').textContent = song.name;
  document.getElementById('nowArtist').textContent = song.artist;
  const hint = document.getElementById('mzNowHint');
  if (hint) hint.textContent = '正在播放 · ' + song.name + (song.artist ? ' — ' + song.artist : '');
  
  // 显示专辑封面
  const cover = document.getElementById('cover');
  if (song.artwork) {
    cover.innerHTML = `<img src="${song.artwork}" alt="专辑封面" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" />`;
  } else {
    cover.innerHTML = '🎵';
  }
  
  // 播放，捕获错误
  audio.play().catch((e) => {
    console.error('[音乐模块] audio.play() 失败:', e);
    alert('播放失败：' + e.message);
  });
  
  playBtn.textContent = '⏸';
  player.classList.add('playing');
  renderPlaylist();
  } catch (e) {
    console.error('[音乐模块] 播放失败:', e);
    alert('播放失败：' + e.message);
  }
}

/**
 * 播放/暂停切换
 */
window.togglePlay = function() {
  console.log('[音乐模块] 点击播放/暂停按钮');
  try {
    if (audio.paused) {
      audio.play();
      playBtn.textContent = '⏸';
      player.classList.add('playing');
    } else {
      audio.pause();
      playBtn.textContent = '▶';
      player.classList.remove('playing');
    }
  } catch (e) {
    console.error('[音乐模块] 播放/暂停失败:', e);
  }
};

/**
 * 上一首
 */
window.prevSong = function() {
  console.log('[音乐模块] 点击上一首');
  if (!playlist.length) return;
  currentIndex = currentIndex <= 0 ? playlist.length - 1 : currentIndex - 1;
  playSong(playlist[currentIndex]);
};

/**
 * 下一首
 */
window.nextSong = function() {
  console.log('[音乐模块] 点击下一首');
  if (!playlist.length) return;
  currentIndex = currentIndex >= playlist.length - 1 ? 0 : currentIndex + 1;
  playSong(playlist[currentIndex]);
};

// 进度条更新：音频播放时触发
audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
    document.getElementById('totalTime').textContent = formatTime(audio.duration);
  }
});

// 点击进度条跳转
document.getElementById('progressBar').addEventListener('click', (e) => {
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

// 播放结束自动下一首
audio.addEventListener('ended', () => {
  console.log('[音乐模块] 播放结束，自动下一首');
  if (playlist.length) nextSong();
});

// ===== 与右下角小播放器联动：共用 music_now =====
audio.addEventListener('play', () => {
  playBtn.textContent = '⏸';
  player.classList.add('playing');
  if (nowSong) writeMusicNow({ src: 'big', song: snapMusic(nowSong), url: audio.src, playing: true, position: audio.currentTime || 0 });
});
audio.addEventListener('pause', () => {
  playBtn.textContent = '▶';
  player.classList.remove('playing');
  if (nowSong) writeMusicNow({ src: 'big', song: snapMusic(nowSong), url: audio.src, playing: false, position: audio.currentTime || 0 });
});
let lastSyncAt = 0;
audio.addEventListener('timeupdate', () => {
  if (!nowSong || audio.paused) return;
  if (Date.now() - lastSyncAt < 3000) return;
  lastSyncAt = Date.now();
  writeMusicNow({ src: 'big', song: snapMusic(nowSong), url: audio.src, playing: true, position: audio.currentTime || 0 });
});

// 打开页面时恢复上次的歌与进度（不自动播放，点 ▶ 继续）
(function restoreNow() {
  const now = readMusicNow();
  if (!now?.song || !now.url) return;
  nowSong = now.song;
  currentIndex = playlist.findIndex((s) => String(s.id) === String(now.song.id));
  audio.src = now.url;
  document.getElementById('nowTitle').textContent = now.song.name || '♫ 未播放';
  document.getElementById('nowArtist').textContent = (now.song.artist || '') + '（上次播放，点 ▶ 继续）';
  if (now.song.artwork) {
    document.getElementById('cover').innerHTML =
      `<img src="${now.song.artwork}" alt="专辑封面" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" />`;
  }
  audio.addEventListener('loadedmetadata', () => {
    try { audio.currentTime = Number(now.position) || 0; } catch { /* 忽略 */ }
  }, { once: true });
})();

// 小播放器（其他页面）改了状态 → 大播放器同步
onMusicNow((now) => {
  if (now.src === 'big' || !now.song) return;
  const same = nowSong && String(nowSong.id) === String(now.song.id);
  if (same) {
    if (now.playing && audio.paused) audio.play().catch(() => {});
    if (!now.playing && !audio.paused) audio.pause();
    if (Math.abs((audio.currentTime || 0) - (Number(now.position) || 0)) > 3) {
      try { audio.currentTime = Number(now.position) || 0; } catch { /* 忽略 */ }
    }
    return;
  }
  nowSong = now.song;
  currentIndex = playlist.findIndex((s) => String(s.id) === String(now.song.id));
  document.getElementById('nowTitle').textContent = now.song.name || '♫ 未播放';
  document.getElementById('nowArtist').textContent = now.song.artist || '';
  if (!now.url) return;
  audio.src = now.url;
  audio.addEventListener('loadedmetadata', () => {
    try { audio.currentTime = Number(now.position) || 0; } catch { /* 忽略 */ }
  }, { once: true });
  if (now.playing) audio.play().catch(() => {});
  renderPlaylist();
});

/**
 * 刷新"正在播放"标记
 * 歌单列表本身由 music-playlists.js 渲染，这里只把当前索引/播放状态丢给它，
 * 免得两处各画一份列表、状态对不上。
 */
function renderPlaylist() {
  Playlists.setNowPlaying(currentIndex, !audio.paused);
}

/**
 * 格式化时间：秒 -> m:ss
 * @param {number} sec - 秒数
 * @returns {string} 格式化后的时间
 */
function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// 回车搜索
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    console.log('[音乐模块] 按回车搜索');
    searchMusic();
  }
});
</script>
