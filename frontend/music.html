<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苦海音乐</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
  min-height: 100vh;
  color: #fff;
  position: relative;
  overflow-x: hidden;
}
/* 音符背景图案 */
body::before {
  content: '♪ ♫ ♩ ♬ ♪ ♫ ♩ ♬ ♪ ♫ ♩ ♬ ♪ ♫ ♩ ♬ ♪ ♫ ♩ ♬ ♪ ♫ ♩ ♬ ♪ ♫ ♩ ♬ ♪ ♫ ♩ ♬';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  font-size: 40px;
  line-height: 80px;
  color: rgba(59,130,246,.08);
  pointer-events: none;
  z-index: 0;
  word-wrap: break-word;
  overflow: hidden;
}
/* 背景光斑装饰 */
body::after {
  content: '';
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 800px; height: 800px;
  background: radial-gradient(circle, rgba(59,130,246,.15) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}
.container { max-width: 900px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }

.header { text-align: center; padding: 30px 0; }
.header h1 {
  font-size: 28px;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #fff 0%, #93c5fd 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header p { color: #94a3b8; font-size: 14px; }

/* 大尺寸播放器 */
.player {
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 40px;
  margin-bottom: 24px;
  border: 1px solid rgba(255,255,255,.15);
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.player-cover {
  width: 200px; height: 200px;
  margin: 0 auto 24px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1e3a8a, #3b82f6, #0ea5e9);
  display: flex; align-items: center; justify-content: center;
  font-size: 80px;
  box-shadow: 0 20px 60px rgba(59,130,246,.5), inset 0 0 0 8px rgba(255,255,255,.1);
  animation: rotate 20s linear infinite;
  animation-play-state: paused;
  overflow: hidden;
}
.player.playing .player-cover { animation-play-state: running; }
@keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.player-title { text-align: center; font-size: 22px; font-weight: 600; margin-bottom: 6px; }
.player-artist { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 24px; }

.progress-bar {
  height: 6px;
  background: rgba(255,255,255,.1);
  border-radius: 3px;
  margin-bottom: 16px;
  cursor: pointer;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #1e3a8a, #3b82f6);
  border-radius: 3px;
  width: 0%;
  transition: width .1s linear;
}

.time-row { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; margin-bottom: 24px; }

.controls { display: flex; justify-content: center; gap: 24px; align-items: center; }
.controls button {
  width: 56px; height: 56px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,.1);
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  transition: all .2s;
}
.controls button:hover { background: rgba(255,255,255,.2); transform: scale(1.05); }
.controls button.play-btn {
  width: 72px; height: 72px;
  background: linear-gradient(135deg, #1e3a8a, #3b82f6);
  font-size: 28px;
}

/* 搜索框 */
.search-box {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
}
.search-box input {
  flex: 1;
  padding: 14px 20px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.05);
  color: #fff;
  font-size: 15px;
  outline: none;
}
.search-box input:focus { border-color: #3b82f6; }
.search-box button {
  padding: 14px 28px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #1e3a8a, #3b82f6);
  color: #fff;
  font-size: 15px;
  cursor: pointer;
}

/* 列表 */
.section-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 16px;
  color: #e2e8f0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::before {
  content: '';
  width: 4px;
  height: 16px;
  background: linear-gradient(180deg, #3b82f6, #0ea5e9);
  border-radius: 2px;
}
.song-list { list-style: none; }
.song-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 16px;
  border-radius: 12px;
  cursor: pointer;
  transition: all .2s;
  margin-bottom: 6px;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.05);
}
.song-item:hover {
  background: rgba(59,130,246,.15);
  border-color: rgba(59,130,246,.3);
  transform: translateX(4px);
}
.song-item.active {
  background: rgba(59,130,246,.2);
  border-color: rgba(59,130,246,.5);
}
.song-num { width: 24px; color: #64748b; font-size: 14px; font-weight: 600; }
.song-info { flex: 1; min-width: 0; }
.song-name { font-size: 15px; margin-bottom: 2px; }
.song-artist { font-size: 12px; color: #64748b; }
.song-actions { display: flex; gap: 8px; }
.song-actions button {
  padding: 6px 12px;
  border-radius: 8px;
  border: none;
  background: rgba(255,255,255,.1);
  color: #cbd5e1;
  font-size: 12px;
  cursor: pointer;
}
.song-actions button:hover { background: rgba(255,255,255,.2); }

.empty { text-align: center; color: #64748b; padding: 40px 0; font-size: 14px; }

/* 热门试听：封面网格，点一下直接播放 */
.hot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.hot-card {
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
  border-radius: 12px; padding: 8px; cursor: pointer; transition: all .2s;
}
.hot-card:hover { background: rgba(59,130,246,.18); border-color: rgba(59,130,246,.3); transform: translateY(-3px); }
.hot-cover {
  width: 100%; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; margin-bottom: 8px;
  display: flex; align-items: center; justify-content: center; font-size: 30px;
  background: rgba(255,255,255,.06);
}
.hot-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hot-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hot-artist { font-size: 11px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.back-link { display: inline-block; margin-bottom: 20px; color: #7c3aed; text-decoration: none; font-size: 14px; }
.back-link:hover { color: #4c1d95; }

/* 手机版响应式设计 */
@media (max-width: 768px) {
  .container { padding: 12px; }
  .header { padding: 20px 0; }
  .header h1 { font-size: 22px; }
  
  .player { padding: 24px; border-radius: 20px; }
  .player-cover { width: 160px; height: 160px; font-size: 60px; }
  .player-title { font-size: 18px; }
  .player-artist { font-size: 13px; }
  
  .controls { gap: 16px; }
  .controls button { width: 48px; height: 48px; font-size: 18px; }
  .controls button.play-btn { width: 60px; height: 60px; font-size: 24px; }
  
  .search-box { flex-direction: column; gap: 10px; }
  .search-box button { width: 100%; padding: 16px 28px; font-size: 16px; }
  
  .song-item { padding: 12px; gap: 12px; }
  .song-num { width: 20px; font-size: 13px; }
  .song-name { font-size: 14px; }
  .song-artist { font-size: 11px; }
  
  .song-actions button { padding: 8px 12px; font-size: 13px; border-radius: 8px; }
}
</style>
</head>
<body>
<div class="container">
  <a href="/game.html" class="back-link">← 返回游戏站</a>

  <div class="header">
    <h1>🎵 苦海音乐</h1>
    <p>搜索网易云歌曲，添加到你的歌单</p>
  </div>

  <!-- 大尺寸播放器 -->
  <div class="player" id="player">
    <div class="player-cover" id="cover">🎵</div>
    <div class="player-title" id="nowTitle">♫ 未播放</div>
    <div class="player-artist" id="nowArtist">搜索歌曲开始播放</div>
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="time-row">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>
    <div class="controls">
      <button onclick="prevSong()" title="上一首">⏮</button>
      <button class="play-btn" onclick="togglePlay()" id="playBtn" title="播放/暂停">▶</button>
      <button onclick="nextSong()" title="下一首">⏭</button>
    </div>
  </div>

  <!-- 热门试听：点封面直接播放（放最上面，先能听懂再搜索） -->
  <div id="hotRecommend">
    <div class="section-title">🔥 热门试听 <span style="font-size:12px;color:#64748b;font-weight:400">点封面直接播放</span></div>
    <div class="hot-grid" id="hotGrid"><div class="empty">加载中...</div></div>
  </div>

  <!-- 搜索框 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="输入歌曲名搜索网易云..." />
    <button onclick="searchMusic()">搜索</button>
  </div>


  <!-- 搜索结果 -->
  <div id="searchResult" style="display:none">
    <div class="section-title">🔍 搜索结果</div>
    <ul class="song-list" id="searchList"></ul>
  </div>

  <!-- 我的歌单 -->
  <div style="margin-top:32px">
    <div class="section-title">📋 我的歌单</div>
    <ul class="song-list" id="playlistList"></ul>
    <div class="empty" id="playlistEmpty">歌单是空的，搜索歌曲后点 + 添加</div>
  </div>
</div>

<audio id="audio"></audio>

<script type="module">
// 导入工具函数
import { escapeHtml, writeMusicNow, readMusicNow, onMusicNow } from '/common.js?v=20261026';

// 网易云解析接口（国内直连可用，支持 CORS；dataiqs.com 在国内被劫持，已弃用）
const GD_API = 'https://music-api.gdstudio.xyz/api.php';

// 获取 DOM 元素
const audio = document.getElementById('audio');
const player = document.getElementById('player');
const playBtn = document.getElementById('playBtn');

// 歌单数据，从 localStorage 读取
let playlist = JSON.parse(localStorage.getItem('music_playlist') || '[]');
let currentIndex = -1; // 当前播放的歌在歌单中的索引，-1 表示没在播放
let nowSong = null;    // 当前曲目（与右下角小播放器共用 music_now）

// 只保存联调需要的字段
function snapMusic(song) {
  return {
    id: song.id || song.name,
    name: song.name || '',
    artist: song.artist || '',
    artwork: song.artwork || '',
    preview: song.preview || '',
    urlId: song.urlId || '',
    source: song.source || '',
  };
}

console.log('[音乐模块] 初始化完成，歌单长度:', playlist.length);

// 初始化：渲染歌单 + 热门试听
renderPlaylist();

// ===== 热门试听 =====
// 只放几首，点封面就播（不用先搜索），结果缓存 6 小时
const HOT_QUERIES = ['晴天', '七里香', '稻香', '起风了', '海阔天空', '光年之外'];
const HOT_CACHE_KEY = 'music_hot_v3';
const HOT_CACHE_TTL = 6 * 3600 * 1000;

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// 解析接口并发多了会限流（返回非数组），这里逐首请求并在失败时重试一次
async function searchOne(kw) {
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const r = await fetch(`${GD_API}?types=search&source=netease&name=${encodeURIComponent(kw)}&count=5&pages=1`);
      const rows = await r.json();
      const x = Array.isArray(rows) ? rows[0] : null;
      if (!x || !x.id) { await sleep(350); continue; }

      // 封面：pic 接口返回的是 JSON（{url}），不能直接当图片地址用
      let artwork = '';
      if (x.pic_id) {
        try {
          const pr = await fetch(`${GD_API}?types=pic&source=netease&id=${encodeURIComponent(x.pic_id)}&size=300`);
          const pd = await pr.json();
          artwork = pd?.url || '';
        } catch { /* 没封面就用 emoji 兜底 */ }
      }

      return {
        id: x.id,
        name: x.name || kw,
        artist: Array.isArray(x.artist) ? x.artist.join('/') : (x.artist || ''),
        album: x.album || '',
        artwork,
        preview: '',
        urlId: x.url_id || x.id,
        source: x.source || 'netease',
        duration: 0,
      };
    } catch { await sleep(350); }
  }
  return null;
}

function renderHot(songs) {
  window._hotTracks = songs;
  document.getElementById('hotGrid').innerHTML = songs.map((s, i) => `
    <div class="hot-card" onclick="playHotTrack(${i})">
      <div class="hot-cover">${s.artwork ? `<img src="${s.artwork}" alt="${escapeHtml(s.name)}" loading="lazy" referrerpolicy="no-referrer">` : '🎵'}</div>
      <div class="hot-name">${escapeHtml(s.name)}</div>
      <div class="hot-artist">${escapeHtml(s.artist)}</div>
    </div>
  `).join('');
}

async function loadHotTracks() {
  try {
    const c = JSON.parse(localStorage.getItem(HOT_CACHE_KEY) || 'null');
    if (c && Date.now() - c.t < HOT_CACHE_TTL && Array.isArray(c.songs) && c.songs.length) {
      renderHot(c.songs);
      return;
    }
  } catch { /* 缓存坏了就重新拉 */ }

  // 逐首加载（并发会被接口限流，导致只剩三四首）
  const songs = [];
  for (const k of HOT_QUERIES) {
    const s = await searchOne(k);
    if (s) songs.push(s);
    await sleep(150);
  }
  if (!songs.length) {
    document.getElementById('hotGrid').innerHTML = '<div class="empty">热门加载失败，可直接搜索</div>';
    return;
  }
  try { localStorage.setItem(HOT_CACHE_KEY, JSON.stringify({ t: Date.now(), songs })); } catch { /* 忽略 */ }
  renderHot(songs);
}

window.playHotTrack = function(i) {
  const s = (window._hotTracks || [])[i];
  if (!s) return;
  playSong(s);
};

loadHotTracks();

/**
 * 搜索歌曲
 * @param {string} keyword - 搜索关键词（可选，不传则从输入框读取）
 */
window.searchMusic = async function(keyword) {
  const kw = keyword || document.getElementById('searchInput').value.trim();
  console.log('[音乐模块] 搜索歌曲，关键词:', kw);
  
  if (!kw) {
    console.log('[音乐模块] 关键词为空，退出搜索');
    return;
  }
  
  document.getElementById('searchInput').value = kw;
  const list = document.getElementById('searchList');
  list.innerHTML = '<div class="empty">搜索中...</div>';
  document.getElementById('searchResult').style.display = 'block';

  try {
    // 网易云搜索（国内直连，返回多首；播放地址在点击播放时再解析）
    console.log('[音乐模块] 搜索歌曲，关键词:', kw);
    const resp = await fetch(
      `${GD_API}?types=search&source=netease&name=${encodeURIComponent(kw)}&count=20&pages=1`
    );
    const rows = await resp.json();
    console.log('[音乐模块] 搜索返回:', rows);

    const songs = (Array.isArray(rows) ? rows : []).map((r) => ({
      id: r.id,
      name: r.name || '未知歌曲',
      artist: Array.isArray(r.artist) ? r.artist.join('/') : (r.artist || '未知歌手'),
      album: r.album || '',
      artwork: '', // pic 接口返回 JSON，搜索结果不取封面（播放时用 emoji 兜底）
      preview: '',
      urlId: r.url_id || r.id,
      source: r.source || 'netease',
      duration: 0,
    }));

    if (!songs.length) {
      list.innerHTML = '<div class="empty">没找到相关歌曲</div>';
      return;
    }

    list.innerHTML = songs.map((s, i) => `
      <li class="song-item" onclick="playFromSearch(${i})">
        <span class="song-num">${i+1}</span>
        <div class="song-info">
          <div class="song-name">${escapeHtml(s.name)}</div>
          <div class="song-artist">${escapeHtml(s.artist)}</div>
        </div>
      </li>
    `).join('');
    window._searchResults = songs;
  } catch (e) {
    console.error('[音乐模块] 搜索失败:', e);
    list.innerHTML = `<div class="empty">搜索失败：${e.message}</div>`;
  }
};

/**
 * 搜索结果播放
 * @param {number} i - 歌曲索引
 */
window.playFromSearch = function(i) {
  console.log('[音乐模块] 点击搜索结果播放，索引:', i);
  try {
    const s = window._searchResults[i];
    if (!s) throw new Error('没找到搜索结果歌曲数据');
    console.log('[音乐模块] 准备播放:', s.name, '-', s.artist);
    
    // 搜索结果里已经有播放地址了，直接播放
    playSong(s);
  } catch (e) {
    console.error('[音乐模块] 搜索结果播放失败:', e);
    alert('播放失败：' + e.message);
  }
};

/**
 * 添加到歌单
 * @param {number} i - 歌曲索引
 */
window.addToPlaylist = function(i) {
  console.log('[音乐模块] 点击添加到歌单，索引:', i);
  try {
    const s = window._searchResults[i];
    if (!s) throw new Error('没找到歌曲数据');
    
    // 检查是否已经在歌单里
    if (playlist.find(x => x.id === s.id)) {
      alert('这首歌已经在歌单里了');
      return;
    }
    
    playlist.push(s);
    localStorage.setItem('music_playlist', JSON.stringify(playlist));
    renderPlaylist();
    alert(`已添加：${s.name} - ${s.artist}`);
  } catch (e) {
    console.error('[音乐模块] 添加到歌单失败:', e);
    alert('添加失败：' + e.message);
  }
};

/**
 * 从歌单播放
 * @param {number} i - 歌曲索引
 */
window.playFromPlaylist = function(i) {
  console.log('[音乐模块] 点击歌单播放，索引:', i);
  try {
    const s = playlist[i];
    if (!s) throw new Error('没找到歌单歌曲数据');
    currentIndex = i;
    playSong(s);
  } catch (e) {
    console.error('[音乐模块] 歌单播放失败:', e);
    alert('播放失败：' + e.message);
  }
};

/**
 * 删除歌单歌曲
 * @param {number} i - 歌曲索引
 */
window.removeFromPlaylist = function(i) {
  console.log('[音乐模块] 删除歌单歌曲，索引:', i);
  try {
    playlist.splice(i, 1);
    localStorage.setItem('music_playlist', JSON.stringify(playlist));
    
    // 如果删除的是当前播放的歌，就停止播放
    if (currentIndex === i) {
      audio.pause();
      currentIndex = -1;
      document.getElementById('nowTitle').textContent = '♫ 未播放';
      document.getElementById('nowArtist').textContent = '';
      playBtn.textContent = '▶';
      player.classList.remove('playing');
    } else if (currentIndex > i) {
      // 删除的歌在当前播放歌前面，索引要减 1
      currentIndex--;
    }
    
    renderPlaylist();
  } catch (e) {
    console.error('[音乐模块] 删除歌单歌曲失败:', e);
    alert('删除失败：' + e.message);
  }
};

/**
 * 播放歌曲
 * @param {object} song - 歌曲对象
 */
async function playSong(song) {
  console.log('[音乐模块] 执行播放函数，歌曲:', song);

  try {
  // 播放地址按需解析：搜索结果不带直链，点击播放时才向解析接口换取并缓存
  let url = song.preview || '';
  if (!url && song.urlId) {
    const r = await fetch(
      `${GD_API}?types=url&source=${encodeURIComponent(song.source || 'netease')}&id=${encodeURIComponent(song.urlId)}&br=320`
    );
    const d = await r.json();
    url = d?.url || '';
    song.preview = url; // 缓存到歌单数据，避免重复解析
  }
  console.log('[音乐模块] 播放地址:', url);

  if (!url) {
    alert('这首歌没有可用的播放地址');
    return;
  }

  audio.src = url;
  // 同步给右下角小播放器（其他页面也能续播同一首）
  nowSong = song;
  writeMusicNow({ src: 'big', song: snapMusic(song), url, playing: true, position: 0 });
  document.getElementById('nowTitle').textContent = song.name;
  document.getElementById('nowArtist').textContent = song.artist;
  
  // 显示专辑封面
  const cover = document.getElementById('cover');
  if (song.artwork) {
    cover.innerHTML = `<img src="${song.artwork}" alt="专辑封面" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" />`;
  } else {
    cover.innerHTML = '🎵';
  }
  
  // 播放，捕获错误
  audio.play().catch((e) => {
    console.error('[音乐模块] audio.play() 失败:', e);
    alert('播放失败：' + e.message);
  });
  
  playBtn.textContent = '⏸';
  player.classList.add('playing');
  renderPlaylist();
  } catch (e) {
    console.error('[音乐模块] 播放失败:', e);
    alert('播放失败：' + e.message);
  }
}

/**
 * 播放/暂停切换
 */
window.togglePlay = function() {
  console.log('[音乐模块] 点击播放/暂停按钮');
  try {
    if (audio.paused) {
      audio.play();
      playBtn.textContent = '⏸';
      player.classList.add('playing');
    } else {
      audio.pause();
      playBtn.textContent = '▶';
      player.classList.remove('playing');
    }
  } catch (e) {
    console.error('[音乐模块] 播放/暂停失败:', e);
  }
};

/**
 * 上一首
 */
window.prevSong = function() {
  console.log('[音乐模块] 点击上一首');
  if (!playlist.length) return;
  currentIndex = currentIndex <= 0 ? playlist.length - 1 : currentIndex - 1;
  playSong(playlist[currentIndex]);
};

/**
 * 下一首
 */
window.nextSong = function() {
  console.log('[音乐模块] 点击下一首');
  if (!playlist.length) return;
  currentIndex = currentIndex >= playlist.length - 1 ? 0 : currentIndex + 1;
  playSong(playlist[currentIndex]);
};

// 进度条更新：音频播放时触发
audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
    document.getElementById('totalTime').textContent = formatTime(audio.duration);
  }
});

// 点击进度条跳转
document.getElementById('progressBar').addEventListener('click', (e) => {
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

// 播放结束自动下一首
audio.addEventListener('ended', () => {
  console.log('[音乐模块] 播放结束，自动下一首');
  if (playlist.length) nextSong();
});

// ===== 与右下角小播放器联动：共用 music_now =====
audio.addEventListener('play', () => {
  playBtn.textContent = '⏸';
  player.classList.add('playing');
  if (nowSong) writeMusicNow({ src: 'big', song: snapMusic(nowSong), url: audio.src, playing: true, position: audio.currentTime || 0 });
});
audio.addEventListener('pause', () => {
  playBtn.textContent = '▶';
  player.classList.remove('playing');
  if (nowSong) writeMusicNow({ src: 'big', song: snapMusic(nowSong), url: audio.src, playing: false, position: audio.currentTime || 0 });
});
let lastSyncAt = 0;
audio.addEventListener('timeupdate', () => {
  if (!nowSong || audio.paused) return;
  if (Date.now() - lastSyncAt < 3000) return;
  lastSyncAt = Date.now();
  writeMusicNow({ src: 'big', song: snapMusic(nowSong), url: audio.src, playing: true, position: audio.currentTime || 0 });
});

// 打开页面时恢复上次的歌与进度（不自动播放，点 ▶ 继续）
(function restoreNow() {
  const now = readMusicNow();
  if (!now?.song || !now.url) return;
  nowSong = now.song;
  currentIndex = playlist.findIndex((s) => String(s.id) === String(now.song.id));
  audio.src = now.url;
  document.getElementById('nowTitle').textContent = now.song.name || '♫ 未播放';
  document.getElementById('nowArtist').textContent = (now.song.artist || '') + '（上次播放，点 ▶ 继续）';
  if (now.song.artwork) {
    document.getElementById('cover').innerHTML =
      `<img src="${now.song.artwork}" alt="专辑封面" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" />`;
  }
  audio.addEventListener('loadedmetadata', () => {
    try { audio.currentTime = Number(now.position) || 0; } catch { /* 忽略 */ }
  }, { once: true });
})();

// 小播放器（其他页面）改了状态 → 大播放器同步
onMusicNow((now) => {
  if (now.src === 'big' || !now.song) return;
  const same = nowSong && String(nowSong.id) === String(now.song.id);
  if (same) {
    if (now.playing && audio.paused) audio.play().catch(() => {});
    if (!now.playing && !audio.paused) audio.pause();
    if (Math.abs((audio.currentTime || 0) - (Number(now.position) || 0)) > 3) {
      try { audio.currentTime = Number(now.position) || 0; } catch { /* 忽略 */ }
    }
    return;
  }
  nowSong = now.song;
  currentIndex = playlist.findIndex((s) => String(s.id) === String(now.song.id));
  document.getElementById('nowTitle').textContent = now.song.name || '♫ 未播放';
  document.getElementById('nowArtist').textContent = now.song.artist || '';
  if (!now.url) return;
  audio.src = now.url;
  audio.addEventListener('loadedmetadata', () => {
    try { audio.currentTime = Number(now.position) || 0; } catch { /* 忽略 */ }
  }, { once: true });
  if (now.playing) audio.play().catch(() => {});
  renderPlaylist();
});

/**
 * 渲染歌单到页面上
 */
function renderPlaylist() {
  const list = document.getElementById('playlistList');
  const empty = document.getElementById('playlistEmpty');
  
  if (!playlist.length) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  
  empty.style.display = 'none';
  list.innerHTML = playlist.map((s, i) => `
    <li class="song-item ${i === currentIndex ? 'active' : ''}" onclick="playFromPlaylist(${i})">
      <span class="song-num">${i+1}</span>
      <div class="song-info">
        <div class="song-name">${s.name}</div>
        <div class="song-artist">${s.artist}</div>
      </div>
      <div class="song-actions">
        <button onclick="event.stopPropagation(); removeFromPlaylist(${i})">✕ 删除</button>
      </div>
    </li>
  `).join('');
}

/**
 * 格式化时间：秒 -> m:ss
 * @param {number} sec - 秒数
 * @returns {string} 格式化后的时间
 */
function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// 回车搜索
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    console.log('[音乐模块] 按回车搜索');
    searchMusic();
  }
});
</script>
