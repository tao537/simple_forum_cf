<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苦海音乐</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  color: #fff;
}
.container { max-width: 900px; margin: 0 auto; padding: 20px; }

.header { text-align: center; padding: 30px 0; }
.header h1 { font-size: 28px; margin-bottom: 8px; }
.header p { color: #94a3b8; font-size: 14px; }

/* 大尺寸播放器 */
.player {
  background: rgba(255,255,255,.05);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 40px;
  margin-bottom: 24px;
  border: 1px solid rgba(255,255,255,.1);
}
.player-cover {
  width: 200px; height: 200px;
  margin: 0 auto 24px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1e3a8a, #1e40af);
  display: flex; align-items: center; justify-content: center;
  font-size: 80px;
  box-shadow: 0 20px 60px rgba(30,58,138,.4);
  animation: rotate 20s linear infinite;
  animation-play-state: paused;
  overflow: hidden;
}
.player.playing .player-cover { animation-play-state: running; }
@keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.player-title { text-align: center; font-size: 22px; font-weight: 600; margin-bottom: 6px; }
.player-artist { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 24px; }

.progress-bar {
  height: 6px;
  background: rgba(255,255,255,.1);
  border-radius: 3px;
  margin-bottom: 16px;
  cursor: pointer;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #1e3a8a, #3b82f6);
  border-radius: 3px;
  width: 0%;
  transition: width .1s linear;
}

.time-row { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; margin-bottom: 24px; }

.controls { display: flex; justify-content: center; gap: 24px; align-items: center; }
.controls button {
  width: 56px; height: 56px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,.1);
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  transition: all .2s;
}
.controls button:hover { background: rgba(255,255,255,.2); transform: scale(1.05); }
.controls button.play-btn {
  width: 72px; height: 72px;
  background: linear-gradient(135deg, #1e3a8a, #3b82f6);
  font-size: 28px;
}

/* 搜索框 */
.search-box {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
}
.search-box input {
  flex: 1;
  padding: 14px 20px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.05);
  color: #fff;
  font-size: 15px;
  outline: none;
}
.search-box input:focus { border-color: #3b82f6; }
.search-box button {
  padding: 14px 28px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #1e3a8a, #3b82f6);
  color: #fff;
  font-size: 15px;
  cursor: pointer;
}

/* 列表 */
.section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #e2e8f0; }
.song-list { list-style: none; }
.song-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 16px;
  border-radius: 12px;
  cursor: pointer;
  transition: background .2s;
  margin-bottom: 4px;
}
.song-item:hover { background: rgba(255,255,255,.08); }
.song-item.active { background: rgba(102,126,234,.2); }
.song-num { width: 24px; color: #64748b; font-size: 14px; }
.song-info { flex: 1; min-width: 0; }
.song-name { font-size: 15px; margin-bottom: 2px; }
.song-artist { font-size: 12px; color: #64748b; }
.song-actions { display: flex; gap: 8px; }
.song-actions button {
  padding: 6px 12px;
  border-radius: 8px;
  border: none;
  background: rgba(255,255,255,.1);
  color: #cbd5e1;
  font-size: 12px;
  cursor: pointer;
}
.song-actions button:hover { background: rgba(255,255,255,.2); }

.empty { text-align: center; color: #64748b; padding: 40px 0; font-size: 14px; }

.back-link { display: inline-block; margin-bottom: 20px; color: #7c3aed; text-decoration: none; font-size: 14px; }
.back-link:hover { color: #4c1d95; }

/* 手机版响应式设计 */
@media (max-width: 768px) {
  .container { padding: 12px; }
  .header { padding: 20px 0; }
  .header h1 { font-size: 22px; }
  
  .player { padding: 24px; border-radius: 20px; }
  .player-cover { width: 160px; height: 160px; font-size: 60px; }
  .player-title { font-size: 18px; }
  .player-artist { font-size: 13px; }
  
  .controls { gap: 16px; }
  .controls button { width: 48px; height: 48px; font-size: 18px; }
  .controls button.play-btn { width: 60px; height: 60px; font-size: 24px; }
  
  .search-box { flex-direction: column; gap: 10px; }
  .search-box button { width: 100%; padding: 16px 28px; font-size: 16px; }
  
  .song-item { padding: 12px; gap: 12px; }
  .song-num { width: 20px; font-size: 13px; }
  .song-name { font-size: 14px; }
  .song-artist { font-size: 11px; }
  
  .song-actions button { padding: 8px 12px; font-size: 13px; border-radius: 8px; }
}
</style>
</head>
<body>
<div class="container">
  <a href="/game.html" class="back-link">← 返回游戏站</a>

  <div class="header">
    <h1>🎵 苦海音乐</h1>
    <p>搜索网易云歌曲，添加到你的歌单</p>
  </div>

  <!-- 大尺寸播放器 -->
  <div class="player" id="player">
    <div class="player-cover" id="cover">🎵</div>
    <div class="player-title" id="nowTitle">♫ 未播放</div>
    <div class="player-artist" id="nowArtist">搜索歌曲开始播放</div>
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="time-row">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>
    <div class="controls">
      <button onclick="prevSong()" title="上一首">⏮</button>
      <button class="play-btn" onclick="togglePlay()" id="playBtn" title="播放/暂停">▶</button>
      <button onclick="nextSong()" title="下一首">⏭</button>
    </div>
  </div>

  <!-- 搜索框 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="输入歌曲名搜索网易云..." />
    <button onclick="searchMusic()">搜索</button>
  </div>

  <!-- 热门推荐 -->
  <div id="hotRecommend">
    <div class="section-title">🔥 热门推荐</div>
    <ul class="song-list" id="hotList">
      <li class="song-item" onclick="searchMusic('晴天')">
        <div class="song-num">1</div>
        <div class="song-info">
          <div class="song-name">晴天</div>
          <div class="song-artist">周杰伦</div>
        </div>
        <div class="song-actions">
          <button onclick="event.stopPropagation();searchMusic('晴天')">搜索</button>
        </div>
      </li>
      <li class="song-item" onclick="searchMusic('七里香')">
        <div class="song-num">2</div>
        <div class="song-info">
          <div class="song-name">七里香</div>
          <div class="song-artist">周杰伦</div>
        </div>
        <div class="song-actions">
          <button onclick="event.stopPropagation();searchMusic('七里香')">搜索</button>
        </div>
      </li>
      <li class="song-item" onclick="searchMusic('稻香')">
        <div class="song-num">3</div>
        <div class="song-info">
          <div class="song-name">稻香</div>
          <div class="song-artist">周杰伦</div>
        </div>
        <div class="song-actions">
          <button onclick="event.stopPropagation();searchMusic('稻香')">搜索</button>
        </div>
      </li>
      <li class="song-item" onclick="searchMusic('起风了')">
        <div class="song-num">4</div>
        <div class="song-info">
          <div class="song-name">起风了</div>
          <div class="song-artist">买辣椒也用券</div>
        </div>
        <div class="song-actions">
          <button onclick="event.stopPropagation();searchMusic('起风了')">搜索</button>
        </div>
      </li>
      <li class="song-item" onclick="searchMusic('海阔天空')">
        <div class="song-num">5</div>
        <div class="song-info">
          <div class="song-name">海阔天空</div>
          <div class="song-artist">Beyond</div>
        </div>
        <div class="song-actions">
          <button onclick="event.stopPropagation();searchMusic('海阔天空')">搜索</button>
        </div>
      </li>
      <li class="song-item" onclick="searchMusic('光年之外')">
        <div class="song-num">6</div>
        <div class="song-info">
          <div class="song-name">光年之外</div>
          <div class="song-artist">G.E.M. 邓紫棋</div>
        </div>
        <div class="song-actions">
          <button onclick="event.stopPropagation();searchMusic('光年之外')">搜索</button>
        </div>
      </li>
    </ul>
  </div>

  <!-- 搜索结果 -->
  <div id="searchResult" style="display:none">
    <div class="section-title">🔍 搜索结果</div>
    <ul class="song-list" id="searchList"></ul>
  </div>

  <!-- 我的歌单 -->
  <div style="margin-top:32px">
    <div class="section-title">📋 我的歌单</div>
    <ul class="song-list" id="playlistList"></ul>
    <div class="empty" id="playlistEmpty">歌单是空的，搜索歌曲后点 + 添加</div>
  </div>
</div>

<audio id="audio"></audio>

<script type="module">
// 导入工具函数
import { resolveBaseUrl } from '/common.js';

// 获取 DOM 元素
const audio = document.getElementById('audio');
const player = document.getElementById('player');
const playBtn = document.getElementById('playBtn');

// 歌单数据，从 localStorage 读取
let playlist = JSON.parse(localStorage.getItem('music_playlist') || '[]');
let currentIndex = -1; // 当前播放的歌在歌单中的索引，-1 表示没在播放

console.log('[音乐模块] 初始化完成，歌单长度:', playlist.length);

// 初始化：渲染歌单
renderPlaylist();
// loadHotRecommend(); // 暂时注释掉，用写死的热门推荐

/**
 * 加载热门推荐（从后端 API 获取）
 */
async function loadHotRecommend() {
  console.log('[音乐模块] 加载热门推荐...');
  const hotKeywords = ['周杰伦', '林俊杰', '邓紫棋', '流行歌曲'];
  const list = document.getElementById('hotList');
  try {
    const resp = await fetch(`${resolveBaseUrl()}/api/music/search?keyword=${encodeURIComponent(hotKeywords[0])}`);
    const data = await resp.json();
    console.log('[音乐模块] 热门推荐返回:', data);
    if (!data.songs?.length) {
      list.innerHTML = '<div class="empty">暂无推荐歌曲</div>';
      return;
    }
    window._hotResults = data.songs;
    list.innerHTML = data.songs.slice(0, 10).map((s, i) => `
      <li class="song-item">
        <div class="song-info">
          <div class="song-name">${escapeHtml(s.name)}</div>
          <div class="song-artist">${escapeHtml(s.artist)} - ${escapeHtml(s.album)}</div>
        </div>
        <div class="song-actions">
          <button onclick="playHot(${i})">▶ 播放</button>
          <button onclick="addHot(${i})">+ 添加</button>
        </div>
      </li>
    `).join('');
  } catch (e) {
    console.error('[音乐模块] 热门推荐加载失败:', e);
    list.innerHTML = `<div class="empty">加载失败：${e.message}</div>`;
  }
}

/**
 * 热门推荐播放
 * @param {number} i - 歌曲索引
 */
window.playHot = function(i) {
  console.log('[音乐模块] 点击热门推荐播放，索引:', i);
  try {
    const s = window._hotResults[i];
    if (!s) throw new Error('没找到热门歌曲数据');
    playSong(s);
  } catch (e) {
    console.error('[音乐模块] 热门推荐播放失败:', e);
    alert('播放失败：' + e.message);
  }
};

/**
 * 热门推荐添加到歌单
 * @param {number} i - 歌曲索引
 */
window.addHot = function(i) {
  console.log('[音乐模块] 点击热门推荐添加，索引:', i);
  try {
    const s = window._hotResults[i];
    if (!s) throw new Error('没找到热门歌曲数据');
    addToPlaylist(s);
  } catch (e) {
    console.error('[音乐模块] 热门推荐添加失败:', e);
    alert('添加失败：' + e.message);
  }
};

/**
 * 搜索歌曲
 * @param {string} keyword - 搜索关键词（可选，不传则从输入框读取）
 */
window.searchMusic = async function(keyword) {
  const kw = keyword || document.getElementById('searchInput').value.trim();
  console.log('[音乐模块] 搜索歌曲，关键词:', kw);
  
  if (!kw) {
    console.log('[音乐模块] 关键词为空，退出搜索');
    return;
  }
  
  document.getElementById('searchInput').value = kw;
  const list = document.getElementById('searchList');
  list.innerHTML = '<div class="empty">搜索中...</div>';
  document.getElementById('searchResult').style.display = 'block';
  
  try {
    // 前端直接调用网易云音乐 API，不用经过后端
    const resp = await fetch(`https://apis.netstart.cn/music/search?keywords=${encodeURIComponent(kw)}&limit=20`);
    const data = await resp.json();
    console.log('[音乐模块] 搜索返回:', data);
    
    const songs = (data?.result?.songs || []).map(item => ({
      id: item.id,
      name: item.name,
      artist: item.artists?.[0]?.name || '未知歌手',
      album: item.album?.name || '',
      artwork: item.album?.picUrl || '',
      preview: '', // 播放地址需要另外获取
      duration: Math.round(item.duration / 1000),
    }));
    
    if (!songs.length) {
      list.innerHTML = '<div class="empty">没找到相关歌曲</div>';
      return;
    }
    
    list.innerHTML = songs.map((s, i) => `
      <li class="song-item" onclick="playFromSearch(${i})">
        <span class="song-num">${i+1}</span>
        <div class="song-info">
          <div class="song-name">${s.name}</div>
          <div class="song-artist">${s.artist} · ${s.album}</div>
        </div>
      </li>
    `).join('');
    window._searchResults = songs;
  } catch (e) {
    console.error('[音乐模块] 搜索失败:', e);
    list.innerHTML = `<div class="empty">搜索失败：${e.message}</div>`;
  }
};

/**
 * 搜索结果播放
 * @param {number} i - 歌曲索引
 */
window.playFromSearch = function(i) {
  console.log('[音乐模块] 点击搜索结果播放，索引:', i);
  try {
    const s = window._searchResults[i];
    if (!s) throw new Error('没找到搜索结果歌曲数据');
    console.log('[音乐模块] 准备播放:', s.name, '-', s.artist);
    playSong(s);
  } catch (e) {
    console.error('[音乐模块] 搜索结果播放失败:', e);
    alert('播放失败：' + e.message);
  }
};

/**
 * 添加到歌单
 * @param {number} i - 歌曲索引
 */
window.addToPlaylist = function(i) {
  console.log('[音乐模块] 点击添加到歌单，索引:', i);
  try {
    const s = window._searchResults[i];
    if (!s) throw new Error('没找到歌曲数据');
    
    // 检查是否已经在歌单里
    if (playlist.find(x => x.id === s.id)) {
      alert('这首歌已经在歌单里了');
      return;
    }
    
    playlist.push(s);
    localStorage.setItem('music_playlist', JSON.stringify(playlist));
    renderPlaylist();
    alert(`已添加：${s.name} - ${s.artist}`);
  } catch (e) {
    console.error('[音乐模块] 添加到歌单失败:', e);
    alert('添加失败：' + e.message);
  }
};

/**
 * 从歌单播放
 * @param {number} i - 歌曲索引
 */
window.playFromPlaylist = function(i) {
  console.log('[音乐模块] 点击歌单播放，索引:', i);
  try {
    const s = playlist[i];
    if (!s) throw new Error('没找到歌单歌曲数据');
    currentIndex = i;
    playSong(s);
  } catch (e) {
    console.error('[音乐模块] 歌单播放失败:', e);
    alert('播放失败：' + e.message);
  }
};

/**
 * 删除歌单歌曲
 * @param {number} i - 歌曲索引
 */
window.removeFromPlaylist = function(i) {
  console.log('[音乐模块] 删除歌单歌曲，索引:', i);
  try {
    playlist.splice(i, 1);
    localStorage.setItem('music_playlist', JSON.stringify(playlist));
    
    // 如果删除的是当前播放的歌，就停止播放
    if (currentIndex === i) {
      audio.pause();
      currentIndex = -1;
      document.getElementById('nowTitle').textContent = '♫ 未播放';
      document.getElementById('nowArtist').textContent = '';
      playBtn.textContent = '▶';
      player.classList.remove('playing');
    } else if (currentIndex > i) {
      // 删除的歌在当前播放歌前面，索引要减 1
      currentIndex--;
    }
    
    renderPlaylist();
  } catch (e) {
    console.error('[音乐模块] 删除歌单歌曲失败:', e);
    alert('删除失败：' + e.message);
  }
};

/**
 * 播放歌曲
 * @param {object} song - 歌曲对象
 */
function playSong(song) {
  console.log('[音乐模块] 执行播放函数，歌曲:', song);
  
  // 用歌曲的 preview 地址（iTunes API 返回的 30 秒预览）
  const url = song.preview || '';
  console.log('[音乐模块] 播放地址:', url);
  
  if (!url) {
    alert('这首歌没有可播放的预览地址');
    return;
  }
  
  audio.src = url;
  document.getElementById('nowTitle').textContent = song.name;
  document.getElementById('nowArtist').textContent = song.artist;
  
  // 显示专辑封面
  const cover = document.getElementById('cover');
  if (song.artwork) {
    cover.innerHTML = `<img src="${song.artwork}" alt="专辑封面" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" />`;
  } else {
    cover.innerHTML = '🎵';
  }
  
  // 播放，捕获错误
  audio.play().catch((e) => {
    console.error('[音乐模块] audio.play() 失败:', e);
    alert('播放失败：' + e.message);
  });
  
  playBtn.textContent = '⏸';
  player.classList.add('playing');
  renderPlaylist();
}

/**
 * 播放/暂停切换
 */
window.togglePlay = function() {
  console.log('[音乐模块] 点击播放/暂停按钮');
  try {
    if (audio.paused) {
      audio.play();
      playBtn.textContent = '⏸';
      player.classList.add('playing');
    } else {
      audio.pause();
      playBtn.textContent = '▶';
      player.classList.remove('playing');
    }
  } catch (e) {
    console.error('[音乐模块] 播放/暂停失败:', e);
  }
};

/**
 * 上一首
 */
window.prevSong = function() {
  console.log('[音乐模块] 点击上一首');
  if (!playlist.length) return;
  currentIndex = currentIndex <= 0 ? playlist.length - 1 : currentIndex - 1;
  playSong(playlist[currentIndex]);
};

/**
 * 下一首
 */
window.nextSong = function() {
  console.log('[音乐模块] 点击下一首');
  if (!playlist.length) return;
  currentIndex = currentIndex >= playlist.length - 1 ? 0 : currentIndex + 1;
  playSong(playlist[currentIndex]);
};

// 进度条更新：音频播放时触发
audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
    document.getElementById('totalTime').textContent = formatTime(audio.duration);
  }
});

// 点击进度条跳转
document.getElementById('progressBar').addEventListener('click', (e) => {
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

// 播放结束自动下一首
audio.addEventListener('ended', () => {
  console.log('[音乐模块] 播放结束，自动下一首');
  if (playlist.length) nextSong();
});

/**
 * 渲染歌单到页面上
 */
function renderPlaylist() {
  const list = document.getElementById('playlistList');
  const empty = document.getElementById('playlistEmpty');
  
  if (!playlist.length) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  
  empty.style.display = 'none';
  list.innerHTML = playlist.map((s, i) => `
    <li class="song-item ${i === currentIndex ? 'active' : ''}" onclick="playFromPlaylist(${i})">
      <span class="song-num">${i+1}</span>
      <div class="song-info">
        <div class="song-name">${s.name}</div>
        <div class="song-artist">${s.artist}</div>
      </div>
      <div class="song-actions">
        <button onclick="event.stopPropagation(); removeFromPlaylist(${i})">✕ 删除</button>
      </div>
    </li>
  `).join('');
}

/**
 * 格式化时间：秒 -> m:ss
 * @param {number} sec - 秒数
 * @returns {string} 格式化后的时间
 */
function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// 回车搜索
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    console.log('[音乐模块] 按回车搜索');
    searchMusic();
  }
});
