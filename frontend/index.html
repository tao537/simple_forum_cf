<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>苦海 · 入口</title>
<style>
  :root {
    --bg: #060b16;
    --paper: #f2ecdc;
    --ink: #0a1120;
    --font-xing: 'STXingkai', '华文行楷', 'KaiTi', '楷体', 'SimSun', serif;
    --font-song: 'KaiTi', 'STKaiti', 'SimSun', '宋体', serif;
    --font-cn: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
    --font-mono: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-song);
    background: var(--bg);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .shell { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }

  /* ===== 顶栏 ===== */
  .top-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px;
    border-bottom: 1px solid rgba(242,236,220,.14);
    font-size: 12.5px; letter-spacing: 2px; color: var(--paper);
    flex-wrap: wrap;
  }
  .top-bar .brand-zh { display: inline-flex; align-items: baseline; gap: 9px; }
  .top-bar .brand-zh .sym { color: #9fd8d0; }
  .top-bar .brand-zh b { font-weight: 700; font-size: 14.5px; letter-spacing: 4px; }
  .top-bar .divider { color: rgba(242,236,220,.25); }
  .top-bar .sub { color: rgba(242,236,220,.55); font-size: 11px; letter-spacing: 3px; }
  .top-bar .year { margin-left: auto; color: rgba(242,236,220,.55); font-size: 11px; letter-spacing: 2px; }

  /* ===== 左右分屏 ===== */
  .split { flex: 1; display: flex; min-height: 0; }
  .entry {
    position: relative;
    flex: 1 1 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 18px 10px;
    text-align: center;
    text-decoration: none;
    overflow: hidden;
  }
  .entry + .entry { border-left: 1px solid rgba(242,236,220,.12); }

  /* ---- 左：苦海论坛 · 水墨海景（仙鹤云气） ---- */
  .entry.forum { background: url('/wallpapers/kuhai-sea-v2.jpg') center 32% / cover no-repeat; }
  .entry.forum::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(6,11,22,.50) 0%, rgba(6,11,22,.16) 42%, rgba(6,11,22,.78) 100%);
  }
  .entry.forum::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    opacity: 0; transition: opacity .35s;
    background: radial-gradient(400px 300px at 50% 42%, rgba(190,225,215,.20), transparent 72%);
  }
  .entry.forum:hover::after { opacity: 1; }

  /* ---- 右：娱乐游戏 · 二次元星空 ---- */
  .entry.game { background: url('/wallpapers/game-anime.jpg') center 38% / cover no-repeat; }
  .entry.game::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(10,9,26,.55) 0%, rgba(10,9,26,.18) 45%, rgba(10,9,26,.80) 100%);
  }
  .entry.game::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    opacity: 0; transition: opacity .35s;
    background: radial-gradient(400px 300px at 50% 42%, rgba(167,139,250,.25), transparent 72%);
  }
  .entry.game:hover::after { opacity: 1; }

  /* ---- 内容区（自带暗色底，保证文字清晰） ---- */
  .inner {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
    width: 100%; max-width: 86%;
    padding: 20px 12px;
    border-radius: 14px;
    background: rgba(5, 10, 20, .52);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    border: 1px solid rgba(255,255,255,.08);
  }
  .entry .tag {
    font-family: var(--font-mono);
    font-size: 10px; letter-spacing: 2px;
    color: rgba(255,255,255,.75);
    border: 1px solid rgba(255,255,255,.22);
    padding: 2px 9px; border-radius: 999px;
  }
  .entry .ico { font-size: 34px; line-height: 1; }
  .entry h1 { font-weight: 700; }
  .entry .desc { font-size: 11px; line-height: 1.8; color: rgba(255,255,255,.82); letter-spacing: .5px; }
  .entry .go {
    margin-top: 2px;
    padding: 9px 22px; border-radius: 999px;
    font-size: 12px; font-weight: 700; letter-spacing: 2px;
    transition: .2s;
  }

  /* 左侧：行楷大字、飘逸 */
  .entry.forum h1 {
    font-family: var(--font-xing);
    font-size: 30px; letter-spacing: 6px;
    color: var(--paper);
    text-shadow: 0 2px 16px rgba(0,0,0,.6);
  }
  .entry.forum .ico { color: rgba(242,236,220,.92); text-shadow: 0 2px 14px rgba(0,0,0,.5); }
  .entry.forum .verse {
    font-family: var(--font-xing);
    font-size: 15px; letter-spacing: 5px;
    color: #e6f3ee;
    text-shadow: 0 1px 10px rgba(0,0,0,.65);
  }
  .entry.forum .verse .dot { color: rgba(230,243,238,.45); padding: 0 3px; }
  .entry.forum .go { color: var(--paper); background: rgba(8,14,24,.55); border: 1px solid rgba(242,236,220,.65); }
  .entry.forum:hover .go { background: var(--paper); color: #18242f; box-shadow: 0 0 22px rgba(242,236,220,.4); }
  .entry.forum .seal {
    position: absolute; right: 12px; bottom: 12px; z-index: 2;
    font-family: var(--font-xing);
    font-size: 12px; letter-spacing: 3px; font-weight: 700;
    color: #efb6ad;
    border: 2px solid rgba(192,57,43,.85);
    padding: 3px 7px 3px 10px;
    background: rgba(5,10,20,.35);
    transform: rotate(-3deg);
    border-radius: 3px;
  }

  /* 右侧：二次元 */
  .entry.game h1 {
    font-family: var(--font-cn);
    font-size: 24px; letter-spacing: 3px; font-weight: 800;
    background: linear-gradient(135deg, #7dd3fc, #c4b5fd 55%, #f0abfc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 10px rgba(125,211,252,.35));
  }
  .entry.game .ico { color: #f0abfc; filter: drop-shadow(0 0 12px rgba(240,171,252,.6)); }
  .entry.game .desc b { color: #fde68a; }
  .entry.game .go {
    font-family: var(--font-cn);
    color: #1b1030;
    background: linear-gradient(135deg, #7dd3fc, #c4b5fd 55%, #f0abfc);
    box-shadow: 0 4px 18px rgba(167,139,250,.45);
  }
  .entry.game:hover .go { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(240,171,252,.6); }

  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  /* ===== 底栏 ===== */
  .bottom-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    border-top: 1px solid rgba(242,236,220,.12);
    font-size: 11px; letter-spacing: 2px;
    color: rgba(242,236,220,.55);
    flex-wrap: wrap;
  }
  .bottom-bar .motto { color: rgba(242,236,220,.82); font-family: var(--font-song); }
  .bottom-bar .copy { margin-left: auto; letter-spacing: 1px; color: rgba(242,236,220,.4); }

  /* ===== 手机优先：基础样式已按 390px 设计 ===== */
  /* 桌面放大 */
  @media (min-width: 1080px) {
    .entry { padding: 36px 26px; }
    .inner { gap: 16px; padding: 34px 30px; max-width: 78%; border-radius: 18px; }
    .entry .tag { font-size: 12px; padding: 4px 14px; letter-spacing: 3px; }
    .entry .ico { font-size: 52px; }
    .entry .desc { font-size: 13.5px; line-height: 2; max-width: 300px; }
    .entry .go { padding: 12px 34px; font-size: 14px; }
    .entry.forum h1 { font-size: 42px; letter-spacing: 10px; }
    .entry.forum .verse { font-size: 18px; letter-spacing: 8px; }
    .entry.game h1 { font-size: 32px; letter-spacing: 5px; }
    .entry.forum .seal { right: 26px; bottom: 24px; font-size: 14px; padding: 5px 9px 5px 12px; }
    .top-bar { padding: 14px 24px; font-size: 13.5px; }
    .top-bar .brand-zh b { font-size: 15.5px; }
    .bottom-bar { padding: 12px 24px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="shell">

  <!-- 顶栏 -->
  <div class="top-bar">
    <span class="brand-zh"><span class="sym">⌬</span><b>苦海</b></span>
    <span class="divider">｜</span>
    <span class="sub">门户 · 论道 · 游戏</span>
    <span class="year">丙午年 · 秋</span>
  </div>

  <div class="split">

    <!-- 左：苦海论坛 -->
    <a class="entry forum" href="/forum.html">
      <div class="inner">
        <span class="tag">#01 / FORUM</span>
        <div class="ico">⌬</div>
        <h1>苦海论坛</h1>
        <div class="verse">苦海无涯<span class="dot">·</span>回头是岸</div>
        <div class="desc">发帖讨论 · 分享资源 · 求助问答 · 评论互动</div>
        <span class="go">进入苦海 →</span>
      </div>
      <span class="seal">苦海</span>
    </a>

    <!-- 右：娱乐游戏 -->
    <a class="entry game" href="/game.html">
      <div class="inner">
        <span class="tag">✦ GAME ✦</span>
        <div class="ico">◈</div>
        <h1>娱乐游戏</h1>
        <div class="desc">分享<b>好游戏</b> · 封面<b>截图</b> · 资源<b>下载</b> · 游玩<b>心得</b></div>
        <span class="go">START 进入 →</span>
      </div>
    </a>

  </div>

  <!-- 底栏 -->
  <div class="bottom-bar">
    <span class="motto">苦海无涯 · 回头是岸</span>
    <span class="copy">© KUHAI PROJECT</span>
  </div>

</div>
</body>
</html>
