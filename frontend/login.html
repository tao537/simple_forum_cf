<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · 注册 | 苦海 & 娱乐游戏</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #3b82f6;
    --accent-2: #2563eb;
  }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0f172a; padding: 24px; }
  body::before { content: ''; position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 0; }

  /* ============ 视图 1：站点选择 ============ */
  .wrap { position: relative; z-index: 1; width: 100%; max-width: 900px; }
  .choose-head { text-align: center; color: #fff; margin-bottom: 28px; }
  .choose-head h1 { font-size: 26px; margin-bottom: 8px; }
  .choose-head p { font-size: 14px; color: #cbd5e1; }
  .choose { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .site-card { position: relative; border-radius: 22px; padding: 44px 30px; cursor: pointer;
               text-align: center; color: #fff; overflow: hidden;
               border: 1px solid rgba(255,255,255,.14);
               background: rgba(255,255,255,.07); backdrop-filter: blur(12px);
               transition: transform .25s, box-shadow .25s, border-color .25s; }
  .site-card:hover { transform: translateY(-6px); }
  .site-card .ico { font-size: 60px; margin-bottom: 18px; }
  .site-card h2 { font-size: 22px; margin-bottom: 10px; }
  .site-card p { font-size: 13.5px; color: #cbd5e1; line-height: 1.7; margin-bottom: 24px; }
  .site-card .go { display: inline-block; padding: 11px 28px; border-radius: 999px;
                   font-size: 14px; font-weight: 700; color: #fff; }
  .site-card.forum:hover { box-shadow: 0 20px 50px rgba(37,99,235,.45); border-color: rgba(96,165,250,.7); }
  .site-card.forum .go { background: linear-gradient(135deg,#3b82f6,#2563eb); }
  .site-card.game:hover { box-shadow: 0 20px 50px rgba(139,92,246,.45); border-color: rgba(196,181,253,.7); }
  .site-card.game .go { background: linear-gradient(135deg,#8b5cf6,#7c3aed); }
  .site-card .glow { position: absolute; width: 260px; height: 260px; border-radius: 50%;
                     filter: blur(80px); opacity: .35; top: -80px; left: 50%; transform: translateX(-50%); }
  .site-card.forum .glow { background: #3b82f6; }
  .site-card.game .glow { background: #8b5cf6; }

  /* ============ 视图 2：登录/注册表单 ============ */
  .auth-view { display: none; }
  .auth-view.show { display: block; }
  .choose-view.hide { display: none; }
  .card { position: relative; z-index: 1; background: rgba(255,255,255,.95); border-radius: 18px;
          width: 100%; max-width: 410px; margin: 0 auto; padding: 26px 30px 26px;
          box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .back-link { display: inline-flex; align-items: center; gap: 4px; font-size: 13px;
               color: #64748b; text-decoration: none; margin-bottom: 14px; cursor: pointer; }
  .back-link:hover { color: var(--accent); }
  .brand { text-align: center; margin-bottom: 20px; }
  .brand .logo { font-size: 34px; }
  .brand h1 { font-size: 20px; margin-top: 6px; color: #1e293b; }
  .brand p { font-size: 12.5px; color: #94a3b8; margin-top: 4px; }
  .tabs { display: flex; background: #f1f5f9; border-radius: 10px; padding: 4px; margin-bottom: 20px; }
  .tabs button { flex: 1; padding: 9px 0; border: none; background: transparent; cursor: pointer;
                 border-radius: 8px; font-size: 14px; font-weight: 600; color: #64748b; transition: .15s; }
  .tabs button.active { background: #fff; color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #475569; margin-bottom: 6px; }
  .field input { width: 100%; padding: 11px 14px; border: 1px solid #e2e8f0;
                 border-radius: 10px; font-size: 14px; outline: none; transition: .15s; }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .hint { font-size: 12px; color: #94a3b8; }
  .submit { width: 100%; padding: 12px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
            font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px; transition: .2s; }
  .submit:hover { transform: translateY(-1px); }
  .submit:disabled { opacity: .6; cursor: not-allowed; transform: none; }
  .share-note { text-align: center; font-size: 11.5px; color: #94a3b8; margin-top: 14px; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
           background: #0f172a; color: #fff; padding: 10px 20px; border-radius: 8px;
           font-size: 14px; opacity: 0; transition: .3s; pointer-events: none; z-index: 20; }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.err { background: #dc2626; }

  @media (max-width: 720px) {
    .choose { grid-template-columns: 1fr; }
    .site-card { padding: 34px 24px; }
  }
</style>
</head>
<body>

<!-- ============ 视图 1：站点选择 ============ -->
<div class="wrap choose-view" id="chooseView">
  <div class="choose-head">
    <h1>欢迎，请选择要进入的站点</h1>
    <p>同一账号可在苦海论坛与娱乐游戏板块通用</p>
  </div>
  <div class="choose">
    <div class="site-card forum" onclick="chooseSite('forum')">
      <div class="glow"></div>
      <div class="ico">⌬</div>
      <h2>苦海</h2>
      <p>发帖讨论、分享资源、求助问答、<br />评论互动与消息通知</p>
      <span class="go">进入苦海 →</span>
    </div>
    <div class="site-card game" onclick="chooseSite('game')">
      <div class="glow"></div>
      <div class="ico">◈</div>
      <h2>娱乐游戏</h2>
      <p>分享好玩的游戏、封面与截图、<br />游戏资源与游玩心得</p>
      <span class="go">进入娱乐游戏 →</span>
    </div>
  </div>
</div>

<!-- ============ 视图 2：登录 / 注册 ============ -->
<div class="wrap auth-view" id="authView">
  <div class="card">
    <span class="back-link" onclick="backToChoose()">← 重新选择站点</span>
    <div class="brand">
      <div class="logo" id="brandLogo">⌬</div>
      <h1 id="brandTitle">苦海</h1>
      <p id="brandSub">登录后即可发帖、评论、点赞</p>
    </div>
    <div class="tabs">
      <button id="tab-login" class="active" onclick="switchTab('login')">登录</button>
      <button id="tab-register" onclick="switchTab('register')">注册</button>
    </div>

    <div id="form-login">
      <div class="field">
        <label>用户名</label>
        <input id="l-username" type="text" autocomplete="username" placeholder="请输入用户名" />
      </div>
      <div class="field">
        <label>密码</label>
        <input id="l-password" type="password" autocomplete="current-password" placeholder="请输入密码" />
      </div>
      <button class="submit" onclick="doLogin()">登录</button>
    </div>

    <div id="form-register" style="display:none">
      <div class="field">
        <label>用户名</label>
        <input id="r-username" type="text" autocomplete="username" placeholder="2-30 位，字母/数字/下划线/中文" />
      </div>
      <div class="field">
        <label>密码</label>
        <input id="r-password" type="password" autocomplete="new-password" placeholder="至少 6 位" />
      </div>
      <div class="field">
        <label>昵称（可选）</label>
        <input id="r-nickname" type="text" placeholder="展示名，默认取用户名" />
      </div>
      <button class="submit" onclick="doRegister()">注册并登录</button>
      <div class="hint" style="margin-top:10px">💡 第一个注册的用户会自动成为管理员</div>
    </div>

    <div class="share-note">登录后将进入「<span id="targetName">苦海</span>」</div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { auth, api, initAnimatedBackground, initMusicPlayer } from './common.js';

  initAnimatedBackground();
  initMusicPlayer({
    tracks: [
      { name: 'Follow', url: '/music/01.mp3' },
      { name: 'Solaris', url: '/music/02.mp3' },
    ],
  });

  const SITES = {
    forum: { name: '苦海', logo: '⌬', sub: '登录后即可发帖、评论、点赞', home: '/forum.html',
             accent: '#22d3ee', accent2: '#0e7490' },
    game:  { name: '娱乐游戏', logo: '◈', sub: '登录后即可分享游戏与资源', home: '/game.html',
             accent: '#e879f9', accent2: '#a21caf' },
  };
  let target = 'forum';

  function toast(msg, isErr = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = isErr ? 'show err' : 'show';
    clearTimeout(el._t);
    el._t = setTimeout(() => (el.className = ''), 2400);
  }
  window.toast = toast;

  // 选择站点：已登录直接进入，未登录进入对应表单
  window.chooseSite = function (site) {
    target = site;
    const cfg = SITES[site];
    if (auth.isLoggedIn()) { location.href = cfg.home; return; }

    document.documentElement.style.setProperty('--accent', cfg.accent);
    document.documentElement.style.setProperty('--accent-2', cfg.accent2);
    document.getElementById('brandLogo').textContent = cfg.logo;
    document.getElementById('brandTitle').textContent = cfg.name;
    document.getElementById('brandSub').textContent = cfg.sub;
    document.getElementById('targetName').textContent = cfg.name;
    switchTab('login');

    document.getElementById('chooseView').classList.add('hide');
    document.getElementById('authView').classList.add('show');
  };

  window.backToChoose = function () {
    document.getElementById('authView').classList.remove('show');
    document.getElementById('chooseView').classList.remove('hide');
  };

  window.switchTab = function (tab) {
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    document.getElementById('form-login').style.display = tab === 'login' ? '' : 'none';
    document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
  };

  window.doLogin = async function () {
    const username = document.getElementById('l-username').value.trim();
    const password = document.getElementById('l-password').value;
    if (!username || !password) return toast('请输入用户名和密码', true);
    try {
      const data = await api('/api/users/login', {
        method: 'POST',
        body: JSON.stringify({ username, password }),
      });
      auth.set(data.token, data.user);
      toast('登录成功');
      setTimeout(() => (location.href = SITES[target].home), 400);
    } catch (e) { toast(e.message, true); }
  };

  window.doRegister = async function () {
    const username = document.getElementById('r-username').value.trim();
    const password = document.getElementById('r-password').value;
    const nickname = document.getElementById('r-nickname').value.trim();
    if (!username || !password) return toast('请填写用户名和密码', true);
    try {
      const data = await api('/api/users/register', {
        method: 'POST',
        body: JSON.stringify({ username, password, nickname }),
      });
      auth.set(data.token, data.user);
      toast('注册成功');
      setTimeout(() => (location.href = SITES[target].home), 400);
    } catch (e) { toast(e.message, true); }
  };

  ['l-username','l-password'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));
  ['r-username','r-password','r-nickname'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); }));
</script>
</body>
</html>
