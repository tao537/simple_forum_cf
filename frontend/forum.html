<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>苦海论坛</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         color: #1f2937; min-height: 100vh; }
  .container { max-width: 860px; margin: 0 auto; padding: 0 16px 40px; }

  /* 顶部导航（磨砂） */
  nav { background: rgba(255,255,255,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 1px 3px rgba(15,23,42,.06); position: sticky; top: 0; z-index: 30; }
  nav .inner { max-width: 860px; margin: 0 auto; padding: 12px 16px;
               display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0f172a; }
  .brand .logo { width: 34px; height: 34px; border-radius: 10px; font-size: 18px;
                 display: flex; align-items: center; justify-content: center;
                 background: linear-gradient(135deg,#3b82f6,#2563eb); color: #fff; }
  .brand b { font-size: 18px; }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 14px;
               color: #334155; background: rgba(241,245,249,.9); padding: 6px 12px; border-radius: 999px;
               text-decoration: none; }
  .user-chip:hover { background: #e2e8f0; }
  .user-chip .avatar { width: 24px; height: 24px; border-radius: 50%;
                       background: #3b82f6; color: #fff; font-size: 12px;
                       display: flex; align-items: center; justify-content: center; }
  .link { color: #2563eb; text-decoration: none; font-size: 14px; font-weight: 500; }
  .link:hover { text-decoration: underline; }
  .logout { color: #94a3b8; font-size: 13px; cursor: pointer; }
  .logout:hover { color: #ef4444; }
  .bell { position: relative; font-size: 18px; text-decoration: none; }
  .bell-count { position: absolute; top: -6px; right: -10px; min-width: 18px; height: 18px;
                padding: 0 4px; border-radius: 999px; background: #ef4444; color: #fff;
                font-size: 11px; font-weight: 700; display: none; align-items: center;
                justify-content: center; }

  /* 横幅：苦海水墨海景（轮播） */
  .banner { position: relative; height: 260px; border-radius: 18px; overflow: hidden;
            margin-top: 18px; box-shadow: 0 10px 30px rgba(15,23,42,.25); }
  .banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .banner .mask { position: absolute; inset: 0;
                  background: linear-gradient(90deg, rgba(15,23,42,.75) 0%, rgba(15,23,42,.3) 55%, rgba(15,23,42,.06) 100%); }
  .banner .text { position: absolute; left: 28px; bottom: 24px; color: #fff; }
  .banner h2 { font-size: 26px; margin-bottom: 6px; text-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .banner p { font-size: 13px; opacity: .94; text-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .banner .tabs-dots { position: absolute; right: 18px; bottom: 18px; display: flex; gap: 6px; }
  .banner .tabs-dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.5);
                            transition: .3s; }
  .banner .tabs-dots span.on { background: #fff; width: 18px; border-radius: 4px; }

  /* 精选推荐区 */
  .featured-section { margin-top: 16px; }
  .section-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700;
                   color: #1e293b; margin-bottom: 12px; }
  .section-title .chip { font-size: 11px; font-weight: 600; color: #b45309; background: rgba(254,243,199,.95);
                         padding: 2px 9px; border-radius: 999px; }
  .featured-scroll { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .fcard { background: rgba(255,255,255,.86); backdrop-filter: blur(12px); border-radius: 14px;
           padding: 14px 16px; cursor: pointer; transition: .18s; border: 1px solid rgba(255,255,255,.6);
           box-shadow: 0 2px 10px rgba(15,23,42,.07); }
  .fcard:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(15,23,42,.13); }
  .fcard .ft { font-size: 14px; font-weight: 600; color: #111827; margin-bottom: 6px;
               display: flex; gap: 6px; align-items: center; }
  .fcard .fs { font-size: 12px; color: #64748b; line-height: 1.5; margin-bottom: 8px;
               display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fcard .fm { font-size: 11px; color: #94a3b8; display: flex; gap: 12px; }
  .star-badge { font-size: 11px; font-weight: 700; color: #b45309; background: #fef3c7;
                padding: 2px 8px; border-radius: 6px; flex-shrink: 0; }

  /* 工具栏 */
  .catbar { display: flex; gap: 8px; margin: 14px 0 6px; flex-wrap: wrap; }
  .catbar button { border: 1px solid rgba(226,232,240,.8); background: rgba(255,255,255,.85);
                   padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
                   color: #64748b; cursor: pointer; transition: .15s; backdrop-filter: blur(6px); }
  .catbar button:hover { border-color: #93c5fd; color: #2563eb; }
  .catbar button.active { background: linear-gradient(135deg,#3b82f6,#2563eb); border-color: transparent; color: #fff; }

  /* 公告条 */
  .announcement { margin: 14px 0 4px; padding: 12px 16px; border-radius: 12px;
                  background: linear-gradient(90deg, rgba(30,64,175,.9), rgba(59,130,246,.85));
                  color: #fff; font-size: 14px; display: flex; gap: 10px; align-items: center;
                  box-shadow: 0 4px 14px rgba(37,99,235,.25); }
  .announcement .tag { background: rgba(255,255,255,.22); padding: 2px 10px; border-radius: 999px;
                       font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .announcement .txt { line-height: 1.5; }
  .site-footer { margin: 30px 0 10px; padding: 18px 0; border-top: 1px solid rgba(148,163,184,.35);
                 text-align: center; font-size: 13px; color: #94a3b8; line-height: 1.8; }

  .toolbar { display: flex; align-items: center; gap: 10px; margin: 12px 0 16px; flex-wrap: wrap; }
  .tabs { display: flex; background: rgba(255,255,255,.85); border-radius: 10px; padding: 4px;
          box-shadow: 0 1px 3px rgba(15,23,42,.05); backdrop-filter: blur(6px); }
  .tabs button { border: none; background: transparent; padding: 8px 16px; cursor: pointer;
                 border-radius: 8px; font-size: 14px; font-weight: 600; color: #64748b;
                 transition: .15s; }
  .tabs button.active { background: #eff6ff; color: #2563eb; }
  .searchbox { display: flex; flex: 1; min-width: 200px; gap: 8px; position: relative; }
  .searchbox .search-wrap { position: relative; flex: 1; min-width: 0; }
  .searchbox input { width: 100%; padding: 10px 34px 10px 14px; border: 1px solid rgba(226,232,240,.8);
                     border-radius: 10px; font-size: 14px; outline: none; background: rgba(255,255,255,.88); box-sizing: border-box; }
  .searchbox input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
  .search-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
                  border: none; background: none; color: #94a3b8; font-size: 14px; cursor: pointer; padding: 2px 4px; display: none; }
  .search-clear:hover { color: #475569; }
  /* 联想/历史/热词下拉 */
  .suggest { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 50;
             background: rgba(255,255,255,.97); border: 1px solid #e2e8f0; border-radius: 12px;
             box-shadow: 0 12px 32px rgba(15,23,42,.16); padding: 10px 8px; max-height: 340px; overflow-y: auto; }
  .suggest-sec { margin-bottom: 8px; }
  .suggest-sec:last-child { margin-bottom: 0; }
  .suggest-title { font-size: 12px; font-weight: 700; color: #94a3b8; padding: 4px 10px 6px; display: flex;
                   justify-content: space-between; align-items: center; }
  .suggest-title .s-clear { color: #94a3b8; cursor: pointer; font-weight: 500; font-size: 12px; }
  .suggest-title .s-clear:hover { color: #dc2626; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; margin: 3px;
          border-radius: 20px; font-size: 13px; cursor: pointer; transition: .12s;
          border: 1px solid #e2e8f0; background: #f8fafc; color: #334155; }
  .chip:hover { background: #eff6ff; border-color: #93c5fd; color: #2563eb; }
  .chip .x { color: #cbd5e1; font-size: 12px; }
  .chip .x:hover { color: #dc2626; }
  .suggest-list .item { display: block; width: 100%; text-align: left; padding: 8px 12px; border: none;
                        background: none; border-radius: 8px; font-size: 14px; color: #334155; cursor: pointer; }
  .suggest-list .item:hover { background: #f1f5f9; color: #2563eb; }
  .suggest-empty { font-size: 13px; color: #94a3b8; padding: 6px 12px; }
  mark { background: #fef08a; color: inherit; padding: 0 1px; border-radius: 2px; }

  .btn { padding: 9px 16px; border: none; border-radius: 10px; cursor: pointer;
         font-size: 14px; font-weight: 600; transition: .15s; white-space: nowrap; }
  .btn-primary { background: linear-gradient(135deg,#3b82f6,#2563eb); color: #fff; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(37,99,235,.35); }
  .btn-ghost { background: rgba(255,255,255,.9); color: #334155; border: 1px solid #e2e8f0; }
  .btn-ghost:hover { background: #f8fafc; }
  .btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 8px; }

  /* 帖子卡片（磨砂玻璃） */
  .post { background: rgba(255,255,255,.86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
          border-radius: 14px; padding: 18px 20px; margin-bottom: 12px;
          box-shadow: 0 2px 10px rgba(15,23,42,.07); cursor: pointer; transition: .18s;
          border: 1px solid rgba(255,255,255,.65); }
  .post:hover { box-shadow: 0 8px 24px rgba(15,23,42,.13); transform: translateY(-2px);
                border-color: rgba(191,219,254,.9); }
  .post.pinned { background: linear-gradient(180deg, rgba(255,251,235,.94), rgba(255,255,255,.86)); border-color: rgba(253,230,138,.9); }
  .post.featured { border-color: rgba(251,191,36,.55); }
  .post-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; color: #111827;
                display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .post-title:hover { color: #2563eb; }
  .pin-badge { font-size: 11px; font-weight: 700; color: #b45309; background: #fef3c7;
               padding: 2px 8px; border-radius: 6px; flex-shrink: 0; }
  .hot-badge { font-size: 11px; font-weight: 700; color: #dc2626; background: #fee2e2;
               padding: 2px 8px; border-radius: 6px; flex-shrink: 0; }
  .star-badge { font-size: 11px; font-weight: 700; color: #b45309; background: #fef3c7;
                padding: 2px 8px; border-radius: 6px; flex-shrink: 0; }
  .cat-badge { font-size: 11px; font-weight: 600; color: #2563eb; background: #eff6ff;
               padding: 2px 8px; border-radius: 6px; flex-shrink: 0; }
  .post-summary { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 10px;
                  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                  overflow: hidden; }
  .thumbs { display: flex; gap: 6px; margin-bottom: 10px; }
  .thumbs img { width: 74px; height: 74px; object-fit: cover; border-radius: 8px;
                border: 1px solid #f1f5f9; }
  .post-meta { display: flex; gap: 16px; font-size: 12px; color: #94a3b8;
               align-items: center; flex-wrap: wrap; }
  .post-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .like { cursor: pointer; user-select: none; transition: .15s; color: #94a3b8;
          font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }
  .like.liked { color: #dc2626; }
  .like:hover { color: #dc2626; }
  .tag-me { color: #2563eb; background: #eff6ff; padding: 1px 7px; border-radius: 6px;
            font-size: 11px; }

  .empty { text-align: center; padding: 70px 20px; color: #94a3b8;
           background: rgba(255,255,255,.85); border-radius: 14px; }
  .pager { display: flex; justify-content: space-between; align-items: center;
           margin-top: 16px; font-size: 14px; color: #64748b; }
  .pager .pages { display: flex; gap: 6px; align-items: center; }

  /* 发帖弹窗 */
  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.55);
             display: none; align-items: center; justify-content: center; z-index: 50;
             padding: 20px; backdrop-filter: blur(4px); }
  .overlay.show { display: flex; }
  .modal { background: rgba(255,255,255,.97); border-radius: 16px; width: 100%; max-width: 600px;
           padding: 26px; box-shadow: 0 24px 70px rgba(15,23,42,.3);
           max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 18px; margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #64748b; margin-bottom: 6px; }
  .field input[type=text], .field textarea, .field select { width: 100%; padding: 11px 12px;
    border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; outline: none;
    font-family: inherit; resize: vertical; background: #fff; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
  .field textarea { min-height: 150px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .upload-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .upload-preview { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .upload-preview .u { position: relative; }
  .upload-preview img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
  .upload-preview .u .rm { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
    background: #dc2626; color: #fff; border-radius: 50%; border: none; cursor: pointer;
    font-size: 12px; line-height: 20px; text-align: center; }
  .hint { font-size: 12px; color: #94a3b8; margin-top: 6px; }

  #toast { position: fixed; bottom: 24px; left: 50%;
           transform: translateX(-50%) translateY(80px);
           background: #0f172a; color: #fff; padding: 10px 20px; border-radius: 8px;
           font-size: 14px; opacity: 0; transition: .3s; pointer-events: none; z-index: 60; }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.err { background: #dc2626; }
</style>
</head>
<body>

<nav>
  <div class="inner">
    <a href="/forum.html" class="brand"><span class="logo">⌬</span><b>苦海</b></a>
    <div class="nav-right" id="navRight"></div>
  </div>
</nav>

<div class="container">
  <div class="banner">
    <img src="/wallpapers/kuhai-sea-v2.jpg" alt="" />
    <div class="mask"></div>
    <div class="text">
      <h2 id="bannerTitle">金榜题名 · 高考必胜</h2>
      <p id="bannerSubtitle">苦海无涯，学海作舟 —— 乾坤未定，你我皆是黑马</p>
    </div>
    <div class="tabs-dots" id="bannerDots"></div>
  </div>

  <div class="announcement" id="announcement" style="display:none"></div>

  <div class="featured-section" id="featuredSection" style="display:none">
    <div class="section-title">⭐ 管理员精选 <span class="chip">编辑推荐</span></div>
    <div class="featured-scroll" id="featuredList"></div>
  </div>

  <div class="catbar" id="catbar">
    <button class="active" data-cat="" onclick="setCategory('')">全部</button>
    <button data-cat="壁纸" onclick="setCategory('壁纸')">🖼 壁纸</button>
    <button data-cat="资源" onclick="setCategory('资源')">📦 资源</button>
    <button data-cat="求助" onclick="setCategory('求助')">🙋 求助</button>
    <button data-cat="闲聊" onclick="setCategory('闲聊')">💬 闲聊</button>
  </div>

  <div class="toolbar">
    <div class="tabs">
      <button id="tab-new" class="active" onclick="setSort('new')">最新</button>
      <button id="tab-hot" onclick="setSort('hot')">🔥 热门</button>
      <button id="tab-top" onclick="setSort('top')">👍 最赞</button>
    </div>
    <div class="searchbox">
      <div class="search-wrap">
        <input id="kw" type="text" placeholder="搜索标题或内容…" autocomplete="off" />
        <button class="search-clear" id="kwClear" onclick="clearKw(event)" title="清除">✕</button>
        <div class="suggest" id="suggest" style="display:none">
          <div class="suggest-sec" id="sec-history" style="display:none">
            <div class="suggest-title">🕘 搜索历史 <span class="s-clear" onclick="clearHistory(event)">清空</span></div>
            <div id="suggest-history"></div>
          </div>
          <div class="suggest-sec" id="sec-hot" style="display:none">
            <div class="suggest-title">🔥 热门搜索</div>
            <div id="suggest-hot"></div>
          </div>
          <div class="suggest-sec" id="sec-list" style="display:none">
            <div class="suggest-title">💡 联想</div>
            <div class="suggest-list" id="suggest-list"></div>
          </div>
        </div>
      </div>
      <button class="btn btn-ghost" onclick="load(1)">搜索</button>
    </div>
    <button class="btn btn-primary" onclick="openCreate()">✏️ 发帖</button>
  </div>

  <div id="list"></div>

  <div class="pager" id="pager" style="display:none">
    <span id="pagerInfo"></span>
    <div class="pages">
      <button class="btn btn-ghost btn-sm" id="prevBtn" onclick="load(state.page-1)">上一页</button>
      <span id="pageNow"></span>
      <button class="btn btn-ghost btn-sm" id="nextBtn" onclick="load(state.page+1)">下一页</button>
    </div>
  </div>

  <footer class="site-footer" id="siteFooter" style="display:none"></footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">发布新帖</h2>
    <div class="field">
      <label>分类</label>
      <select id="f-category">
        <option value="">选择分类（可选）</option>
        <option value="壁纸">🖼 壁纸</option>
        <option value="资源">📦 资源</option>
        <option value="求助">🙋 求助</option>
        <option value="闲聊">💬 闲聊</option>
      </select>
    </div>
    <div class="field">
      <label>标题 *</label>
      <input id="f-title" type="text" placeholder="一句话说清主题" maxlength="100" />
    </div>
    <div class="field">
      <label>内容 *</label>
      <textarea id="f-content" placeholder="详细说说…（可用 @用户名 提及他人）"></textarea>
    </div>
    <div class="field">
      <label>图片（可选，最多 9 张）</label>
      <div class="upload-row">
        <input type="file" id="f-file" accept="image/*" multiple />
        <span class="hint" id="up-hint"></span>
      </div>
      <div class="upload-preview" id="up-preview"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="pubBtn" onclick="submitPost()">发布</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { auth, api, escapeHtml, parseImages, renderNav, refreshUnread,
           initAnimatedBackground, initMusicPlayer, processImageForUpload } from './common.js';

  const API = '/api/posts';
  const state = { page: 1, size: 10, keyword: '', total: 0, sort: 'new', category: '' };
  let pendingImages = [];

  // 启动动态背景 + 背景音乐
  initAnimatedBackground();
  initMusicPlayer({
    tracks: [
      { name: 'Follow', url: '/music/01.mp3' },
      { name: 'Solaris', url: '/music/02.mp3' },
    ],
  });

  // 横幅轮播
  const BANNERS = [
    '/wallpapers/kuhai-sea-v2.jpg',
    '/wallpapers/kuhai-sea.jpg',
  ];
  let bannerIdx = 0;
  const bannerImg = document.querySelector('.banner img');
  const dotsBox = document.getElementById('bannerDots');
  dotsBox.innerHTML = BANNERS.map((_, i) => `<span class="${i === 0 ? 'on' : ''}"></span>`).join('');
  const dots = [...dotsBox.children];
  setInterval(() => {
    bannerIdx = (bannerIdx + 1) % BANNERS.length;
    bannerImg.src = BANNERS[bannerIdx];
    bannerImg.style.opacity = 0;
    setTimeout(() => { bannerImg.style.opacity = 1; }, 60);
    dots.forEach((d, i) => d.classList.toggle('on', i === bannerIdx));
  }, 6000);

  // 加载站点文案（banner 标语 / 公告 / 页脚 / 分类），失败时保留默认
  async function loadSiteContent() {
    try {
      const data = await api('/api/site-content');
      const c = data.content || {};
      if (c.bannerTitle) document.getElementById('bannerTitle').textContent = c.bannerTitle;
      if (c.bannerSubtitle) document.getElementById('bannerSubtitle').textContent = c.bannerSubtitle;

      const ann = document.getElementById('announcement');
      if (c.announcement) {
        ann.style.display = 'flex';
        ann.innerHTML = `<span class="tag">📢 公告</span><span class="txt">${escapeHtml(c.announcement)}</span>`;
      }

      const footer = document.getElementById('siteFooter');
      if (c.footerText) {
        footer.style.display = 'block';
        footer.textContent = c.footerText;
      }

      const cats = Array.isArray(data.categories) ? data.categories.filter(Boolean) : [];
      if (cats.length) {
        const catbar = document.getElementById('catbar');
        const active = state.category;
        catbar.innerHTML = `<button class="${active ? '' : 'active'}" data-cat="" onclick="setCategory('')">全部</button>` +
          cats.map((n) => `<button data-cat="${escapeHtml(n)}" class="${active === n ? 'active' : ''}" onclick="setCategory('${escapeHtml(n)}')">${escapeHtml(n)}</button>`).join('');
        const sel = document.getElementById('f-category');
        sel.innerHTML = '<option value="">选择分类（可选）</option>' +
          cats.map((n) => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
      }
    } catch { /* 保留默认文案与分类 */ }
  }

  function toast(msg, isErr = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = isErr ? 'show err' : 'show';
    clearTimeout(el._t);
    el._t = setTimeout(() => (el.className = ''), 2400);
  }
  window.toast = toast;

  window.logout = function () {
    auth.clear();
    toast('已退出登录');
    renderNav();
    load(state.page);
  };

  window.setSort = function (s) {
    state.sort = s;
    ['new','hot','top'].forEach(k =>
      document.getElementById('tab-' + k).classList.toggle('active', k === s));
    load(1);
  };

  window.setCategory = function (c) {
    state.category = c;
    [...document.querySelectorAll('#catbar button')].forEach(b =>
      b.classList.toggle('active', b.dataset.cat === c));
    load(1);
  };

  function likePost(e, id) {
    e.stopPropagation();
    if (!auth.isLoggedIn()) { toast('请先登录', true); return; }
    api(`${API}/${id}/like`, { method: 'POST' }).then(data => {
      const el = document.querySelector(`.like[data-id="${id}"]`);
      el.classList.toggle('liked', data.liked);
      el.innerHTML = (data.liked ? '❤️' : '🤍') + ' ' + data.upvotes;
    }).catch(err => toast(err.message, true));
  }
  window.likePost = likePost;

  // 加载精选
  async function loadFeatured() {
    try {
      const data = await api(`${API}/featured`);
      const box = document.getElementById('featuredSection');
      if (!data.rows?.length) { box.style.display = 'none'; return; }
      box.style.display = '';
      document.getElementById('featuredList').innerHTML = data.rows.map(p => `
        <div class="fcard" onclick="location.href='/post.html?id=${p.id}'">
          <div class="ft"><span class="star-badge">⭐ 精选</span>${escapeHtml(p.title)}</div>
          <div class="fs">${escapeHtml(p.summary || '')}</div>
          <div class="fm">
            <span>👤 ${escapeHtml(p.author_name)}</span>
            <span>❤️ ${p.upvotes}</span>
            <span>💬 ${p.comment_count}</span>
          </div>
        </div>`).join('');
    } catch { /* 静默 */ }
  }

  async function load(page = 1) {
    state.page = Math.max(1, page);
    state.keyword = document.getElementById('kw').value.trim();
    // 首页搜索时记录历史（同一关键词只记一次）
    if (state.page === 1 && state.keyword && state.keyword !== lastLoggedKw) {
      lastLoggedKw = state.keyword;
      addHistory(state.keyword);
    }
    const qs = new URLSearchParams({ page: state.page, size: state.size, keyword: state.keyword, sort: state.sort });
    if (state.category) qs.set('category', state.category);
    try {
      const data = await api(`${API}?${qs}`);
      state.total = data.total;
      render(data.rows);
      renderPager();
      refreshUnread();
    } catch (e) { toast(e.message, true); }
  }
  window.load = load;

  // ==================== 搜索增强（历史/热词/联想/高亮） ====================
  const HISTORY_KEY = 'kuhai_history';
  const HOT_WORDS = ['高考', '壁纸', '英语', '学习方法', '数学', '经验分享'];
  let lastLoggedKw = '';
  let suggestTimer = null, debounceTimer = null;

  function getHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; } }
  function saveHistory(h) { try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, 8))); } catch {} }
  function addHistory(kw) {
    kw = kw.trim(); if (!kw) return;
    saveHistory([kw, ...getHistory().filter(x => x !== kw)]);
  }
  function escapeAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  // 关键词高亮：先 split 再逐段转义，避免 XSS；kw 含特殊字符也安全
  function hl(text, kw) {
    if (!kw) return escapeHtml(text);
    const parts = String(text).split(kw);
    return parts.map((p, i) => i < parts.length - 1 ? escapeHtml(p) + '<mark>' + escapeHtml(kw) + '</mark>' : escapeHtml(p)).join('');
  }
  function renderSuggest() {
    const kw = document.getElementById('kw').value.trim();
    const hist = getHistory();
    const secH = document.getElementById('sec-history');
    const secHot = document.getElementById('sec-hot');
    const secList = document.getElementById('sec-list');
    secH.style.display = hist.length ? '' : 'none';
    document.getElementById('suggest-history').innerHTML = hist.map(w =>
      `<span class="chip" data-kw="${escapeAttr(w)}" onclick="searchWith(this.dataset.kw)">${escapeHtml(w)}<span class="x" onclick="removeHistory(event, this)">✕</span></span>`).join('');
    secHot.style.display = kw ? 'none' : '';
    document.getElementById('suggest-hot').innerHTML = HOT_WORDS.map(w =>
      `<span class="chip" onclick="searchWith('${escapeAttr(w)}')">${escapeHtml(w)}</span>`).join('');
    const show = hist.length || !kw;
    document.getElementById('suggest').style.display = show ? '' : 'none';
    if (!kw) secList.style.display = 'none';
  }
  function fetchSuggest() {
    const kw = document.getElementById('kw').value.trim();
    const secList = document.getElementById('sec-list');
    const box = document.getElementById('suggest-list');
    if (!kw) { secList.style.display = 'none'; return; }
    api(`${API}/suggest?keyword=${encodeURIComponent(kw)}&limit=6`)
      .then(d => {
        if (!d.rows || !d.rows.length) { secList.style.display = 'none'; return; }
        box.innerHTML = d.rows.map(r =>
          `<button class="item" onclick="searchWith('${escapeAttr(r.title)}')">${hl(r.title, kw)}</button>`).join('');
        secList.style.display = '';
      }).catch(() => { secList.style.display = 'none'; });
  }
  window.searchWith = function (kw) {
    kw = (kw || '').trim();
    if (!kw) return;
    document.getElementById('kw').value = kw;
    document.getElementById('suggest').style.display = 'none';
    addHistory(kw);
    state.keyword = kw;
    load(1);
  };
  window.clearKw = function (e) {
    if (e) e.stopPropagation();
    const input = document.getElementById('kw');
    input.value = '';
    document.getElementById('kwClear').style.display = 'none';
    document.getElementById('suggest').style.display = 'none';
    if (state.keyword) { state.keyword = ''; load(1); }
    input.focus();
  };
  window.clearHistory = function (e) { if (e) e.stopPropagation(); localStorage.removeItem(HISTORY_KEY); renderSuggest(); };
  window.removeHistory = function (e, el) {
    e.stopPropagation();
    saveHistory(getHistory().filter(x => x !== el.parentElement.getAttribute('data-kw')));
    renderSuggest();
  };
  // ==================== /搜索增强 ====================

  function render(rows) {
    const box = document.getElementById('list');
    if (!rows.length) {
      box.innerHTML = state.keyword
        ? `<div class="empty">没有找到与「${escapeHtml(state.keyword)}」相关的内容<br /><span style="font-size:13px;color:#94a3b8">换个关键词试试，或看看全部帖子</span></div>`
        : `<div class="empty">还没有帖子，点击「发帖」发第一条吧 ✨</div>`;
      document.getElementById('pager').style.display = 'none';
      return;
    }
    document.getElementById('pager').style.display = 'flex';
    box.innerHTML = rows.map(p => {
      const imgs = parseImages(p.images);
      const hot = p.upvotes >= 3 || p.comment_count >= 5;
      const me = auth.isLoggedIn() && auth.getUser().id === p.author_id;
      const cls = [p.pinned ? 'pinned' : '', p.featured ? 'featured' : ''].filter(Boolean).join(' ');
      return `
        <div class="post ${cls}" onclick="location.href='/post.html?id=${p.id}'">
          <div class="post-title">
            ${p.pinned ? '<span class="pin-badge">📌 置顶</span>' : ''}
            ${p.featured ? '<span class="star-badge">⭐ 精选</span>' : ''}
            ${hot ? '<span class="hot-badge">🔥 热门</span>' : ''}
            ${p.category ? `<span class="cat-badge">${escapeHtml(p.category)}</span>` : ''}
            ${hl(p.title, state.keyword)}${me ? '<span class="tag-me">我</span>' : ''}
          </div>
          <div class="post-summary">${hl(p.summary || '', state.keyword)}</div>
          ${imgs.length ? `<div class="thumbs">${imgs.slice(0,4).map(i => `<img src="${escapeHtml(i)}" alt="" loading="lazy" />`).join('')}</div>` : ''}
          <div class="post-meta">
            <span>👤 ${escapeHtml(p.author_name)}</span>
            <span class="like ${p.liked ? 'liked' : ''}" data-id="${p.id}" onclick="likePost(event,${p.id})">
              ${p.liked ? '❤️' : '🤍'} ${p.upvotes}
            </span>
            <span>💬 ${p.comment_count}</span>
            <span>👁 ${p.views}</span>
            <span>🕒 ${p.created_at}</span>
          </div>
        </div>`;
    }).join('');
  }

  function renderPager() {
    const totalPages = Math.max(1, Math.ceil(state.total / state.size));
    document.getElementById('pagerInfo').textContent = `共 ${state.total} 条`;
    document.getElementById('pageNow').textContent = `${state.page} / ${totalPages}`;
    document.getElementById('prevBtn').disabled = state.page <= 1;
    document.getElementById('nextBtn').disabled = state.page >= totalPages;
  }

  // 发帖弹窗
  window.openCreate = function () {
    if (!auth.isLoggedIn()) { toast('请先登录', true); return; }
    ['f-title', 'f-content'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-category').value = '';
    pendingImages = [];
    renderPending();
    document.getElementById('overlay').classList.add('show');
    document.getElementById('f-title').focus();
  };
  window.closeModal = function () { document.getElementById('overlay').classList.remove('show'); };

  function renderPending() {
    const box = document.getElementById('up-preview');
    document.getElementById('up-hint').textContent = pendingImages.length
      ? `已选 ${pendingImages.length} 张` : '';
    box.innerHTML = pendingImages.map((u, i) => `
      <div class="u"><img src="${escapeHtml(u)}" alt=""><button class="rm" onclick="removePending(${i})">×</button></div>
    `).join('');
  }
  window.removePending = function (i) {
    pendingImages.splice(i, 1);
    renderPending();
  };

  document.getElementById('f-file').addEventListener('change', async (e) => {
    const files = [...e.target.files];
    if (!files.length) return;
    if (!auth.isLoggedIn()) { toast('请先登录', true); return; }
    if (pendingImages.length + files.length > 9) { toast('最多上传 9 张图片', true); e.target.value=''; return; }
    document.getElementById('up-hint').textContent = '上传中…';
    for (const f of files) {
      if (!f.type.startsWith('image/')) { toast('仅支持图片文件', true); continue; }
      try {
        const processed = await processImageForUpload(f);
        const fd = new FormData();
        fd.append('file', processed);
        const data = await api(`${API}/upload`, { method: 'POST', body: fd });
        pendingImages.push(data.url);
      } catch (err) { toast(err.message, true); }
    }
    document.getElementById('up-hint').textContent = '';
    e.target.value = '';
    renderPending();
  });

  window.submitPost = async function () {
    const payload = {
      title: document.getElementById('f-title').value.trim(),
      content: document.getElementById('f-content').value.trim(),
      category: document.getElementById('f-category').value,
      images: pendingImages,
    };
    if (!payload.title || !payload.content) return toast('标题和内容必填', true);
    const btn = document.getElementById('pubBtn');
    btn.disabled = true;
    try {
      const post = await api(API, { method: 'POST', body: JSON.stringify(payload) });
      toast('发布成功');
      closeModal();
      location.href = `/post.html?id=${post.id}`;
    } catch (e) { toast(e.message, true); }
    btn.disabled = false;
  };

  const kwInput = document.getElementById('kw');
  kwInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { clearTimeout(debounceTimer); clearTimeout(suggestTimer); load(1); }
  });
  kwInput.addEventListener('input', () => {
    const v = kwInput.value;
    document.getElementById('kwClear').style.display = v ? '' : 'none';
    clearTimeout(suggestTimer); clearTimeout(debounceTimer);
    renderSuggest();
    // 停止输入 300ms 后请求联想，再停 400ms 自动搜索（Discourse 式即时搜索）
    suggestTimer = setTimeout(fetchSuggest, 300);
    debounceTimer = setTimeout(() => { if (kwInput.value.trim()) load(1); }, 400);
  });
  kwInput.addEventListener('focus', () => { renderSuggest(); document.getElementById('suggest').style.display = ''; });
  kwInput.addEventListener('blur', () => { setTimeout(() => { document.getElementById('suggest').style.display = 'none'; }, 200); });
  document.getElementById('overlay').addEventListener('click', e => {
    if (e.target.id === 'overlay') closeModal();
  });

  renderNav();
  load(1);
  loadFeatured();
  loadSiteContent();
</script>
</body>
</html>
