<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苦海影视</title>
<!-- hls.js 用于播放 m3u8 视频：本地文件 + 按需加载
     （原来从 cdn.jsdelivr.net 同步加载，国内手机网络被墙，整页会一直等它 → 打不开） -->
<link rel="stylesheet" href="video.css?v=20261110">
</head>
<body>
<div class="container">
  <!-- 搜索页 -->
  <div class="search-page" id="searchPage">
    <a href="/game.html" class="back-link">← 返回游戏站</a>

    <div class="header">
      <h1>🎬 苦海影视</h1>
      <p>在线搜索和观看电影、电视剧、动漫、综艺</p>
    </div>

    <!-- 搜索框 -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="输入电影名、电视剧名搜索..." />
      <button onclick="searchVideo()">搜索</button>
    </div>

    <!-- 搜索结果 -->
    <div class="section-title" id="resultTitle">热门推荐</div>
    <div class="movie-grid" id="movieGrid">
      <div class="empty">输入关键词搜索影视资源</div>
    </div>
  </div>

  <!-- 详情播放页 -->
  <div class="detail-page" id="detailPage">
    <a href="javascript:goBack()" class="back-link">← 返回搜索结果</a>

    <!-- 影视详情 -->
    <div class="detail-header">
      <div class="detail-poster">
        <img id="detailPoster" src="" alt="封面" />
      </div>
      <div class="detail-info">
        <div class="detail-name" id="detailName"></div>
        <div class="detail-tags" id="detailTags"></div>
        <div class="detail-blurb" id="detailBlurb"></div>
      </div>
    </div>

    <!-- 播放器 -->
    <div class="player-section">
      <div class="player-title" id="playerTitle">正在播放</div>
      <div class="video-player">
        <video id="videoPlayer" controls playsinline></video>
      </div>
    </div>

    <!-- 剧集列表 -->
    <div class="episodes-section">
      <div class="player-title">选集播放</div>
      <div class="episodes-grid" id="episodesGrid"></div>
    </div>
  </div>
</div>

<script>
// 影视模块状态
let currentEpisodes = [];   // 当前影视的剧集列表
let hls = null;             // hls.js 实例

/**
 * 搜索影视
 */
async function searchVideo() {
  const kw = document.getElementById('searchInput').value.trim();
  console.log('[影视模块] 搜索关键词:', kw);

  if (!kw) {
    alert('请输入搜索关键词');
    return;
  }

  const grid = document.getElementById('movieGrid');
  const title = document.getElementById('resultTitle');
  grid.innerHTML = '<div class="empty">搜索中...</div>';
  title.textContent = '搜索结果';

  try {
    // 调用后端 Worker 代理接口（解决跨域问题）
    const resp = await fetch(`https://api.kuhai.de5.net/api/video/search?keyword=${encodeURIComponent(kw)}`);
    const data = await resp.json();
    console.log('[影视模块] 搜索返回:', data);

    const list = data.list || [];
    if (!list.length) {
      grid.innerHTML = '<div class="empty">没找到相关影视</div>';
      return;
    }

    // 渲染搜索结果
    grid.innerHTML = list.map((item) => `
      <div class="movie-card" onclick="openDetail(${item.id})">
        <div class="movie-poster">
          <img src="${item.pic}" alt="${item.name}" loading="lazy"
               onerror="this.style.display='none'" />
          <div class="movie-status">${item.remarks || ''}</div>
        </div>
        <div class="movie-info">
          <div class="movie-name">${item.name}</div>
          <div class="movie-meta">${item.typeName} ${item.year ? '· ' + item.year : ''}</div>
        </div>
      </div>
    `).join('');
    window._searchList = list;
  } catch (e) {
    console.error('[影视模块] 搜索失败:', e);
    grid.innerHTML = `<div class="empty">搜索失败：${e.message}</div>`;
  }
}

/**
 * 打开影视详情页
 * @param {number} id - 影视ID
 */
async function openDetail(id) {
  console.log('[影视模块] 打开详情，id:', id);

  // 从搜索列表中找到对应影视
  const item = (window._searchList || []).find(x => x.id === id);
  if (!item) {
    alert('没找到影视数据');
    return;
  }

  // 填充详情信息
  document.getElementById('detailPoster').src = item.pic;
  document.getElementById('detailName').textContent = item.name;
  document.getElementById('detailBlurb').textContent = item.blurb || '暂无简介';

  // 填充标签
  const tags = [];
  if (item.typeName) tags.push(item.typeName);
  if (item.year) tags.push(item.year);
  if (item.area) tags.push(item.area);
  if (item.remarks) tags.push(item.remarks);
  document.getElementById('detailTags').innerHTML = tags
    .map(t => `<span class="detail-tag">${t}</span>`).join('');

  // 解析播放地址
  // 格式：第01集$https://xxx.m3u8#第02集$https://xxx.m3u8
  const playUrl = item.playUrl || '';
  const episodes = playUrl.split('#').map(ep => {
    const [name, url] = ep.split('$');
    return { name: name || '播放', url: url || '' };
  }).filter(ep => ep.url);
  currentEpisodes = episodes;
  console.log('[影视模块] 解析到剧集数:', episodes.length);

  // 渲染剧集按钮
  const grid = document.getElementById('episodesGrid');
  grid.innerHTML = episodes.map((ep, i) => `
    <button class="episode-btn ${i === 0 ? 'active' : ''}"
            onclick="playEpisode(${i})">${ep.name}</button>
  `).join('');

  // 自动播放第一集
  if (episodes.length) {
    playEpisode(0);
  }

  // 切换到详情页
  document.getElementById('searchPage').classList.add('hide');
  document.getElementById('detailPage').classList.add('show');
  window.scrollTo(0, 0);
}

/**
 * 播放指定剧集
 * @param {number} index - 剧集索引
 */
// 按需加载本地 hls.js（不自带 HLS 的浏览器才需要；文件在 /vendor/hls.min.js）
let hlsLoader = null;
function loadHls() {
  if (window.Hls) return Promise.resolve(window.Hls);
  if (!hlsLoader) {
    hlsLoader = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = '/vendor/hls.min.js';
      s.onload = () => (window.Hls ? resolve(window.Hls) : reject(new Error('播放组件加载失败')));
      s.onerror = () => reject(new Error('播放组件加载失败，请检查网络'));
      document.head.appendChild(s);
    });
  }
  return hlsLoader;
}

async function playEpisode(index) {
  const ep = currentEpisodes[index];
  if (!ep || !ep.url) {
    console.error('[影视模块] 剧集地址不存在，index:', index);
    return;
  }
  console.log('[影视模块] 播放剧集:', ep.name, ep.url);

  document.getElementById('playerTitle').textContent = '正在播放：' + ep.name;

  // 更新选中状态
  document.querySelectorAll('.episode-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === index);
  });

  const video = document.getElementById('videoPlayer');

  // 销毁之前的 hls 实例
  if (hls) {
    hls.destroy();
    hls = null;
  }

  // 只有 iOS Safari 才用原生 HLS（安卓 Chrome 的 canPlayType 会误报支持，实际播不了）
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS && video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = ep.url;
    video.addEventListener('loadedmetadata', () => {
      video.play().catch(e => console.warn('[影视模块] 自动播放被拦截:', e));
    });
    return;
  }

  // 其余浏览器按需加载本地 hls.js
  try {
    const Hls = await loadHls();
    if (!Hls.isSupported()) {
      // 兜底：交给浏览器原生播放（老 iOS 等）
      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = ep.url;
        video.play().catch(e => console.warn('[影视模块] 自动播放被拦截:', e));
        return;
      }
      alert('你的浏览器不支持播放 m3u8 视频');
      return;
    }
    hls = new Hls();
    hls.loadSource(ep.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      console.log('[影视模块] m3u8 加载成功，开始播放');
      video.play().catch(e => console.warn('[影视模块] 自动播放被拦截:', e));
    });
    hls.on(Hls.Events.ERROR, (event, data) => {
      console.error('[影视模块] hls 播放错误:', data);
      if (data.fatal) {
        alert('播放失败，可能是网络问题或资源失效');
      }
    });
  } catch (e) {
    console.error('[影视模块] hls.js 加载失败:', e);
    alert(e.message);
  }
}

/**
 * 返回搜索页
 */
function goBack() {
  console.log('[影视模块] 返回搜索页');
  // 停止播放
  const video = document.getElementById('videoPlayer');
  video.pause();
  if (hls) {
    hls.destroy();
    hls = null;
  }
  document.getElementById('detailPage').classList.remove('show');
  document.getElementById('searchPage').classList.remove('hide');
}

// 回车搜索
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    console.log('[影视模块] 按回车搜索');
    searchVideo();
  }
});

// 页面加载时默认搜索热门电影
window.addEventListener('DOMContentLoaded', () => {
  console.log('[影视模块] 页面加载完成，默认加载热门');
  document.getElementById('searchInput').value = '热门';
  searchVideo();
});
</script>
</body>
</html>
