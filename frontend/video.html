<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苦海影视</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  color: #fff;
}
.container { max-width: 900px; margin: 0 auto; padding: 20px; }

.header { text-align: center; padding: 30px 0; }
.header h1 { font-size: 28px; margin-bottom: 8px; }
.header p { color: #94a3b8; font-size: 14px; }

.back-link { display: inline-block; margin-bottom: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; }
.back-link:hover { color: #fff; }

/* 搜索框 */
.search-box {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
}
.search-box input {
  flex: 1;
  padding: 14px 20px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.05);
  color: #fff;
  font-size: 15px;
  outline: none;
}
.search-box input:focus { border-color: #3b82f6; }
.search-box button {
  padding: 14px 28px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #1e3a8a, #3b82f6);
  color: #fff;
  font-size: 15px;
  cursor: pointer;
}

/* 搜索结果 */
.section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #e2e8f0; }
.movie-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
}
.movie-card {
  background: rgba(255,255,255,.05);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: all .2s;
}
.movie-card:hover {
  background: rgba(255,255,255,.1);
  transform: translateY(-3px);
}
.movie-poster {
  width: 100%;
  height: 200px;
  background: #333;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
}
.movie-poster img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.movie-info { padding: 12px; }
.movie-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.movie-date { font-size: 12px; color: #94a3b8; }

/* 播放弹窗 */
.player-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.9);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.player-modal.show { display: flex; }
.player-container {
  width: 100%;
  max-width: 900px;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
}
.player-container iframe {
  width: 100%;
  height: 100%;
  border: none;
}
.close-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,.2);
  border: none;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  z-index: 10;
}
.close-btn:hover { background: rgba(255,255,255,.3); }

.empty { text-align: center; color: #64748b; padding: 40px 0; font-size: 14px; }

/* 手机版响应式设计 */
@media (max-width: 768px) {
  .container { padding: 12px; }
  .header { padding: 20px 0; }
  .header h1 { font-size: 22px; }
  
  .search-box { flex-direction: column; gap: 10px; }
  .search-box button { width: 100%; padding: 16px 28px; font-size: 16px; }
  
  .movie-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .movie-poster { height: 180px; }
}
</style>
</head>
<body>
<div class="container">
  <a href="/game.html" class="back-link">← 返回游戏站</a>

  <div class="header">
    <h1>🎬 苦海影视</h1>
    <p>在线搜索和观看电影、电视剧</p>
  </div>

  <!-- 搜索框 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="输入电影名或电视剧名搜索..." />
    <button onclick="searchMovie()">搜索</button>
  </div>

  <!-- 搜索结果 -->
  <div id="searchResult">
    <div class="section-title">🔥 热门影视</div>
    <div class="movie-grid" id="movieGrid">
      <div class="empty">输入关键词搜索影视</div>
    </div>
  </div>
</div>

<!-- 播放弹窗 -->
<div class="player-modal" id="playerModal">
  <button class="close-btn" onclick="closePlayer()">✕</button>
  <div class="player-container">
    <iframe id="playerFrame" src="" allowfullscreen></iframe>
  </div>
</div>

<script>
// TMDB API 配置（使用公开 demo key，仅供测试）
const TMDB_API_KEY = 'demo';
const TMDB_BASE = 'https://api.themoviedb.org/3';
const TMDB_IMG = 'https://image.tmdb.org/t/p/w500';

/**
 * 搜索影视
 */
async function searchMovie() {
  const kw = document.getElementById('searchInput').value.trim();
  console.log('[影视模块] 搜索影视，关键词:', kw);
  
  if (!kw) {
    alert('请输入搜索关键词');
    return;
  }
  
  const grid = document.getElementById('movieGrid');
  grid.innerHTML = '<div class="empty">搜索中...</div>';
  
  try {
    // 用 TMDB API 搜索
    const resp = await fetch(`${TMDB_BASE}/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(kw)}&language=zh-CN`);
    const data = await resp.json();
    console.log('[影视模块] 搜索返回:', data);
    
    const movies = (data.results || []).filter(m => m.media_type === 'movie' || m.media_type === 'tv');
    
    if (!movies.length) {
      grid.innerHTML = '<div class="empty">没找到相关影视</div>';
      return;
    }
    
    grid.innerHTML = movies.map((m, i) => `
      <div class="movie-card" onclick="playMovie(${m.id}, '${m.media_type}')">
        <div class="movie-poster">
          ${m.poster_path ? `<img src="${TMDB_IMG}${m.poster_path}" alt="${m.title || m.name}" />` : '🎬'}
        </div>
        <div class="movie-info">
          <div class="movie-title">${m.title || m.name}</div>
          <div class="movie-date">${m.release_date || m.first_air_date || '未知日期'}</div>
        </div>
      </div>
    `).join('');
    window._searchResults = movies;
  } catch (e) {
    console.error('[影视模块] 搜索失败:', e);
    grid.innerHTML = `<div class="empty">搜索失败：${e.message}</div>`;
  }
}

/**
 * 播放影视
 */
function playMovie(id, type) {
  console.log('[影视模块] 播放影视，id:', id, '类型:', type);
  
  // 用 VidSrc 嵌入播放
  const url = `https://vidsrc.to/embed/${type}/${id}`;
  document.getElementById('playerFrame').src = url;
  document.getElementById('playerModal').classList.add('show');
}

/**
 * 关闭播放器
 */
function closePlayer() {
  document.getElementById('playerModal').classList.remove('show');
  document.getElementById('playerFrame').src = '';
}

// 回车搜索
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    console.log('[影视模块] 按回车搜索');
    searchMovie();
  }
});
</script>
</body>
</html>
