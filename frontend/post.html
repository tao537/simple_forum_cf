<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>帖子详情</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         color: #1f2937; min-height: 100vh; }
  nav { background: rgba(255,255,255,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 1px 3px rgba(15,23,42,.06); position: sticky; top: 0; z-index: 30; }
  nav .inner { max-width: 860px; margin: 0 auto; padding: 12px 16px;
               display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0f172a; }
  .brand .logo { width: 34px; height: 34px; border-radius: 10px; font-size: 18px;
                 display: flex; align-items: center; justify-content: center;
                 background: linear-gradient(135deg,#3b82f6,#2563eb); color: #fff; }
  .brand b { font-size: 18px; }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 14px;
               color: #334155; background: #f1f5f9; padding: 6px 12px; border-radius: 999px;
               text-decoration: none; }
  .user-chip:hover { background: #e2e8f0; }
  .user-chip .avatar { width: 24px; height: 24px; border-radius: 50%;
                       background: #3b82f6; color: #fff; font-size: 12px;
                       display: flex; align-items: center; justify-content: center; }
  .link { color: #3b82f6; text-decoration: none; font-size: 14px; font-weight: 500; }
  .link:hover { text-decoration: underline; }
  .logout { color: #94a3b8; font-size: 13px; cursor: pointer; }
  .logout:hover { color: #ef4444; }
  .bell { position: relative; font-size: 18px; text-decoration: none; }
  .bell-count { position: absolute; top: -6px; right: -10px; min-width: 18px; height: 18px;
                padding: 0 4px; border-radius: 999px; background: #ef4444; color: #fff;
                font-size: 11px; font-weight: 700; display: none; align-items: center;
                justify-content: center; }

  .container { max-width: 860px; margin: 0 auto; padding: 0 16px 40px; }
  .back { display: inline-block; margin: 18px 0 14px; color: #3b82f6;
          text-decoration: none; font-size: 14px; font-weight: 500; }
  .back:hover { text-decoration: underline; }

  .card { background: rgba(255,255,255,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
          border-radius: 14px; padding: 24px; box-shadow: 0 2px 10px rgba(15,23,42,.07);
          margin-bottom: 16px; border: 1px solid rgba(255,255,255,.6); }
  h1 { font-size: 23px; margin-bottom: 12px; line-height: 1.4; display: flex;
       align-items: center; gap: 10px; flex-wrap: wrap; }
  .pin-badge { font-size: 12px; font-weight: 700; color: #b45309; background: #fef3c7;
               padding: 3px 10px; border-radius: 8px; }
  .star-badge { font-size: 12px; font-weight: 700; color: #b45309; background: #fef3c7;
                padding: 3px 10px; border-radius: 8px; }
  .cat-badge { font-size: 12px; font-weight: 600; color: #2563eb; background: #eff6ff;
               padding: 3px 10px; border-radius: 8px; }
  .meta { display: flex; gap: 16px; font-size: 13px; color: #94a3b8;
          padding-bottom: 14px; border-bottom: 1px solid #f1f5f9; margin-bottom: 16px;
          flex-wrap: wrap; align-items: center; }
  .meta .like { cursor: pointer; user-select: none; font-weight: 600; color: #94a3b8; }
  .meta .like.liked { color: #dc2626; }
  .meta .like:hover { color: #dc2626; }
  .meta a.author { color: #2563eb; text-decoration: none; font-weight: 600; }
  .meta a.author:hover { text-decoration: underline; }
  .content { font-size: 15px; line-height: 1.8; color: #374151; white-space: pre-wrap; }
  .mention { color: #2563eb; font-weight: 600; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px; margin-bottom: 16px; }
  .gallery img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px;
                 cursor: zoom-in; border: 1px solid #f1f5f9; transition: .15s; }
  .gallery img:hover { transform: scale(1.02); box-shadow: 0 4px 14px rgba(15,23,42,.15); }
  .actions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { padding: 8px 16px; border: none; border-radius: 9px; cursor: pointer;
         font-size: 14px; font-weight: 600; transition: .15s; }
  .btn-primary { background: linear-gradient(135deg,#3b82f6,#2563eb); color: #fff; }
  .btn-primary:hover { box-shadow: 0 4px 14px rgba(37,99,235,.3); }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-danger:hover { background: #dc2626; }
  .btn-ghost { background: #fff; color: #334155; border: 1px solid #e2e8f0; }
  .btn-ghost:hover { background: #f8fafc; }
  .btn-warn { background: #f59e0b; color: #fff; }
  .btn-warn:hover { background: #d97706; }
  .btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 8px; }

  h2 { font-size: 16px; margin-bottom: 14px; color: #334155; }
  .comment-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .comment-form textarea { padding: 11px 12px; border: 1px solid #e2e8f0; border-radius: 10px;
    font-size: 14px; outline: none; font-family: inherit; resize: vertical; min-height: 80px; }
  .comment-form textarea:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
  .comment-form .row { display: flex; justify-content: flex-end; }

  .comment { padding: 14px 0; border-bottom: 1px solid #f1f5f9; }
  .comment:last-child { border-bottom: none; }
  .comment-head { display: flex; justify-content: space-between; align-items: center;
                  font-size: 13px; color: #64748b; margin-bottom: 6px; }
  .comment-body { font-size: 14px; line-height: 1.6; color: #374151; white-space: pre-wrap; }
  .comment-author { color: #2563eb; font-weight: 600; text-decoration: none; }
  .comment-author:hover { text-decoration: underline; }
  .comment-actions { display: flex; gap: 6px; align-items: center; }
  .comment .like { cursor: pointer; user-select: none; font-size: 13px; font-weight: 600;
                   color: #94a3b8; margin-right: 8px; }
  .comment .like.liked { color: #dc2626; }
  .comment .like:hover { color: #dc2626; }
  .no-comment { text-align: center; color: #94a3b8; padding: 32px 0; font-size: 14px; }
  .login-tip { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }

  /* 编辑弹窗 */
  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5);
             display: none; align-items: center; justify-content: center; z-index: 50;
             padding: 20px; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 600px;
           padding: 26px; box-shadow: 0 24px 70px rgba(15,23,42,.25);
           max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 18px; margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #64748b; margin-bottom: 6px; }
  .field input[type=text], .field textarea, .field select { width: 100%; padding: 11px 12px;
    border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; outline: none;
    font-family: inherit; resize: vertical; background: #fff; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
  .field textarea { min-height: 150px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .upload-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .upload-preview { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .upload-preview .u { position: relative; }
  .upload-preview img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
  .upload-preview .u .rm { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
    background: #dc2626; color: #fff; border-radius: 50%; border: none; cursor: pointer;
    font-size: 12px; line-height: 20px; text-align: center; }
  .hint { font-size: 12px; color: #94a3b8; margin-top: 6px; }

  /* 图片大图查看 */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none;
              align-items: center; justify-content: center; z-index: 80; cursor: zoom-out; }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 6px; }

  #toast { position: fixed; bottom: 24px; left: 50%;
           transform: translateX(-50%) translateY(80px);
           background: #0f172a; color: #fff; padding: 10px 20px; border-radius: 8px;
           font-size: 14px; opacity: 0; transition: .3s; pointer-events: none; z-index: 90; }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.err { background: #dc2626; }
</style>
</head>
<body>

<nav>
  <div class="inner">
    <a href="/" class="brand"><span class="logo">📋</span><b>论坛</b></a>
    <div class="nav-right" id="navRight"></div>
  </div>
</nav>

<div class="container">
  <a href="/" class="back">← 返回列表</a>
  <div id="post"></div>
  <div class="card">
    <h2>评论 <span id="commentCount"></span></h2>
    <div class="comment-form">
      <div id="loginTip"></div>
      <textarea id="c-content" placeholder="说点什么…（可用 @用户名 回复某人）"></textarea>
      <div class="row">
        <button class="btn btn-primary" onclick="submitComment()">发表评论</button>
      </div>
    </div>
    <div id="commentList"></div>
  </div>
</div>

<!-- 编辑弹窗 -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <h2>编辑帖子</h2>
    <div class="field">
      <label>分类</label>
      <select id="e-category">
        <option value="">选择分类（可选）</option>
        <option value="壁纸">🖼 壁纸</option>
        <option value="资源">📦 资源</option>
        <option value="求助">🙋 求助</option>
        <option value="闲聊">💬 闲聊</option>
      </select>
    </div>
    <div class="field">
      <label>标题 *</label>
      <input id="e-title" type="text" maxlength="100" />
    </div>
    <div class="field">
      <label>内容 *</label>
      <textarea id="e-content"></textarea>
    </div>
    <div class="field">
      <label>图片（可选，最多 9 张）</label>
      <div class="upload-row">
        <input type="file" id="e-file" accept="image/*" multiple />
        <span class="hint" id="e-up-hint"></span>
      </div>
      <div class="upload-preview" id="e-up-preview"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeEdit()">取消</button>
      <button class="btn btn-primary" id="saveBtn" onclick="submitEdit()">保存</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')">
  <img id="lightboxImg" src="" alt="" />
</div>

<div id="toast"></div>

<script type="module">
  import { auth, api, escapeHtml, parseImages, renderNav, renderMentions, refreshUnread,
           initAnimatedBackground, initMusicPlayer } from './common.js';

  const postId = new URLSearchParams(location.search).get('id');
  let currentPost = null;
  let editImages = [];

  // 启动动态背景 + 背景音乐
  initAnimatedBackground();
  initMusicPlayer({
    tracks: [
      { name: 'Follow', url: '/music/01.mp3' },
      { name: 'Solaris', url: '/music/02.mp3' },
    ],
  });

  function toast(msg, isErr = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = isErr ? 'show err' : 'show';
    clearTimeout(el._t);
    el._t = setTimeout(() => (el.className = ''), 2400);
  }
  window.toast = toast;

  window.logout = function () { auth.clear(); renderNav(); location.reload(); };

  function openImg(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('show');
  }
  window.openImg = openImg;

  window.likePost = function () {
    if (!auth.isLoggedIn()) { toast('请先登录', true); return; }
    api(`/api/posts/${postId}/like`, { method: 'POST' }).then(data => {
      const el = document.querySelector('.meta .like');
      el.classList.toggle('liked', data.liked);
      el.innerHTML = (data.liked ? '❤️' : '🤍') + ' 赞 ' + data.upvotes;
      refreshUnread();
    }).catch(err => toast(err.message, true));
  };

  window.likeComment = function (id) {
    if (!auth.isLoggedIn()) { toast('请先登录', true); return; }
    api(`/api/posts/${postId}/comments/${id}/like`, { method: 'POST' }).then(data => {
      const el = document.querySelector(`.comment .like[data-id="${id}"]`);
      el.classList.toggle('liked', data.liked);
      el.innerHTML = (data.liked ? '❤️' : '🤍') + ' ' + data.upvotes;
      refreshUnread();
    }).catch(err => toast(err.message, true));
  };

  window.deletePost = async function () {
    if (!confirm('确定删除这篇帖子吗？评论会一并删除。')) return;
    try {
      await api(`/api/posts/${postId}`, { method: 'DELETE' });
      toast('已删除');
      setTimeout(() => (location.href = '/'), 400);
    } catch (e) { toast(e.message, true); }
  };

  window.togglePin = async function () {
    try {
      const data = await api(`/api/posts/${postId}/pin`, { method: 'POST' });
      toast(data.pinned ? '已置顶' : '已取消置顶');
      load();
    } catch (e) { toast(e.message, true); }
  };

  window.toggleFeatured = async function () {
    try {
      const data = await api(`/api/posts/${postId}/feature`, { method: 'POST' });
      toast(data.featured ? '已加入精选' : '已取消精选');
      load();
    } catch (e) { toast(e.message, true); }
  };

  // 编辑
  window.openEdit = function () {
    const p = currentPost;
    if (!p) return;
    document.getElementById('e-title').value = p.title;
    document.getElementById('e-content').value = p.content;
    document.getElementById('e-category').value = p.category || '';
    editImages = parseImages(p.images);
    renderEditPreview();
    document.getElementById('editOverlay').classList.add('show');
  };
  window.closeEdit = function () { document.getElementById('editOverlay').classList.remove('show'); };

  function renderEditPreview() {
    const box = document.getElementById('e-up-preview');
    document.getElementById('e-up-hint').textContent = editImages.length
      ? `已选 ${editImages.length} 张` : '';
    box.innerHTML = editImages.map((u, i) => `
      <div class="u"><img src="${u}" alt=""><button class="rm" onclick="removeEditImage(${i})">×</button></div>
    `).join('');
  }
  window.removeEditImage = function (i) { editImages.splice(i, 1); renderEditPreview(); };

  document.getElementById('e-file').addEventListener('change', async (e) => {
    const files = [...e.target.files];
    if (!files.length) return;
    if (editImages.length + files.length > 9) { toast('最多 9 张', true); e.target.value=''; return; }
    document.getElementById('e-up-hint').textContent = '上传中…';
    for (const f of files) {
      if (!f.type.startsWith('image/')) continue;
      const fd = new FormData();
      fd.append('file', f);
      try {
        const data = await api('/api/posts/upload', { method: 'POST', body: fd });
        editImages.push(data.url);
      } catch (err) { toast(err.message, true); }
    }
    e.target.value = '';
    renderEditPreview();
  });

  window.submitEdit = async function () {
    const payload = {
      title: document.getElementById('e-title').value.trim(),
      content: document.getElementById('e-content').value.trim(),
      category: document.getElementById('e-category').value,
      images: editImages,
    };
    if (!payload.title || !payload.content) return toast('标题和内容必填', true);
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    try {
      await api(`/api/posts/${postId}`, { method: 'PUT', body: JSON.stringify(payload) });
      toast('已保存');
      closeEdit();
      load();
    } catch (e) { toast(e.message, true); }
    btn.disabled = false;
  };

  window.deleteComment = async function (id) {
    if (!confirm('确定删除这条评论吗？')) return;
    try {
      await api(`/api/comments/${id}`, { method: 'DELETE' });
      toast('已删除');
      load();
    } catch (e) { toast(e.message, true); }
  };

  async function load() {
    if (!postId) {
      document.getElementById('post').innerHTML = '<div class="card">无效的帖子 ID</div>';
      return;
    }
    try {
      const p = await api(`/api/posts/${postId}`);
      currentPost = p;
      const imgs = parseImages(p.images);
      const me = auth.getUser();
      const isAdmin = me && me.role === 'admin';
      const canEdit = isAdmin || (me && p.author_id === me.id);
      const gallery = imgs.length ? `
        <div class="gallery">
          ${imgs.map(i => `<img src="${i}" alt="" loading="lazy" onclick="openImg('${i}')" />`).join('')}
        </div>` : '';
      document.getElementById('post').innerHTML = `
        <div class="card">
          <h1>
            ${p.pinned ? '<span class="pin-badge">📌 置顶</span>' : ''}
            ${p.featured ? '<span class="star-badge">⭐ 精选</span>' : ''}
            ${p.category ? `<span class="cat-badge">${escapeHtml(p.category)}</span>` : ''}
            ${escapeHtml(p.title)}
          </h1>
          <div class="meta">
            <span>👤 <a class="author" href="/user.html?id=${p.author_id || ''}">${escapeHtml(p.author_name)}</a></span>
            <span class="like ${p.liked ? 'liked' : ''}" onclick="likePost()">
              ${p.liked ? '❤️' : '🤍'} 赞 ${p.upvotes}
            </span>
            <span>👁 ${p.views}</span>
            <span>💬 ${p.comments.length}</span>
            <span>🕒 ${p.created_at}</span>
            ${p.updated_at !== p.created_at ? `<span class="edited">✏️ 已编辑 ${p.updated_at}</span>` : ''}
          </div>
          ${gallery}
          <div class="content">${renderMentions(p.content)}</div>
          <div class="actions">
            ${canEdit ? `<button class="btn btn-ghost" onclick="openEdit()">✏️ 编辑</button>` : ''}
            ${isAdmin ? `<button class="btn btn-warn" onclick="togglePin()">${p.pinned ? '取消置顶' : '📌 置顶'}</button>` : ''}
            ${isAdmin ? `<button class="btn btn-warn" onclick="toggleFeatured()">${p.featured ? '取消精选' : '⭐ 精选'}</button>` : ''}
            ${canEdit ? `<button class="btn btn-danger" onclick="deletePost()">删除</button>` : ''}
          </div>
        </div>`;
      renderComments(p.comments);
      refreshUnread();
    } catch (e) {
      document.getElementById('post').innerHTML =
        `<div class="card">加载失败：${escapeHtml(e.message)}</div>`;
    }
  }
  window.load = load;

  function renderComments(comments) {
    document.getElementById('commentCount').textContent = `(${comments.length})`;
    const box = document.getElementById('commentList');
    if (!comments.length) {
      box.innerHTML = '<div class="no-comment">还没有评论，来抢沙发 🛋️</div>';
      return;
    }
    const me = auth.getUser();
    const isAdmin = me && me.role === 'admin';
    box.innerHTML = comments.map(c => {
      const canDelete = isAdmin || (me && c.author_id === me.id);
      return `
        <div class="comment">
          <div class="comment-head">
            <span><a class="comment-author" href="/user.html?id=${c.author_id || ''}">${escapeHtml(c.author_name)}</a> · ${c.created_at}</span>
            <div class="comment-actions">
              <span class="like ${c.liked ? 'liked' : ''}" data-id="${c.id}" onclick="likeComment(${c.id})">
                ${c.liked ? '❤️' : '🤍'} ${c.upvotes}
              </span>
              ${canDelete ? `<button class="btn btn-ghost btn-sm" onclick="deleteComment(${c.id})">删除</button>` : ''}
            </div>
          </div>
          <div class="comment-body">${renderMentions(c.content)}</div>
        </div>`;
    }).join('');
  }

  window.submitComment = async function () {
    if (!auth.isLoggedIn()) { toast('请先登录', true); return; }
    const content = document.getElementById('c-content').value.trim();
    if (!content) return toast('评论内容不能为空', true);
    try {
      await api(`/api/posts/${postId}/comments`, {
        method: 'POST', body: JSON.stringify({ content }),
      });
      toast('评论成功');
      document.getElementById('c-content').value = '';
      load();
    } catch (e) { toast(e.message, true); }
  };

  document.getElementById('editOverlay').addEventListener('click', e => {
    if (e.target.id === 'editOverlay') closeEdit();
  });

  renderNav();
  load();
</script>
</body>
</html>
