<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2316324f'/%3E%3Ctext x='50' y='71' font-size='54' text-anchor='middle' fill='%23e8d5a0' font-family='serif'%3E%E6%B5%B7%3C/text%3E%3C/svg%3E">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>个人主页</title>
<link rel="stylesheet" href="user.css?v=20261109">
</head>
<body>

<nav>
  <div class="inner">
    <a href="/forum.html" class="brand"><span class="logo">⌬</span><b>苦海</b></a>
    <div class="nav-right" id="navRight"></div>
  </div>
</nav>

<div class="container">
  <a href="javascript:history.back()" class="back">← 返回</a>
  <div id="profile"></div>
  <div class="card">
    <h2>TA 的帖子</h2>
    <div id="posts"></div>
  </div>
  <div class="card">
    <h2>TA 的评论</h2>
    <div id="comments"></div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { auth, api, escapeHtml, renderNav, initAnimatedBackground, initMusicPlayer } from './common.js?v=20261027';

  const userId = new URLSearchParams(location.search).get('id');

  function toast(msg, isErr = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = isErr ? 'show err' : 'show';
    clearTimeout(el._t);
    el._t = setTimeout(() => (el.className = ''), 2400);
  }
  window.toast = toast;
  window.logout = function () { auth.clear(); renderNav(); location.reload(); };

  async function load() {
    if (!userId) {
      document.getElementById('profile').innerHTML = '<div class="card">无效的用户 ID</div>';
      return;
    }
    try {
      const data = await api(`/api/users/${userId}/profile`);
      const u = data.user;
      const initial = (u.nickname || u.username || '?')[0].toUpperCase();
      document.getElementById('profile').innerHTML = `
        <div class="profile">
          <div class="big-avatar">${escapeHtml(initial)}</div>
          <div class="p-info">
            <h1>${escapeHtml(u.nickname)}
              ${u.role === 'admin' ? '<span class="role-badge">🛡 管理员</span>' : ''}
            </h1>
            <div class="uname">@${escapeHtml(u.username)}</div>
            <div class="joined">加入于 ${u.created_at}</div>
          </div>
          <div class="stats">
            <div><div class="num">${data.stats.posts}</div><div class="lbl">帖子</div></div>
            <div><div class="num">${data.stats.comments}</div><div class="lbl">评论</div></div>
            <div><div class="num">${data.stats.likes}</div><div class="lbl">获赞</div></div>
          </div>
        </div>`;

      const pBox = document.getElementById('posts');
      pBox.innerHTML = data.posts.length ? data.posts.map(p => `
        <div class="row-post" onclick="location.href='/post.html?id=${p.id}'">
          ${p.pinned ? '<span class="pin-badge">📌</span>' : ''}
          <a href="/post.html?id=${p.id}">${escapeHtml(p.title)}</a>
          <div class="sub">
            <span>❤️ ${p.upvotes}</span><span>💬 ${p.comment_count}</span>
            <span>👁 ${p.views}</span><span>${p.created_at}</span>
          </div>
        </div>`).join('')
        : '<div class="empty-tip">还没有发过帖子</div>';

      const cBox = document.getElementById('comments');
      cBox.innerHTML = data.comments.length ? data.comments.map(c => `
        <div class="row-comment">
          <div class="from">评论了 <a href="/post.html?id=${c.post_id}">${escapeHtml(c.post_title)}</a> · ${c.created_at} · ❤️ ${c.upvotes}</div>
          <div>${escapeHtml(c.content.slice(0, 100))}</div>
        </div>`).join('')
        : '<div class="empty-tip">还没有发过评论</div>';
    } catch (e) {
      document.getElementById('profile').innerHTML = `<div class="card">加载失败：${escapeHtml(e.message)}</div>`;
    }
  }

  initAnimatedBackground();
  initMusicPlayer({ tracks: [{ name: 'Follow', url: '/music/01.mp3' }, { name: 'Solaris', url: '/music/02.mp3' }] });
  renderNav();
  load();
</script>
</body>
</html>
