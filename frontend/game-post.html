<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232a1a4a'/%3E%3Ctext x='50' y='71' font-size='54' text-anchor='middle' fill='%23c9a9ff' font-family='sans-serif'%3E%E6%B8%B8%3C/text%3E%3C/svg%3E">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>游戏分享 · 详情</title>
<link rel="stylesheet" href="game-post.css?v=20261110">
</head>
<body>

<nav>
  <div class="inner">
    <a href="/game.html" class="brand"><span class="logo">◈</span><b>娱乐游戏</b></a>
    <div class="nav-right" id="navRight"></div>
  </div>
</nav>

<div class="container" id="main">
  <div id="post"></div>

  <div class="sec-title">💬 评论 <span id="commentCount" style="font-size:13px;color:#94a3b8"></span></div>
  <div class="comment-box">
    <textarea id="c-content" placeholder="说说你的看法…"></textarea>
    <div class="comment-nick" id="c-nick-wrap">
      <input id="c-nick" type="text" placeholder="你的昵称（站内显示）" maxlength="20" />
    </div>
    <div class="hint" id="c-nick-hint" style="display:none;margin-top:8px;color:#8b5cf6"></div>
    <div style="margin-top:10px;display:flex;justify-content:flex-end">
      <button class="btn btn-primary" onclick="submitComment()">发表评论</button>
    </div>
  </div>
  <div id="commentList"></div>
</div>

<!-- 编辑弹窗 -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <h2>编辑游戏分享</h2>
    <div class="field">
      <label>游戏名称 *</label>
      <input id="e-title" type="text" maxlength="100" />
    </div>
    <div class="field">
      <label>游戏介绍 *</label>
      <textarea id="e-content"></textarea>
    </div>
    <div class="field">
      <label>封面 / 截图（最多 9 张）</label>
      <input type="file" id="e-file" accept="image/*" multiple />
      <div class="upload-preview" id="e-up-preview"></div>
      <div class="hint" id="e-up-hint"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeEdit()">取消</button>
      <button class="btn btn-primary" id="saveBtn" onclick="submitEdit()">保存</button>
    </div>
  </div>
</div>

<!-- 登录 / 注册弹窗 -->
<div class="overlay" id="authOverlay">
  <div class="modal">
    <h2 id="authTitle">登录游戏站</h2>
    <div class="field">
      <label>用户名 *</label>
      <input id="a-username" type="text" maxlength="20" autocomplete="off" />
    </div>
    <div class="field">
      <label>密码 *</label>
      <input id="a-password" type="password" maxlength="50" autocomplete="off" />
    </div>
    <div class="field" id="a-nick-field" style="display:none">
      <label>昵称（选填，不填则用用户名）</label>
      <input id="a-nickname" type="text" maxlength="20" />
    </div>
    <p id="a-msg" style="font-size:13px;min-height:16px;margin-bottom:10px"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeAuth()">取消</button>
      <button class="btn btn-primary" id="aBtn" onclick="submitAuth()">确定</button>
    </div>
    <div style="text-align:center;margin-top:12px;font-size:13px" id="a-switch"></div>
  </div>
</div>

<!-- 灯箱 -->
<div id="lightbox"><img id="lightboxImg" alt="" /></div>

<!-- 密码门禁 -->
<div class="gate" id="gate">
  <div class="card">
    <div class="em">🔐</div>
    <h2>进入游戏站</h2>
    <p>请输入访问密码进入（登录账号与苦海论坛通用）</p>
    <p id="gate-hint" style="font-size:13px;color:#94a3b8;margin:0 0 12px;text-align:center"></p>
    <div class="pw-wrap">
      <input id="gate-pw" type="text" placeholder="访问密码" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <button type="button" class="pw-toggle" id="pw-toggle" onclick="togglePw()">👁</button>
    </div>
    <button class="btn btn-primary" onclick="submitGate()">进入</button>
    <div class="err" id="gate-err"></div>
    <a class="back" href="/game.html">← 返回游戏站首页</a>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { auth, gameAuth, gameApi, escapeHtml, parseImages, initAnimatedBackground,
           initMusicPlayer, processImageForUpload, renderMarkdown, GAME_WALLPAPERS, setGateWallpaper } from './common.js?v=20261027';

  const postId = Number(new URLSearchParams(location.search).get('id'));
  let currentPost = null;
  let editImages = [];

  initAnimatedBackground({ images: GAME_WALLPAPERS, interval: 12000 });
  setGateWallpaper('.gate');
  initMusicPlayer({
    tracks: [
      { name: 'Follow', url: '/music/01.mp3' },
      { name: 'Solaris', url: '/music/02.mp3' },
    ],
  });

  function toast(msg, isErr = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = isErr ? 'show err' : 'show';
    clearTimeout(el._t);
    el._t = setTimeout(() => (el.className = ''), 2400);
  }
  window.toast = toast;

  function renderNav() {
    const box = document.getElementById('navRight');
    const u = gameAuth.user();
    if (u) {
      const display = u.nickname || u.username;
      const initial = (display[0] || '?').toUpperCase();
      box.innerHTML = `
        <a class="link" href="/forum.html">⌬ 苦海论坛</a>
        <a class="link" href="/game.html">◈ 游戏站</a>
        <span class="guest-chip"><span class="avatar">${escapeHtml(initial)}</span>${escapeHtml(display)}${u.role === 'admin' ? '<span style="color:#fbbf24;font-size:11px;margin-left:2px" title="游戏站管理员">🛡</span>' : ''}</span>
        <span class="logout" onclick="exitGame()">退出</span>`;
    } else {
      const nick = gameAuth.nickname() || '游客';
      const initial = (nick[0] || '?').toUpperCase();
      box.innerHTML = `
        <a class="link" href="/forum.html">⌬ 苦海论坛</a>
        <a class="link" href="/game.html">◈ 游戏站</a>
        <span class="guest-chip"><span class="avatar">${escapeHtml(initial)}</span>${escapeHtml(nick)}</span>
        <a class="link" href="javascript:void(0)" onclick="openAuth('login')">登录</a>
        <a class="link" href="javascript:void(0)" onclick="openAuth('register')">注册</a>
        <span class="logout" onclick="exitGame()">退出</span>`;
    }
  }
  window.exitGame = function () { gameAuth.clear(); location.href = '/game.html'; };

  // ===== 游戏站登录 / 注册 =====
  let authMode = 'login';
  window.openAuth = function (mode) {
    authMode = mode === 'register' ? 'register' : 'login';
    document.getElementById('authTitle').textContent = authMode === 'login' ? '登录游戏站' : '注册游戏站账号';
    document.getElementById('a-nick-field').style.display = authMode === 'register' ? '' : 'none';
    document.getElementById('a-msg').textContent = '';
    document.getElementById('a-switch').innerHTML = authMode === 'login'
      ? '还没有账号？<a href="javascript:void(0)" onclick="openAuth(\'register\')" style="color:#8b5cf6">去注册</a>'
      : '已有账号？<a href="javascript:void(0)" onclick="openAuth(\'login\')" style="color:#8b5cf6">去登录</a>';
    document.getElementById('authOverlay').classList.add('show');
  };
  window.closeAuth = function () { document.getElementById('authOverlay').classList.remove('show'); };
  window.submitAuth = async function () {
    const username = document.getElementById('a-username').value.trim();
    const password = document.getElementById('a-password').value;
    const nickname = document.getElementById('a-nickname').value.trim();
    const msg = document.getElementById('a-msg');
    msg.style.color = '#dc2626';
    if (!username || !password) { msg.textContent = '请填写用户名和密码'; return; }
    const btn = document.getElementById('aBtn');
    btn.disabled = true;
    try {
      if (authMode === 'register') {
        const r = await gameApi('/api/game/register', { method: 'POST', body: JSON.stringify({ username, password, nickname }) });
        msg.style.color = '#16a34a';
        msg.textContent = r.message;
        openAuth('login');
        document.getElementById('a-username').value = username;
        document.getElementById('a-password').value = '';
      } else {
        const r = await gameApi('/api/game/login', { method: 'POST', body: JSON.stringify({ username, password }) });
        gameAuth.setLogin(r.token, r.user); // 统一登录态（SSO）
        closeAuth();
        renderNav();
        refreshAuthUI();
        toast(`欢迎回来，${r.user.nickname || r.user.username}`);
      }
    } catch (e) { msg.textContent = e.message; }
    btn.disabled = false;
  };

  // 密码门禁
  // 加载门禁提示词（管理员可在后台修改）
  async function loadGateHint() {
    try {
      const r = await gameApi('/api/game/hint');
      const el = document.getElementById('gate-hint');
      if (el && r.hint) el.textContent = r.hint;
    } catch { /* 拉取失败不阻塞进入 */ }
  }
  loadGateHint();

  // 眼睛按钮：切换明文/圆点隐藏（默认明文，确保中文输入法可启动）
  window.togglePw = function () {
    const input = document.getElementById('gate-pw');
    const btn = document.getElementById('pw-toggle');
    input.classList.toggle('hide');
    btn.textContent = input.classList.contains('hide') ? '🙈' : '👁';
  };

  window.submitGate = async function () {
    const err = document.getElementById('gate-err');
    const pw = document.getElementById('gate-pw').value.trim();
    if (!pw) { err.textContent = '请输入访问密码'; return; }
    err.textContent = '';
    try {
      const data = await gameApi('/api/game/enter', { method: 'POST', body: JSON.stringify({ password: pw }) });
      gameAuth.setToken(data.token);
      document.getElementById('gate').style.display = 'none';
      document.getElementById('main').style.display = '';
      renderNav();
      load();
    } catch (e) { err.textContent = e.message; }
  };

  async function ensureEntered() {
    if (!gameAuth.isEntered()) return false;
    try {
      const me = await gameApi('/api/game/me');
      if (me.user) gameAuth.refreshUser(me.user); // 刷新账号信息（昵称/角色可能变更）
    } catch {
      // 网络错误不 clear token，保留本地登录态
    }
    return true;
  }

  if (!gameAuth.isEntered()) {
    document.getElementById('main').style.display = 'none';
    document.getElementById('gate-pw').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitGate();
    });
  } else {
    ensureEntered().then((ok) => {
      if (ok) { document.getElementById('gate').style.display = 'none'; renderNav(); load(); refreshAuthUI(); }
      else document.getElementById('main').style.display = 'none';
    });
  }

  function openImg(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('show');
  }
  window.openImg = openImg;
  document.getElementById('lightbox').addEventListener('click', () =>
    document.getElementById('lightbox').classList.remove('show'));

  // 画廊事件委托（不拼接 onclick URL）
  document.getElementById('post').addEventListener('click', (e) => {
    const img = e.target.closest('.gallery img');
    if (img && img.dataset.full) openImg(img.dataset.full);
  });

  const isAdminUser = () => (auth.isLoggedIn() && auth.getUser()?.role === 'admin') || gameAuth.isAdmin();

  async function load() {
    if (!postId) {
      document.getElementById('post').innerHTML = '<div class="card">无效的帖子 ID</div>';
      return;
    }
    try {
      const p = await gameApi(`/api/game/posts/${postId}?visitorId=${gameAuth.visitorId()}`);
      currentPost = p;
      const imgs = parseImages(p.images);
      const me = isAdminUser();
      const guser = gameAuth.user();
      const isAuthor = (p.author_visitor === gameAuth.visitorId())
                    || (!!guser && p.author_user_id === guser.id);
      const canEdit = me || isAuthor;
      const contentHtml = renderMarkdown(p.content);
      // 正文里已经渲染出来的图不在顶部画廊重复一遍；
      // 手动发帖（正文没写图）时画廊照常兜底，不会丢图。
      const galleryImgs = imgs.filter((u) => !contentHtml.includes(u));
      const gallery = galleryImgs.length ? `
        <div class="gallery">
          ${galleryImgs.map(i => `<img src="${escapeHtml(i)}" alt="" loading="lazy" data-full="${escapeHtml(i)}" />`).join('')}
        </div>` : '';
      document.getElementById('post').innerHTML = `
        <div class="card">
          <h1>
            ${p.pinned ? '<span class="pin-badge">📌 置顶</span> ' : ''}
            ${p.featured ? '<span class="star-badge">⭐ 精选</span> ' : ''}
            ${escapeHtml(p.title)}
          </h1>
          <div class="meta">
            <span class="author-badge">👤 ${escapeHtml(p.author_name)}</span>
            <span class="like ${p.liked ? 'liked' : ''}" onclick="likePost()">
              ${p.liked ? '❤️' : '🤍'} 赞 ${p.upvotes}
            </span>
            <span>👁 ${p.views}</span>
            <span>💬 ${p.comments.length}</span>
            <span>🕒 ${p.created_at}</span>
            ${p.updated_at !== p.created_at ? `<span style="color:#a78bfa">✏️ 已编辑</span>` : ''}
          </div>
          ${gallery}
          <div class="content">${contentHtml}</div>
          <div class="actions">
            ${canEdit ? `<button class="btn btn-ghost" onclick="openEdit()">✏️ 编辑</button>` : ''}
            ${me ? `<button class="btn btn-warn btn-sm" onclick="togglePin()">${p.pinned ? '取消置顶' : '📌 置顶'}</button>` : ''}
            ${me ? `<button class="btn btn-warn btn-sm" onclick="toggleFeatured()">${p.featured ? '取消精选' : '⭐ 精选'}</button>` : ''}
            ${canEdit ? `<button class="btn btn-danger btn-sm" onclick="deletePost()">删除</button>` : ''}
          </div>
        </div>`;
      renderComments(p.comments);
    } catch (e) {
      document.getElementById('post').innerHTML = `<div class="card">加载失败：${escapeHtml(e.message)}</div>`;
    }
  }

  window.likePost = async function () {
    try {
      const data = await gameApi(`/api/game/posts/${postId}/like`, {
        method: 'POST',
        body: JSON.stringify({ visitorId: gameAuth.visitorId() }),
      });
      const el = document.querySelector('.meta .like');
      if (el) {
        el.classList.toggle('liked', data.liked);
        el.innerHTML = (data.liked ? '❤️' : '🤍') + ' 赞 ' + data.upvotes;
      }
    } catch (e) { toast(e.message, true); }
  };

  // ===== 评论 =====
  function renderComments(comments) {
    const me = isAdminUser();
    const guser = gameAuth.user();
    document.getElementById('commentCount').textContent = `(${comments.length})`;
    document.getElementById('commentList').innerHTML = comments.length ? comments.map(c => `
      <div class="comment-row">
        <div class="chead">
          <span class="cname">${escapeHtml(c.author_name)}${c.author_user_id && c.author_user_id === guser?.id ? '（我）' : ''}</span>
          <span class="ctime">${c.created_at}</span>
          <span class="clike ${c.liked ? 'liked' : ''}" onclick="likeComment(${c.id})">${c.liked ? '❤️' : '🤍'} ${c.upvotes}</span>
          ${(me || c.author_visitor === gameAuth.visitorId() || (!!guser && c.author_user_id === guser.id))
            ? `<span class="cdel" onclick="deleteComment(${c.id})">删除</span>` : ''}
        </div>
        <div class="ctext">${escapeHtml(c.content)}</div>
      </div>`).join('')
      : '<div class="comment-row" style="color:#94a3b8;text-align:center">暂无评论，来抢沙发～</div>';
  }

  // 登录后评论区身份提示（未登录保持访客昵称输入）
  function refreshAuthUI() {
    const guser = gameAuth.user();
    const nickInput = document.getElementById('c-nick');
    const nickWrap = document.getElementById('c-nick-wrap');
    if (!nickInput) return;
    if (guser) {
      nickInput.value = '';
      nickInput.disabled = true;
      nickInput.placeholder = `登录账号：${guser.nickname || guser.username}`;
      if (nickWrap) nickWrap.style.display = 'none';
      const hint = document.getElementById('c-nick-hint');
      if (hint) { hint.style.display = ''; hint.textContent = `已登录为 ${guser.nickname || guser.username}，评论自动署名`; }
    } else {
      nickInput.disabled = false;
      nickInput.placeholder = '你的昵称（站内显示）';
      if (nickWrap) nickWrap.style.display = '';
    }
  }

  window.submitComment = async function () {
    const content = document.getElementById('c-content').value.trim();
    if (!content) return toast('评论内容不能为空', true);
    const payload = { content };
    if (!gameAuth.isLoggedIn()) {
      const nickname = document.getElementById('c-nick').value.trim() || gameAuth.nickname();
      if (!nickname) return toast('请填写你的昵称', true);
      gameAuth.setNickname(nickname);
      payload.nickname = nickname;
      payload.visitorId = gameAuth.visitorId();
    }
    try {
      await gameApi(`/api/game/posts/${postId}/comments`, {
        method: 'POST',
        body: JSON.stringify(payload),
      });
      document.getElementById('c-content').value = '';
      toast('评论成功');
      load();
    } catch (e) { toast(e.message, true); }
  };

  window.likeComment = async function (commentId) {
    try {
      await gameApi(`/api/game/posts/${postId}/comments/${commentId}/like`, {
        method: 'POST',
        body: JSON.stringify({ visitorId: gameAuth.visitorId() }),
      });
      load();
    } catch (e) { toast(e.message, true); }
  };

  window.deleteComment = async function (id) {
    if (!confirm('确定删除这条评论吗？')) return;
    try {
      await gameApi(`/api/game/comments/${id}`, {
        method: 'DELETE',
        body: JSON.stringify({ visitorId: gameAuth.visitorId() }),
      });
      toast('已删除');
      load();
    } catch (e) { toast(e.message, true); }
  };

  // ===== 编辑 =====
  window.openEdit = function () {
    const p = currentPost;
    if (!p) return;
    document.getElementById('e-title').value = p.title;
    document.getElementById('e-content').value = p.content;
    editImages = parseImages(p.images);
    renderEditPreview();
    document.getElementById('editOverlay').classList.add('show');
  };
  window.closeEdit = function () { document.getElementById('editOverlay').classList.remove('show'); };

  function renderEditPreview() {
    document.getElementById('e-up-hint').textContent = editImages.length ? `已选 ${editImages.length} 张` : '';
    document.getElementById('e-up-preview').innerHTML = editImages.map((u, i) =>
      `<div class="u"><img src="${escapeHtml(u)}" alt=""><button class="rm" onclick="removeEditImage(${i})">×</button></div>`
    ).join('');
  }
  window.removeEditImage = function (i) { editImages.splice(i, 1); renderEditPreview(); };

  document.getElementById('e-file').addEventListener('change', async (e) => {
    const files = [...e.target.files];
    if (!files.length) return;
    if (editImages.length + files.length > 9) { toast('最多 9 张', true); e.target.value = ''; return; }
    for (const f of files) {
      if (!f.type.startsWith('image/')) continue;
      try {
        const processed = await processImageForUpload(f);
        const fd = new FormData();
        fd.append('file', processed);
        const data = await gameApi('/api/game/posts/upload', { method: 'POST', body: fd });
        editImages.push(data.url);
      } catch (err) { toast(err.message, true); }
    }
    e.target.value = '';
    renderEditPreview();
  });

  window.submitEdit = async function () {
    const payload = {
      title: document.getElementById('e-title').value.trim(),
      content: document.getElementById('e-content').value.trim(),
      visitorId: gameAuth.visitorId(),
      images: editImages,
    };
    if (!payload.title || !payload.content) return toast('标题和内容必填', true);
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    try {
      await gameApi(`/api/game/posts/${postId}`, { method: 'PUT', body: JSON.stringify(payload) });
      toast('已保存');
      closeEdit();
      load();
    } catch (e) { toast(e.message, true); }
    btn.disabled = false;
  };

  window.deletePost = async function () {
    if (!confirm('确定删除该游戏分享吗？')) return;
    try {
      await gameApi(`/api/game/posts/${postId}`, {
        method: 'DELETE',
        body: JSON.stringify({ visitorId: gameAuth.visitorId() }),
      });
      toast('已删除');
      location.href = '/game.html';
    } catch (e) { toast(e.message, true); }
  };

  window.togglePin = async function () {
    try { await gameApi(`/api/game/posts/${postId}/pin`, { method: 'POST' }); load(); }
    catch (e) { toast(e.message, true); }
  };
  window.toggleFeatured = async function () {
    try { await gameApi(`/api/game/posts/${postId}/feature`, { method: 'POST' }); load(); }
    catch (e) { toast(e.message, true); }
  };

  document.getElementById('editOverlay').addEventListener('click', e => {
    if (e.target.id === 'editOverlay') closeEdit();
  });
  document.getElementById('authOverlay').addEventListener('click', e => {
    if (e.target.id === 'authOverlay') closeAuth();
  });
</script>
</body>
</html>
