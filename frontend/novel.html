<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苦海书院</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  color: #fff;
}
.container { max-width: 900px; margin: 0 auto; padding: 20px; }

.header { text-align: center; padding: 30px 0; }
.header h1 { font-size: 28px; margin-bottom: 8px; }
.header p { color: #94a3b8; font-size: 14px; }

.back-link { display: inline-block; margin-bottom: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; }
.back-link:hover { color: #fff; }

/* 搜索框 */
.search-box { display: flex; gap: 12px; margin-bottom: 24px; }
.search-box input {
  flex: 1; padding: 14px 20px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.05); color: #fff; font-size: 15px; outline: none;
}
.search-box input:focus { border-color: #667eea; }
.search-box button {
  padding: 14px 28px; border-radius: 12px; border: none;
  background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; font-size: 15px; cursor: pointer;
}

/* 搜索结果 */
.book-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
.book-card {
  background: rgba(255,255,255,.05); border-radius: 12px; padding: 12px;
  cursor: pointer; transition: transform .2s; border: 1px solid rgba(255,255,255,.1);
}
.book-card:hover { transform: translateY(-3px); background: rgba(255,255,255,.08); }
.book-cover {
  width: 100%; height: 200px; border-radius: 8px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex; align-items: center; justify-content: center; font-size: 48px;
  margin-bottom: 10px;
}
.book-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.book-author { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
.book-cat { font-size: 11px; color: #64748b; }

/* 章节列表 */
.chapter-list { max-width: 700px; margin: 0 auto; }
.chapter-item {
  display: block; padding: 14px 16px; margin-bottom: 6px;
  background: rgba(255,255,255,.05); border-radius: 10px;
  text-decoration: none; color: #e2e8f0; font-size: 14px;
  transition: background .2s;
}
.chapter-item:hover { background: rgba(255,255,255,.1); }

/* 阅读页 */
.reader { max-width: 700px; margin: 0 auto; }
.reader-title { font-size: 20px; font-weight: 600; margin-bottom: 20px; text-align: center; }
.reader-content {
  font-size: 16px; line-height: 1.9; color: #cbd5e1;
  white-space: pre-wrap;
}
.reader-nav { display: flex; justify-content: space-between; margin-top: 30px; }
.reader-nav button {
  padding: 10px 20px; border-radius: 10px; border: none;
  background: rgba(255,255,255,.1); color: #fff; cursor: pointer;
}
.reader-nav button:hover { background: rgba(255,255,255,.2); }

.empty { text-align: center; color: #64748b; padding: 40px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="container">
  <a href="/forum.html" class="back-link">← 返回论坛</a>

  <div class="header">
    <h1>📚 苦海书院</h1>
    <p>在线小说阅读 —— 搜索你喜欢的小说</p>
  </div>

  <!-- 搜索框 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="输入小说名或作者..." />
    <button onclick="searchNovel()">搜索</button>
  </div>

  <!-- GitHub 开源书库 -->
  <div style="margin-bottom:24px;padding:16px;background:rgba(255,255,255,.05);border-radius:12px;border:1px solid rgba(255,255,255,.1)">
    <h3 style="margin-bottom:12px;font-size:16px;color:#e2e8f0">📚 GitHub 开源书库</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px">
      <a href="https://github.com/freeok/so-novel" target="_blank" style="padding:12px;background:rgba(255,255,255,.08);border-radius:8px;text-decoration:none;color:#e2e8f0;font-size:13px">
        <div style="font-weight:600;margin-bottom:4px">📖 So Novel</div>
        <div style="color:#94a3b8;font-size:11px">自动采集小说下载工具</div>
      </a>
      <a href="https://github.com/topics/novel-download" target="_blank" style="padding:12px;background:rgba(255,255,255,.08);border-radius:8px;text-decoration:none;color:#e2e8f0;font-size:13px">
        <div style="font-weight:600;margin-bottom:4px">🔍 小说下载合集</div>
        <div style="color:#94a3b8;font-size:11px">GitHub Topic 热门仓库</div>
      </a>
      <a href="https://github.com/topics/ebook-library" target="_blank" style="padding:12px;background:rgba(255,255,255,.08);border-radius:8px;text-decoration:none;color:#e2e8f0;font-size:13px">
        <div style="font-weight:600;margin-bottom:4px">📚 电子书库</div>
        <div style="color:#94a3b8;font-size:11px">开源电子书合集</div>
      </a>
    </div>
  </div>

  <!-- 热门推荐 -->
  <div id="hotRecommend" style="margin-bottom:24px">
    <h3 style="margin-bottom:12px;font-size:16px;color:#e2e8f0">🔥 热门推荐</h3>
    <div class="book-list" id="hotList">
      <div class="book-card" onclick="searchNovel('诡秘之主')">
        <div class="book-cover">🕵️</div>
        <div class="book-title">诡秘之主</div>
        <div class="book-author">爱潜水的乌贼</div>
        <div class="book-cat">玄幻 · 克苏鲁</div>
      </div>
      <div class="book-card" onclick="searchNovel('道诡异仙')">
        <div class="book-cover">🚂</div>
        <div class="book-title">道诡异仙</div>
        <div class="book-author">狐尾的笔</div>
        <div class="book-cat">玄幻 · 诡异</div>
      </div>
      <div class="book-card" onclick="searchNovel('凡人修仙传')">
        <div class="book-cover">⚔️</div>
        <div class="book-title">凡人修仙传</div>
        <div class="book-author">忘语</div>
        <div class="book-cat">仙侠 · 修仙</div>
      </div>
      <div class="book-card" onclick="searchNovel('斗罗大陆')">
        <div class="book-cover">🐉</div>
        <div class="book-title">斗罗大陆</div>
        <div class="book-author">唐家三少</div>
        <div class="book-cat">玄幻 · 异世</div>
      </div>
      <div class="book-card" onclick="searchNovel('斗破苍穹')">
        <div class="book-cover">🔥</div>
        <div class="book-title">斗破苍穹</div>
        <div class="book-author">天蚕土豆</div>
        <div class="book-cat">玄幻 · 异世</div>
      </div>
      <div class="book-card" onclick="searchNovel('全职高手')">
        <div class="book-cover">🎮</div>
        <div class="book-title">全职高手</div>
        <div class="book-author">蝴蝶蓝</div>
        <div class="book-cat">游戏 · 电竞</div>
      </div>
    </div>
  </div>

  <!-- 搜索结果 -->
  <div id="searchResult" style="display:none">
    <h3 style="margin-bottom:12px;font-size:16px;color:#e2e8f0">🔍 搜索结果</h3>
    <div id="searchBooks"></div>
  </div>

  <!-- 章节列表 -->
  <div id="chapterList" style="display:none">
    <button onclick="showSearch()" style="background:none;border:none;color:#94a3b8;cursor:pointer;margin-bottom:16px">← 返回搜索</button>
    <h2 id="bookTitle" style="margin-bottom:16px"></h2>
    <div class="chapter-list" id="chapters"></div>
  </div>

  <!-- 阅读页 -->
  <div id="reader" style="display:none">
    <button onclick="showChapters()" style="background:none;border:none;color:#94a3b8;cursor:pointer;margin-bottom:16px">← 返回目录</button>
    <div class="reader-title" id="readerTitle"></div>
    <div class="reader-content" id="readerContent">加载中...</div>
    <div class="reader-nav">
      <button onclick="prevChapter()">上一章</button>
      <button onclick="nextChapter()">下一章</button>
    </div>
  </div>
</div>

<script type="module">
// 导入工具函数
import { resolveBaseUrl } from '/common.js';

// 当前阅读状态
let currentChapters = []; // 当前书籍的章节列表
let currentChapterIndex = 0; // 当前阅读的章节索引
let hotBooks = []; // 热门推荐书籍

console.log('[小说模块] 初始化完成');

// 页面加载时自动加载热门推荐
// loadHotRecommend(); // 暂时注释掉，用写死的热门推荐

/**
 * 加载热门推荐
 */
async function loadHotRecommend() {
  console.log('[小说模块] 加载热门推荐...');
  const list = document.getElementById('hotList');
  try {
    const resp = await fetch(`${resolveBaseUrl()}/api/novel/search?keyword=${encodeURIComponent('斗破苍穹')}`);
    const data = await resp.json();
    console.log('[小说模块] 热门推荐返回:', data);
    if (!data.books?.length) {
      list.innerHTML = '<div class="empty">暂无推荐小说</div>';
      return;
    }
    hotBooks = data.books;
    list.innerHTML = data.books.slice(0, 8).map((b, i) => `
      <div class="book-card" onclick="openBook(${i})">
        <div class="book-cover">📖</div>
        <div class="book-title">${escapeHtml(b.title)}</div>
        <div style="font-size:11px;color:#94a3b8;margin-top:4px">${escapeHtml(b.author)}</div>
      </div>
    `).join('');
  } catch (e) {
    console.error('[小说模块] 热门推荐加载失败:', e);
    list.innerHTML = `<div class="empty">加载失败：${e.message}</div>`;
  }
}

/**
 * 打开书籍（从热门推荐）
 * @param {number} i - 书籍索引
 */
window.openBook = function(i) {
  console.log('[小说模块] 打开热门书籍，索引:', i);
  try {
    const b = hotBooks[i];
    if (!b) throw new Error('没找到书籍数据');
    document.getElementById('hotRecommend').style.display = 'none';
    document.getElementById('searchResult').style.display = 'none';
    loadChapters(b.id);
  } catch (e) {
    console.error('[小说模块] 打开书籍失败:', e);
    alert('打开失败：' + e.message);
  }
};

/**
 * 搜索小说
 * @param {string} keyword - 搜索关键词（可选，不传则从输入框读取）
 */
window.searchNovel = async function(keyword) {
  const kw = keyword || document.getElementById('searchInput').value.trim();
  console.log('[小说模块] 搜索小说，关键词:', kw);
  
  if (!kw) {
    console.log('[小说模块] 关键词为空，退出搜索');
    return;
  }
  
  document.getElementById('searchInput').value = kw;
  document.getElementById('chapterList').style.display = 'none';
  document.getElementById('reader').style.display = 'none';
  document.getElementById('searchResult').innerHTML = '<div class="empty">搜索中...</div>';
  
  try {
    // 直接调用 Open Library API
    const resp = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(kw)}&limit=10`);
    const data = await resp.json();
    console.log('[小说模块] 搜索返回:', data);
    
    const books = (data?.docs || []).map(b => ({
      id: b.key || Math.random().toString(36).slice(2),
      title: b.title || '未知书名',
      author: b.author_name?.[0] || '未知作者',
      cover: b.cover_i ? `https://covers.openlibrary.org/b/id/${b.cover_i}-M.jpg` : '',
      category: b.subject?.[0] || '',
      status: '已出版',
    }));
    
    if (!books.length) {
      document.getElementById('searchResult').innerHTML = '<div class="empty">没找到相关小说</div>';
      return;
    }
    
    document.getElementById('searchResult').innerHTML = '<div class="book-list">' + books.map((b, i) => `
      <div class="book-card" onclick="alert('详情功能开发中')">
        <div class="book-cover">📖</div>
        <div class="book-title">${b.title}</div>
        <div class="book-author">${b.author}</div>
        <div class="book-cat">${b.category} · ${b.status}</div>
      </div>
    `).join('') + '</div>';
    window._searchBooks = books;
  } catch (e) {
    console.error('[小说模块] 搜索失败:', e);
    document.getElementById('searchResult').innerHTML = `<div class="empty">搜索失败：${e.message}</div>`;
  }
};

/**
 * 显示章节列表
 * @param {string} bookId - 书籍ID
 * @param {string} bookTitle - 书籍标题
 */
window.showChaptersList = async function(bookId, bookTitle) {
  console.log('[小说模块] 显示章节列表，书籍:', bookTitle);
  document.getElementById('searchResult').style.display = 'none';
  document.getElementById('reader').style.display = 'none';
  document.getElementById('chapterList').style.display = '';
  document.getElementById('bookTitle').textContent = bookTitle;
  document.getElementById('chapters').innerHTML = '<div class="empty">加载章节中...</div>';
  
  try {
    const resp = await fetch(`${resolveBaseUrl()}/api/novel/chapters?id=${bookId}`);
    const data = await resp.json();
    console.log('[小说模块] 章节返回:', data);
    
    currentChapters = data.chapters || [];
    if (!currentChapters.length) {
      document.getElementById('chapters').innerHTML = '<div class="empty">暂无章节</div>';
      return;
    }
    
    document.getElementById('chapters').innerHTML = currentChapters.map((ch, i) =>
      `<a class="chapter-item" onclick="readChapter(${i})">第${i+1}章 ${ch.title}</a>`
    ).join('');
  } catch (e) {
    console.error('[小说模块] 加载章节失败:', e);
    document.getElementById('chapters').innerHTML = `<div class="empty">加载失败：${e.message}</div>`;
  }
};

/**
 * 阅读章节
 * @param {number} index - 章节索引
 */
window.readChapter = async function(index) {
  console.log('[小说模块] 阅读章节，索引:', index);
  try {
    currentChapterIndex = index;
    document.getElementById('chapterList').style.display = 'none';
    document.getElementById('reader').style.display = '';
    
    const ch = currentChapters[index];
    if (!ch) throw new Error('没找到章节数据');
    
    document.getElementById('readerTitle').textContent = ch.title;
    document.getElementById('readerContent').textContent = '加载中...';
    
    const resp = await fetch(`${resolveBaseUrl()}/api/novel/content?link=${encodeURIComponent(ch.link)}`);
    const data = await resp.json();
    console.log('[小说模块] 章节内容返回:', data);
    
    document.getElementById('readerContent').textContent = data.content || '暂无内容';
  } catch (e) {
    console.error('[小说模块] 阅读章节失败:', e);
    document.getElementById('readerContent').textContent = `加载失败：${e.message}`;
  }
};

/**
 * 上一章
 */
window.prevChapter = function() {
  console.log('[小说模块] 点击上一章');
  if (currentChapterIndex > 0) readChapter(currentChapterIndex - 1);
};

/**
 * 下一章
 */
window.nextChapter = function() {
  console.log('[小说模块] 点击下一章');
  if (currentChapterIndex < currentChapters.length - 1) readChapter(currentChapterIndex + 1);
};

/**
 * 显示搜索结果
 */
window.showSearch = function() {
  console.log('[小说模块] 显示搜索');
  document.getElementById('chapterList').style.display = 'none';
  document.getElementById('searchResult').style.display = '';
};

/**
 * 显示章节列表
 */
window.showChapters = function() {
  console.log('[小说模块] 显示章节列表');
  document.getElementById('reader').style.display = 'none';
  document.getElementById('chapterList').style.display = '';
};

// 回车搜索
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    console.log('[小说模块] 按回车搜索');
    searchNovel();
  }
});
</script>
</body>
</html>
