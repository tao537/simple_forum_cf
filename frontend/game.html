<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>娱乐游戏 · 二次元游戏分享站</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --g: #8b5cf6; --g2: #7c3aed; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         color: #1f2937; min-height: 100vh; }
  nav { background: rgba(23,16,50,.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 1px 3px rgba(15,23,42,.15); position: sticky; top: 0; z-index: 30; }
  nav .inner { max-width: 1080px; margin: 0 auto; padding: 12px 16px;
               display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #f5f3ff; }
  .brand .logo { width: 34px; height: 34px; border-radius: 10px; font-size: 18px;
                 display: flex; align-items: center; justify-content: center;
                 background: linear-gradient(135deg,#8b5cf6,#7c3aed); color: #fff; }
  .brand b { font-size: 18px; }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .link { color: #c4b5fd; text-decoration: none; font-size: 14px; font-weight: 500; }
  .link:hover { text-decoration: underline; color: #ddd6fe; }
  .guest-chip { display: flex; align-items: center; gap: 8px; font-size: 13px;
                color: #e9d5ff; background: rgba(139,92,246,.18); padding: 5px 12px;
                border-radius: 999px; }
  .guest-chip .avatar { width: 24px; height: 24px; border-radius: 50%;
                        background: #8b5cf6; color: #fff; font-size: 12px;
                        display: flex; align-items: center; justify-content: center; }
  .logout { color: #a78bfa; font-size: 13px; cursor: pointer; }
  .logout:hover { color: #ef4444; }

  .container { max-width: 1080px; margin: 0 auto; padding: 0 16px 48px; }

  /* Hero */
  .hero { position: relative; border-radius: 20px; overflow: hidden; margin-top: 18px;
          padding: 40px 34px; color: #fff;
          background: linear-gradient(120deg, #4c1d95 0%, #6d28d9 45%, #7c3aed 100%);
          box-shadow: 0 14px 40px rgba(124,58,237,.35); }
  .hero::after { content: '🎮'; position: absolute; right: 26px; bottom: -30px;
                 font-size: 170px; opacity: .18; }
  .hero h1 { font-size: 28px; margin-bottom: 8px; }
  .hero p { font-size: 14px; opacity: .92; margin-bottom: 20px; }
  .hero .btn { position: relative; z-index: 2; }

  /* 工具栏 */
  .toolbar { display: flex; align-items: center; gap: 10px; margin: 22px 0 18px; flex-wrap: wrap; }
  .tabs { display: flex; background: rgba(255,255,255,.85); border-radius: 10px; padding: 4px;
          box-shadow: 0 1px 3px rgba(15,23,42,.05); }
  .tabs button { border: none; background: transparent; padding: 8px 16px; cursor: pointer;
                 border-radius: 8px; font-size: 14px; font-weight: 600; color: #64748b; transition: .15s; }
  .tabs button.active { background: #f3e8ff; color: #7c3aed; }
  .searchbox { display: flex; flex: 1; min-width: 200px; gap: 8px; position: relative; }
  .searchbox .search-wrap { position: relative; flex: 1; min-width: 0; }
  .searchbox input { width: 100%; padding: 10px 34px 10px 14px; border: 1px solid rgba(226,232,240,.8);
                     border-radius: 10px; font-size: 14px; outline: none; background: rgba(255,255,255,.9); box-sizing: border-box; }
  .searchbox input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,.15); }
  .search-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
                  border: none; background: none; color: #94a3b8; font-size: 14px; cursor: pointer; padding: 2px 4px; display: none; }
  .search-clear:hover { color: #475569; }
  /* 联想/历史/热词下拉 */
  .suggest { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 50;
             background: rgba(255,255,255,.97); border: 1px solid #e2e8f0; border-radius: 12px;
             box-shadow: 0 12px 32px rgba(15,23,42,.16); padding: 10px 8px; max-height: 340px; overflow-y: auto; }
  .suggest-sec { margin-bottom: 8px; }
  .suggest-sec:last-child { margin-bottom: 0; }
  .suggest-title { font-size: 12px; font-weight: 700; color: #94a3b8; padding: 4px 10px 6px; display: flex;
                   justify-content: space-between; align-items: center; }
  .suggest-title .s-clear { color: #94a3b8; cursor: pointer; font-weight: 500; font-size: 12px; }
  .suggest-title .s-clear:hover { color: #dc2626; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; margin: 3px;
          border-radius: 20px; font-size: 13px; cursor: pointer; transition: .12s;
          border: 1px solid #e2e8f0; background: #f8fafc; color: #334155; }
  .chip:hover { background: #f3e8ff; border-color: #c4b5fd; color: #7c3aed; }
  .chip .x { color: #cbd5e1; font-size: 12px; }
  .chip .x:hover { color: #dc2626; }
  .suggest-list .item { display: block; width: 100%; text-align: left; padding: 8px 12px; border: none;
                        background: none; border-radius: 8px; font-size: 14px; color: #334155; cursor: pointer; }
  .suggest-list .item:hover { background: #f5f3ff; color: #7c3aed; }
  .suggest-empty { font-size: 13px; color: #94a3b8; padding: 6px 12px; }
  mark { background: #fef08a; color: inherit; padding: 0 1px; border-radius: 2px; }

  .btn { padding: 9px 16px; border: none; border-radius: 10px; cursor: pointer;
         font-size: 14px; font-weight: 600; transition: .15s; white-space: nowrap; }
  .btn-primary { background: linear-gradient(135deg,#8b5cf6,#7c3aed); color: #fff; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(124,58,237,.4); }
  .btn-ghost { background: rgba(255,255,255,.9); color: #334155; border: 1px solid #e2e8f0; }
  .btn-ghost:hover { background: #f8fafc; }
  .btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 8px; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-danger:hover { background: #dc2626; }

  /* 游戏卡片网格 */
  .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .game-card { background: rgba(255,255,255,.92); border-radius: 16px; overflow: hidden;
               cursor: pointer; border: 1px solid rgba(255,255,255,.6);
               box-shadow: 0 2px 10px rgba(15,23,42,.08); transition: .2s; }
  .game-card:hover { transform: translateY(-4px); box-shadow: 0 14px 32px rgba(124,58,237,.22); }
  .cover { position: relative; aspect-ratio: 3/4; background: linear-gradient(135deg,#7c3aed,#a855f7);
           overflow: hidden; }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .cover .ph { position: absolute; inset: 0; display: flex; align-items: center;
               justify-content: center; font-size: 56px; opacity: .5; }
  .cover .tag { position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 700;
                padding: 3px 9px; border-radius: 999px; background: rgba(15,23,42,.6);
                color: #fff; backdrop-filter: blur(4px); }
  .gbody { padding: 12px 14px 14px; }
  .gbody h3 { font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 8px;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gbody .gauthor { font-size: 12px; color: #a78bfa; margin-bottom: 6px; }
  .gmeta { display: flex; gap: 12px; font-size: 12px; color: #94a3b8; }
  .gmeta span { display: inline-flex; align-items: center; gap: 3px; }

  .empty { text-align: center; padding: 70px 20px; color: #94a3b8;
           background: rgba(255,255,255,.85); border-radius: 16px; grid-column: 1 / -1; }
  .pager { display: flex; justify-content: space-between; align-items: center;
           margin-top: 22px; font-size: 14px; color: #64748b; }
  .pager .pages { display: flex; gap: 6px; align-items: center; }

  /* 发帖弹窗 */
  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: none;
             align-items: center; justify-content: center; z-index: 50; padding: 20px; backdrop-filter: blur(4px); }
  .overlay.show { display: flex; }
  .modal { background: rgba(255,255,255,.98); border-radius: 16px; width: 100%; max-width: 600px;
           padding: 26px; box-shadow: 0 24px 70px rgba(15,23,42,.3);
           max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 18px; margin-bottom: 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #64748b; margin-bottom: 6px; }
  .field input[type=text], .field textarea { width: 100%; padding: 11px 12px;
    border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; outline: none;
    font-family: inherit; resize: vertical; background: #fff; }
  .field input:focus, .field textarea:focus { border-color: #8b5cf6;
    box-shadow: 0 0 0 3px rgba(139,92,246,.12); }
  .field textarea { min-height: 140px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .upload-preview { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .upload-preview .u { position: relative; }
  .upload-preview img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
  .upload-preview .u .rm { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
    background: #dc2626; color: #fff; border-radius: 50%; border: none; cursor: pointer;
    font-size: 12px; line-height: 20px; text-align: center; }
  .hint { font-size: 12px; color: #94a3b8; margin-top: 6px; }

  /* 密码门禁层 */
  .gate { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center;
          justify-content: center; padding: 20px;
          background: radial-gradient(ellipse at 50% 30%, rgba(109,40,217,.75), rgba(15,10,35,.97)),
                      url('/wallpapers/game-anime.jpg') center / cover; }
  .gate .card { width: 100%; max-width: 380px; background: rgba(255,255,255,.94);
                border-radius: 20px; padding: 32px 28px; text-align: center;
                box-shadow: 0 24px 70px rgba(0,0,0,.45); }
  .gate .em { font-size: 44px; }
  .gate h2 { font-size: 20px; margin: 12px 0 6px; color: #312e81; }
  .gate p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
  .gate input { width: 100%; padding: 12px 14px; border: 1px solid #ddd6fe; border-radius: 12px;
                font-size: 15px; text-align: center; outline: none; letter-spacing: 2px; }
  /* 密码框默认明文（保证中文输入法可启动）；点眼睛后才圆点隐藏 */
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 46px; }
  .pw-toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
               background: none; border: none; font-size: 17px; cursor: pointer; padding: 4px; line-height: 1; }
  #gate-pw.hide { -webkit-text-security: disc; }
  .gate input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,.15); }
  .gate .btn { width: 100%; margin-top: 14px; padding: 12px; font-size: 15px; }
  .gate .err { color: #dc2626; font-size: 13px; min-height: 18px; margin-top: 10px; }
  .gate .back { display: inline-block; margin-top: 14px; color: #a78bfa; font-size: 13px;
                text-decoration: none; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
           background: #0f172a; color: #fff; padding: 10px 20px; border-radius: 8px;
           font-size: 14px; opacity: 0; transition: .3s; pointer-events: none; z-index: 60; }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.err { background: #dc2626; }

  /* ============ 手机端优化 ============ */
  @media (max-width: 640px) {
    nav .inner { padding: 10px 12px; gap: 6px; }
    .brand b { font-size: 16px; }
    .brand .logo { width: 30px; height: 30px; font-size: 16px; }
    .nav-right { gap: 6px; }
    .link { font-size: 13px; }
    .guest-chip { font-size: 12px; padding: 4px 9px; max-width: 130px; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
    .container { padding: 0 12px 40px; }
    .hero { padding: 26px 18px; margin-top: 12px; border-radius: 16px; }
    .hero h1 { font-size: 22px; }
    .hero p { font-size: 13px; margin-bottom: 14px; }
    .hero::after { font-size: 110px; right: 10px; bottom: -20px; }
    /* 工具栏：tabs 占满一行，搜索框独立一行，发帖按钮全宽 */
    .toolbar { flex-direction: column; align-items: stretch; gap: 8px; margin: 16px 0 14px; }
    .toolbar .tabs { display: flex; gap: 4px; }
    .toolbar .tabs button { flex: 1; padding: 9px 0; text-align: center; }
    .searchbox { min-width: 0; width: 100%; }
    .searchbox .search-wrap { flex: 1; }
    .toolbar > .btn-primary { width: 100%; }
    /* 卡片墙：手机双列紧凑 */
    .game-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    /* 发帖弹窗 */
    .modal { max-width: 100%; margin: 0 12px; padding: 18px 16px; max-height: 88vh; overflow-y: auto; }
    .modal .row { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<nav>
  <div class="inner">
    <a href="/game.html" class="brand"><span class="logo">◈</span><b>娱乐游戏</b></a>
    <div class="nav-right" id="navRight"></div>
  </div>
</nav>

<div class="container" id="main">
  <div class="hero">
    <h1>发现与分享好游戏</h1>
    <p>二次元游戏分享站 —— 把你喜欢的游戏、封面截图和资源分享给大家</p>
    <button class="btn btn-primary" onclick="openShare()">🎮 分享游戏</button>
  </div>

  <div class="toolbar">
    <div class="tabs">
      <button id="tab-new" class="active" onclick="setSort('new')">最新</button>
      <button id="tab-hot" onclick="setSort('hot')">🔥 热门</button>
      <button id="tab-top" onclick="setSort('top')">👍 最赞</button>
    </div>
    <div class="searchbox">
      <div class="search-wrap">
        <input id="kw" type="text" placeholder="搜索游戏名称或介绍…" autocomplete="off" />
        <button class="search-clear" id="kwClear" onclick="clearKw(event)" title="清除">✕</button>
        <div class="suggest" id="suggest" style="display:none">
          <div class="suggest-sec" id="sec-history" style="display:none">
            <div class="suggest-title">🕘 搜索历史 <span class="s-clear" onclick="clearHistory(event)">清空</span></div>
            <div id="suggest-history"></div>
          </div>
          <div class="suggest-sec" id="sec-hot" style="display:none">
            <div class="suggest-title">🔥 热门搜索</div>
            <div id="suggest-hot"></div>
          </div>
          <div class="suggest-sec" id="sec-list" style="display:none">
            <div class="suggest-title">💡 联想</div>
            <div class="suggest-list" id="suggest-list"></div>
          </div>
        </div>
      </div>
      <button class="btn btn-ghost" onclick="load(1)">搜索</button>
    </div>
    <button class="btn btn-primary" onclick="openShare()">分享游戏</button>
  </div>

  <div class="game-grid" id="grid"></div>

  <div class="pager" id="pager" style="display:none">
    <span id="pagerInfo"></span>
    <div class="pages">
      <button class="btn btn-ghost btn-sm" onclick="load(state.page-1)">上一页</button>
      <span id="pageNow"></span>
      <button class="btn btn-ghost btn-sm" onclick="load(state.page+1)">下一页</button>
    </div>
  </div>
</div>

<!-- 分享游戏弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>分享游戏</h2>
    <div class="field">
      <label id="f-nick-label">你的昵称 *（游戏站内显示，不涉及苦海账号）</label>
      <input id="f-nick" type="text" placeholder="例如：肝帝小明" maxlength="20" />
    </div>
    <div class="field">
      <label>游戏名称 *</label>
      <input id="f-title" type="text" placeholder="游戏的名字" maxlength="100" />
    </div>
    <div class="field">
      <label>游戏介绍 *</label>
      <textarea id="f-content" placeholder="游戏玩法、亮点、配置要求、资源/下载方式等"></textarea>
    </div>
    <div class="field">
      <label>封面 / 截图（可选，最多 9 张，第一张作为封面）</label>
      <input type="file" id="f-file" accept="image/*" multiple />
      <div class="upload-preview" id="up-preview"></div>
      <div class="hint" id="up-hint"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="pubBtn" onclick="submitGame()">发布</button>
    </div>
  </div>
</div>

<!-- 登录 / 注册弹窗 -->
<div class="overlay" id="authOverlay">
  <div class="modal">
    <h2 id="authTitle">登录游戏站</h2>
    <div class="field">
      <label>用户名 *</label>
      <input id="a-username" type="text" maxlength="20" autocomplete="off" />
    </div>
    <div class="field">
      <label>密码 *</label>
      <input id="a-password" type="password" maxlength="50" autocomplete="off" />
    </div>
    <div class="field" id="a-nick-field" style="display:none">
      <label>昵称（选填，不填则用用户名）</label>
      <input id="a-nickname" type="text" maxlength="20" />
    </div>
    <p id="a-msg" style="font-size:13px;min-height:16px;margin-bottom:10px"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeAuth()">取消</button>
      <button class="btn btn-primary" id="aBtn" onclick="submitAuth()">确定</button>
    </div>
    <div style="text-align:center;margin-top:12px;font-size:13px" id="a-switch"></div>
  </div>
</div>

<!-- 统一访问密码门禁 -->
<div class="gate" id="gate">
  <div class="card">
    <div class="em">🔐</div>
    <h2>进入游戏站</h2>
    <p>本站为独立游戏分享社区<br/>请输入访问密码进入（与苦海论坛账号互不相通）</p>
    <div class="pw-wrap">
      <input id="gate-pw" type="text" placeholder="访问密码" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <button type="button" class="pw-toggle" id="pw-toggle" onclick="togglePw()">👁</button>
    </div>
    <button class="btn btn-primary" id="gate-btn" onclick="submitGate()">进入</button>
    <div class="err" id="gate-err"></div>
    <a class="back" href="/forum.html">← 返回苦海论坛</a>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { gameAuth, gameApi, escapeHtml, parseImages, initAnimatedBackground,
           initMusicPlayer, processImageForUpload } from './common.js';

  const API = '/api/game/posts';
  const state = { page: 1, size: 12, total: 0, sort: 'new', keyword: '' };
  let pendingImages = [];

  initAnimatedBackground({ images: ['/wallpapers/game-anime.jpg'] });
  initMusicPlayer({
    tracks: [
      { name: 'Follow', url: '/music/01.mp3' },
      { name: 'Solaris', url: '/music/02.mp3' },
    ],
  });

  function toast(msg, isErr = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = isErr ? 'show err' : 'show';
    clearTimeout(el._t);
    el._t = setTimeout(() => (el.className = ''), 2400);
  }
  window.toast = toast;

  function renderNav() {
    const box = document.getElementById('navRight');
    const u = gameAuth.user();
    if (u) {
      const display = u.nickname || u.username;
      const initial = (display[0] || '?').toUpperCase();
      box.innerHTML = `
        <a class="link" href="/forum.html">⌬ 苦海论坛</a>
        <span class="guest-chip"><span class="avatar">${escapeHtml(initial)}</span>${escapeHtml(display)}${u.role === 'admin' ? '<span style="color:#fbbf24;font-size:11px;margin-left:2px" title="游戏站管理员">🛡</span>' : ''}</span>
        <span class="logout" onclick="exitGame()">退出</span>`;
    } else {
      const nick = gameAuth.nickname() || '游客';
      const initial = (nick[0] || '?').toUpperCase();
      box.innerHTML = `
        <a class="link" href="/forum.html">⌬ 苦海论坛</a>
        <span class="guest-chip"><span class="avatar">${escapeHtml(initial)}</span>${escapeHtml(nick)}</span>
        <a class="link" href="javascript:void(0)" onclick="openAuth('login')">登录</a>
        <a class="link" href="javascript:void(0)" onclick="openAuth('register')">注册</a>
        <span class="logout" onclick="exitGame()">退出</span>`;
    }
  }
  window.exitGame = function () { gameAuth.clear(); location.reload(); };

  // ===== 游戏站登录 / 注册 =====
  let authMode = 'login';
  window.openAuth = function (mode) {
    authMode = mode === 'register' ? 'register' : 'login';
    document.getElementById('authTitle').textContent = authMode === 'login' ? '登录游戏站' : '注册游戏站账号';
    document.getElementById('a-nick-field').style.display = authMode === 'register' ? '' : 'none';
    document.getElementById('a-msg').textContent = '';
    document.getElementById('a-switch').innerHTML = authMode === 'login'
      ? '还没有账号？<a href="javascript:void(0)" onclick="openAuth(\'register\')" style="color:#8b5cf6">去注册</a>'
      : '已有账号？<a href="javascript:void(0)" onclick="openAuth(\'login\')" style="color:#8b5cf6">去登录</a>';
    document.getElementById('authOverlay').classList.add('show');
  };
  window.closeAuth = function () { document.getElementById('authOverlay').classList.remove('show'); };
  window.submitAuth = async function () {
    const username = document.getElementById('a-username').value.trim();
    const password = document.getElementById('a-password').value;
    const nickname = document.getElementById('a-nickname').value.trim();
    const msg = document.getElementById('a-msg');
    msg.style.color = '#dc2626';
    if (!username || !password) { msg.textContent = '请填写用户名和密码'; return; }
    const btn = document.getElementById('aBtn');
    btn.disabled = true;
    try {
      if (authMode === 'register') {
        const r = await gameApi('/api/game/register', { method: 'POST', body: JSON.stringify({ username, password, nickname }) });
        msg.style.color = '#16a34a';
        msg.textContent = r.message;
        // 注册成功切到登录页（用户名保留）
        openAuth('login');
        document.getElementById('a-username').value = username;
        document.getElementById('a-password').value = '';
      } else {
        const r = await gameApi('/api/game/login', { method: 'POST', body: JSON.stringify({ username, password }) });
        gameAuth.setToken(r.token);
        gameAuth.setUser(r.user);
        closeAuth();
        renderNav();
        toast(`欢迎回来，${r.user.nickname || r.user.username}`);
      }
    } catch (e) { msg.textContent = e.message; }
    btn.disabled = false;
  };

  // ===== 密码门禁 =====
  // 眼睛按钮：切换明文/圆点隐藏（默认明文，确保中文输入法可启动）
  window.togglePw = function () {
    const input = document.getElementById('gate-pw');
    const btn = document.getElementById('pw-toggle');
    input.classList.toggle('hide');
    btn.textContent = input.classList.contains('hide') ? '🙈' : '👁';
  };

  window.submitGate = async function () {
    const btn = document.getElementById('gate-btn');
    const err = document.getElementById('gate-err');
    const pw = document.getElementById('gate-pw').value.trim();
    if (!pw) { err.textContent = '请输入访问密码'; return; }
    btn.disabled = true;
    err.textContent = '';
    try {
      const data = await gameApi('/api/game/enter', { method: 'POST', body: JSON.stringify({ password: pw }) });
      gameAuth.setToken(data.token);
      document.getElementById('gate').style.display = 'none';
      toast('欢迎进入游戏站 🎮');
      renderNav();
      load(1);
    } catch (e) {
      err.textContent = e.message;
      btn.disabled = false;
    }
  };

  // 校验已有 token；失效则重新弹密码门禁
  async function ensureEntered() {
    if (!gameAuth.isEntered()) return false;
    try {
      const me = await gameApi('/api/game/me');
      if (me.user) gameAuth.setUser(me.user); // 刷新账号信息（昵称/角色可能变更）
      return true;
    } catch {
      gameAuth.clear();
      return false;
    }
  }

  // 未进入时隐藏主内容，只显示门禁
  if (!gameAuth.isEntered()) {
    document.getElementById('main').style.display = 'none';
    document.getElementById('gate-pw').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitGate();
    });
  } else {
    ensureEntered().then((ok) => {
      if (ok) { document.getElementById('gate').style.display = 'none'; renderNav(); load(1); }
      else { document.getElementById('main').style.display = 'none'; }
    });
  }

  window.setSort = function (s) {
    state.sort = s;
    ['new','hot','top'].forEach(k =>
      document.getElementById('tab-' + k).classList.toggle('active', k === s));
    load(1);
  };

  async function load(page = 1) {
    state.page = Math.max(1, page);
    state.keyword = document.getElementById('kw').value.trim();
    // 首页搜索时记录历史（同一关键词只记一次）
    if (state.page === 1 && state.keyword && state.keyword !== lastLoggedKw) {
      lastLoggedKw = state.keyword;
      addHistory(state.keyword);
    }
    const qs = new URLSearchParams({ page: state.page, size: state.size, sort: state.sort });
    if (state.keyword) qs.set('keyword', state.keyword);
    try {
      const data = await gameApi(`${API}?${qs}`);
      state.total = data.total;
      render(data.rows);
      renderPager();
    } catch (e) {
      if (e.message.includes('访问密码') || e.message.includes('401')) {
        gameAuth.clear(); location.reload();
      } else toast(e.message, true);
    }
  }
  window.load = load;

  // ==================== 搜索增强（历史/热词/联想/高亮） ====================
  const HISTORY_KEY = 'kuhai_history';
  const HOT_WORDS = ['原神', '单机', '联机', '手游', 'PC', '推荐'];
  let lastLoggedKw = '';
  let suggestTimer = null, debounceTimer = null;

  function getHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; } }
  function saveHistory(h) { try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, 8))); } catch {} }
  function addHistory(kw) {
    kw = kw.trim(); if (!kw) return;
    saveHistory([kw, ...getHistory().filter(x => x !== kw)]);
  }
  function escapeAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  // 关键词高亮：先 split 再逐段转义，避免 XSS
  function hl(text, kw) {
    if (!kw) return escapeHtml(text);
    const parts = String(text).split(kw);
    return parts.map((p, i) => i < parts.length - 1 ? escapeHtml(p) + '<mark>' + escapeHtml(kw) + '</mark>' : escapeHtml(p)).join('');
  }
  function renderSuggest() {
    const kw = document.getElementById('kw').value.trim();
    const hist = getHistory();
    const secH = document.getElementById('sec-history');
    const secHot = document.getElementById('sec-hot');
    const secList = document.getElementById('sec-list');
    secH.style.display = hist.length ? '' : 'none';
    document.getElementById('suggest-history').innerHTML = hist.map(w =>
      `<span class="chip" data-kw="${escapeAttr(w)}" onclick="searchWith(this.dataset.kw)">${escapeHtml(w)}<span class="x" onclick="removeHistory(event, this)">✕</span></span>`).join('');
    secHot.style.display = kw ? 'none' : '';
    document.getElementById('suggest-hot').innerHTML = HOT_WORDS.map(w =>
      `<span class="chip" onclick="searchWith('${escapeAttr(w)}')">${escapeHtml(w)}</span>`).join('');
    const show = hist.length || !kw;
    document.getElementById('suggest').style.display = show ? '' : 'none';
    if (!kw) secList.style.display = 'none';
  }
  function fetchSuggest() {
    const kw = document.getElementById('kw').value.trim();
    const secList = document.getElementById('sec-list');
    const box = document.getElementById('suggest-list');
    if (!kw) { secList.style.display = 'none'; return; }
    gameApi(`${API}/suggest?keyword=${encodeURIComponent(kw)}&limit=6`)
      .then(d => {
        if (!d.rows || !d.rows.length) { secList.style.display = 'none'; return; }
        box.innerHTML = d.rows.map(r =>
          `<button class="item" onclick="searchWith('${escapeAttr(r.title)}')">${hl(r.title, kw)}</button>`).join('');
        secList.style.display = '';
      }).catch(() => { secList.style.display = 'none'; });
  }
  window.searchWith = function (kw) {
    kw = (kw || '').trim();
    if (!kw) return;
    document.getElementById('kw').value = kw;
    document.getElementById('suggest').style.display = 'none';
    addHistory(kw);
    state.keyword = kw;
    load(1);
  };
  window.clearKw = function (e) {
    if (e) e.stopPropagation();
    const input = document.getElementById('kw');
    input.value = '';
    document.getElementById('kwClear').style.display = 'none';
    document.getElementById('suggest').style.display = 'none';
    if (state.keyword) { state.keyword = ''; load(1); }
    input.focus();
  };
  window.clearHistory = function (e) { if (e) e.stopPropagation(); localStorage.removeItem(HISTORY_KEY); renderSuggest(); };
  window.removeHistory = function (e, el) {
    e.stopPropagation();
    saveHistory(getHistory().filter(x => x !== el.parentElement.getAttribute('data-kw')));
    renderSuggest();
  };
  // ==================== /搜索增强 ====================

  function render(rows) {
    const grid = document.getElementById('grid');
    if (!rows.length) {
      grid.innerHTML = state.keyword
        ? `<div class="empty">没有找到与「${escapeHtml(state.keyword)}」相关的游戏<br /><span style="font-size:13px;color:#94a3b8">换个关键词试试，或看看全部游戏</span></div>`
        : `<div class="empty">还没有游戏分享，点击「分享游戏」上传第一个吧 🎮</div>`;
      document.getElementById('pager').style.display = 'none';
      return;
    }
    document.getElementById('pager').style.display = 'flex';
    grid.innerHTML = rows.map(g => {
      const imgs = parseImages(g.images);
      const cover = imgs[0];
      return `
        <div class="game-card" onclick="location.href='/game-post.html?id=${g.id}'">
          <div class="cover">
            ${cover ? `<img src="${escapeHtml(cover)}" alt="" loading="lazy" />` : `<span class="ph">🎮</span>`}
            <span class="tag">${g.pinned ? '📌 ' : ''}${g.featured ? '⭐ ' : ''}游戏</span>
          </div>
          <div class="gbody">
            <h3>${hl(g.title, state.keyword)}</h3>
            <div class="gauthor">👤 ${escapeHtml(g.author_name)}</div>
            <div class="gmeta">
              <span>❤️ ${g.upvotes}</span>
              <span>💬 ${g.comment_count}</span>
              <span>👁 ${g.views}</span>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function renderPager() {
    const totalPages = Math.max(1, Math.ceil(state.total / state.size));
    document.getElementById('pagerInfo').textContent = `共 ${state.total} 个游戏`;
    document.getElementById('pageNow').textContent = `${state.page} / ${totalPages}`;
    document.querySelector('#pager .pages button:nth-child(1)').disabled = state.page <= 1;
    document.querySelector('#pager .pages button:nth-child(3)').disabled = state.page >= totalPages;
  }

  // 弹窗
  window.openShare = function () {
    const isLogin = gameAuth.isLoggedIn();
    const nickInput = document.getElementById('f-nick');
    nickInput.value = isLogin ? '' : gameAuth.nickname();
    nickInput.disabled = isLogin;
    nickInput.placeholder = isLogin ? '登录账号自动署名' : '例如：肝帝小明';
    document.getElementById('f-nick-label').textContent = isLogin
      ? `你的身份：${escapeHtml(gameAuth.nickname())}${gameAuth.isAdmin() ? '（游戏站管理员）' : ''}`
      : '你的昵称 *（游戏站内显示，不涉及苦海账号）';
    document.getElementById('f-title').value = '';
    document.getElementById('f-content').value = '';
    pendingImages = [];
    renderPending();
    document.getElementById('overlay').classList.add('show');
  };
  window.closeModal = function () { document.getElementById('overlay').classList.remove('show'); };

  function renderPending() {
    document.getElementById('up-hint').textContent =
      pendingImages.length ? `已选 ${pendingImages.length} 张` : '';
    document.getElementById('up-preview').innerHTML = pendingImages.map((u, i) =>
      `<div class="u"><img src="${escapeHtml(u)}" alt=""><button class="rm" onclick="removePending(${i})">×</button></div>`
    ).join('');
  }
  window.removePending = function (i) { pendingImages.splice(i, 1); renderPending(); };

  document.getElementById('f-file').addEventListener('change', async (e) => {
    const files = [...e.target.files];
    if (!files.length) return;
    if (pendingImages.length + files.length > 9) {
      toast('最多上传 9 张', true); e.target.value = ''; return;
    }
    document.getElementById('up-hint').textContent = '处理并上传中…';
    for (const f of files) {
      if (!f.type.startsWith('image/')) { toast('仅支持图片', true); continue; }
      try {
        const processed = await processImageForUpload(f);
        const fd = new FormData();
        fd.append('file', processed);
        const data = await gameApi(`${API}/upload`, { method: 'POST', body: fd });
        pendingImages.push(data.url);
      } catch (err) { toast(err.message, true); }
    }
    e.target.value = '';
    renderPending();
  });

  window.submitGame = async function () {
    const isLogin = gameAuth.isLoggedIn();
    const payload = {
      title: document.getElementById('f-title').value.trim(),
      content: document.getElementById('f-content').value.trim(),
      images: pendingImages,
    };
    if (!payload.title || !payload.content) return toast('游戏名称和介绍必填', true);
    if (!isLogin) {
      const nickname = document.getElementById('f-nick').value.trim();
      if (!nickname) return toast('请填写你的昵称', true);
      gameAuth.setNickname(nickname);
      payload.nickname = nickname;
      payload.visitorId = gameAuth.visitorId();
    }
    const btn = document.getElementById('pubBtn');
    btn.disabled = true;
    try {
      const post = await gameApi(API, { method: 'POST', body: JSON.stringify(payload) });
      toast('发布成功');
      closeModal();
      location.href = `/game-post.html?id=${post.id}`;
    } catch (e) { toast(e.message, true); }
    btn.disabled = false;
  };

  const kwInput = document.getElementById('kw');
  kwInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { clearTimeout(debounceTimer); clearTimeout(suggestTimer); load(1); }
  });
  kwInput.addEventListener('input', () => {
    const v = kwInput.value;
    document.getElementById('kwClear').style.display = v ? '' : 'none';
    clearTimeout(suggestTimer); clearTimeout(debounceTimer);
    renderSuggest();
    suggestTimer = setTimeout(fetchSuggest, 300);
    debounceTimer = setTimeout(() => { if (kwInput.value.trim()) load(1); }, 400);
  });
  kwInput.addEventListener('focus', () => { renderSuggest(); document.getElementById('suggest').style.display = ''; });
  kwInput.addEventListener('blur', () => { setTimeout(() => { document.getElementById('suggest').style.display = 'none'; }, 200); });
  document.getElementById('overlay').addEventListener('click', e => {
    if (e.target.id === 'overlay') closeModal();
  });
  document.getElementById('authOverlay').addEventListener('click', e => {
    if (e.target.id === 'authOverlay') closeAuth();
  });
</script>
</body>
</html>
